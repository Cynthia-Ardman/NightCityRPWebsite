      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/EmployeeInput" }
      responses:
        "201":
          description: Invitation created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EmployeeInviteResult" }
        "400": { description: Character missing/archived/unclaimed }
        "409": { description: Already an employee or invite already pending }
  /stores/{id}/employees/{employeeId}:
    parameters:
      - { in: path, name: id, required: true, schema: { type: integer } }
      - { in: path, name: employeeId, required: true, schema: { type: integer } }
    patch:
      operationId: updateStoreEmployee
      tags: [stores]
      summary: Update an employee's role and/or commission percentage
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/EmployeePatch" }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Employee" }
        "403": { description: Forbidden }
        "404": { description: Not found }
    delete:
      operationId: removeStoreEmployee
      tags: [stores]
      responses:
        "204": { description: Removed }
  /stores/{id}/sell:
    parameters:
      - { in: path, name: id, required: true, schema: { type: integer } }
    post:
      operationId: sellStoreItem
      tags: [stores]
      summary: Owner/employee sells stock to a buyer instantly (charges the buyer + transfers the item now)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/StoreSaleInput" }
      responses:
        "200":
          description: Sale completed (or dry-run preview in Test mode)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApproveOfferResult" }
        "400": { description: Bad request or buyer has insufficient funds }
        "404": { description: Not found }
        "409": { description: "Out of stock, buyer unclaimed, or economy disabled" }
        "502": { description: Wallet provider unavailable }
  /stores/{id}/purchase:
    parameters:
      - { in: path, name: id, required: true, schema: { type: integer } }
    post:
      operationId: purchaseStoreStock
      tags: [stores]
      summary: Owner/employee/fixer buys catalog stock into the store, paid from the store account (fixer custom cost routes owner approval)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/StockPurchaseInput" }
      responses:
        "201":
          description: Stock purchased
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StockPurchaseResult" }
        "400": { description: Bad request or store account has insufficient funds }
        "403": { description: Not authorized to buy stock for this venue }
        "404": { description: Venue or catalog item not found }
  /stores/{id}/offers:
    parameters:
