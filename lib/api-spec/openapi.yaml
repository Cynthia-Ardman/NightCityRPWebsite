        archived: { type: boolean }
        lifeStatus:
          type: string
          enum: [active, dead, missing, loa, retired]
          description: "Headline character status shown on sheets. Editable by the owner via PATCH /characters/{id}."
        lifestyleTierId: { type: ["integer", "null"] }
        lifestyleTier:
          oneOf:
            - { type: "null" }
            - { $ref: "#/components/schemas/LifestyleTier" }
        traumaTeamTier:
          type: ["string", "null"]
          enum: [silver, gold, platinum, diamond, corporate, null]
          description: "Trauma Team subscription tier. Billed monthly from bot_config.trauma_team_costs. Null = no subscription."
        xanaduGold:
          type: boolean
          description: "Xanadu Gold premium membership. Flat monthly fee from bot_config.xanadu_gold_cost."
        lastCheckupAt:
          type: ["string", "null"]
          format: date-time
          description: "Timestamp of the last ripperdoc checkup. Null = never had one."
        checkupStreak:
          type: integer
          description: "Consecutive weekly cron ticks since the last checkup. Multiplies the weekly meds bill (1× → 10× max)."
        cyberwareLevel:
          type: string
          enum: [none, medium, high, extreme]
          description: "Cyberware-risk band set by a ripperdoc on checkup. Drives the weekly meds cap in the cyberware cron: none=no charge, medium=2k cap, high=5k cap, extreme=10k cap."
        isOrganic:
          type: boolean
          description: "Marks this character as having zero chrome on purpose (CWP=0 in the importer). Suppresses missing-cyberware warnings on the dashboard."
        createdAt: { type: string, format: date-time }

    SheetData:
      type: object
      required: [preamble, sections]
      # Sheet-created characters store discrete story fields plus gear/guns/
      # identity at the top level of sheetData. additionalProperties keeps those
      # extra keys (they pass through validation untouched) so a story edit can
      # send a merged blob without dropping anything the new-character form saved.
      additionalProperties: true
      properties:
        preamble: { type: string }
        sections:
          type: object
          additionalProperties: { type: string }
        physicalDescription: { type: string }
        appearance: { type: string }
        psychProfile: { type: string }
        hooks: { type: string }
        skills: { type: string }
        ripperDoc: { type: boolean, description: "When true, grants the RipperDoc Discord role to the character's owner on save." }
        fbc: { type: boolean, description: "Self-declared Full Body Conversion flag. Purely informational — no programmatic effect (medical-grade only, no advantages, no combat cyberware)." }
        ncpd: { type: boolean, description: "Self-declared NCPD officer flag. Purely informational — surfaces this character on the NCPD officer roster (only effective when the owner holds the NCPD Discord role)." }

    PublicCharacterSummary:
      type: object
