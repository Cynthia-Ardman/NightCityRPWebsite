        effective: { type: boolean, description: "Whether the system is actually Live right now (master AND configured)." }

    LiveModeSystems:
      type: object
      required: [missions, housing, cyberware, evictions]
      properties:
        missions: { $ref: "#/components/schemas/SystemLiveState" }
        housing: { $ref: "#/components/schemas/SystemLiveState" }
        cyberware: { $ref: "#/components/schemas/SystemLiveState" }
        evictions: { $ref: "#/components/schemas/SystemLiveState" }

    LiveModeState:
      type: object
      required: [master, systems]
      description: "Site-wide Test/Live switches. A system is effectively live only when master AND that system are both true."
      properties:
        master: { type: boolean }
        systems: { $ref: "#/components/schemas/LiveModeSystems" }

    LiveModeUpdate:
