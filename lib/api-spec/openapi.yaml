              schema: { $ref: "#/components/schemas/VenueAccountResult" }
        "400": { description: Bad amount or insufficient venue balance }
        "403": { description: Not the owner }
        "404": { description: Not found }
        "409": { description: Economy disabled }
        "502": { description: Wallet sync failed }
