  # ---------------- CHARACTER SHEETS ----------------
  /sheets:
    get:
      operationId: listMySheets
      tags: [sheets]
      summary: My submitted character sheets
      responses:
        "200":
          description: Sheets
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/CharacterSheet" }
    post:
      operationId: submitSheet
      tags: [sheets]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CharacterSheetInput" }
      responses:
        "201":
          description: Submitted; CS Approvers notified on Discord
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CharacterSheet" }
  /sheets/pending:
    get:
      operationId: listPendingSheets
      tags: [sheets]
      summary: Pending sheets (reviewers only) with per-sheet vote tallies
      responses:
        "200":
          description: Pending
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/PendingSheetSummary" }
  /sheets/{id}:
    parameters:
      - { in: path, name: id, required: true, schema: { type: integer } }
    get:
      operationId: getSheet
      tags: [sheets]
      responses:
        "200":
          description: Sheet
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CharacterSheet" }
    patch:
      operationId: updateSheet
      tags: [sheets]
      summary: Owner updates a draft or changes_requested sheet
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CharacterSheetPatchInput" }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CharacterSheet" }
    delete:
      operationId: deleteSheet
      tags: [sheets]
      summary: Owner deletes a draft
      responses:
        "204": { description: Deleted }
  /sheets/{id}/submit:
    parameters:
      - { in: path, name: id, required: true, schema: { type: integer } }
    post:
      operationId: submitDraftSheet
      tags: [sheets]
      summary: Promote a draft (or changes_requested) sheet to pending review
      responses:
        "200":
          description: Submitted
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CharacterSheet" }
  /sheets/{id}/vote:
    parameters:
      - { in: path, name: id, required: true, schema: { type: integer } }
    post:
      operationId: voteSheet
      tags: [sheets]
      summary: Cast or change your approve/reject vote on a pending sheet. When the tally reaches majority the sheet is decided (approve materializes the character).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SheetVoteInput" }
      responses:
        "200":
          description: Vote recorded (and possibly decided)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SheetVoteResult" }
        "400": { description: Bad request }
        "403": { description: Reviewers only / cannot vote on own sheet }
        "404": { description: Not found }
        "409": { description: Already decided }
  /sheets/{id}/override:
    parameters:
      - { in: path, name: id, required: true, schema: { type: integer } }
    post:
      operationId: overrideSheet
      tags: [sheets]
      summary: Admin-only immediate approval that bypasses the vote and materializes the character. Records overriddenBy.
      responses:
        "200":
          description: Approved via override
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CharacterSheet" }
        "403": { description: Admin only }
        "404": { description: Not found }
        "409": { description: Already decided }
  /sheets/{id}/request-changes:
    parameters:
      - { in: path, name: id, required: true, schema: { type: integer } }
    post:
      operationId: requestChangesSheet
      tags: [sheets]
      summary: A reviewer parks the sheet in changes_requested with a comment and DMs the owner. The owner resubmits via /sheets/{id}/submit.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RequestChangesInput" }
      responses:
        "200":
          description: Changes requested
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CharacterSheet" }
        "400": { description: A comment is required }
        "403": { description: Reviewers only / cannot review own sheet }
        "404": { description: Not found }
        "409": { description: Already decided }

