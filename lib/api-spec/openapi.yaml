      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ServiceBillInput" }
      responses:
        "201":
          description: Pending service bill created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SaleOffer" }
        "400": { description: "Missing/invalid amount or note, or character archived" }
