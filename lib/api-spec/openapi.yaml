        archetype: { type: ["string", "null"] }
        background: { type: ["string", "null"] }
        lifeStatus: { type: string, enum: [active, dead, missing, loa, retired], default: active }
        traumaTeamTier:
          type: ["string", "null"]
          enum: [silver, gold, platinum, diamond, corporate, null]
          description: "Trauma Team subscription tier; omit/null for none."
