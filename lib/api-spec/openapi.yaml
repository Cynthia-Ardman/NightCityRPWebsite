        portraitUrls:
          type: array
          items: { type: string }
          description: "Already-uploaded object-storage paths from the presigned-URL flow."
        statsImageUrls:
          type: array
          items: { type: string }
          description: "Already-uploaded stat/sheet image paths from the presigned-URL flow."
