      parameters:
        - in: query
          name: status
          required: false
          schema: { type: string, enum: [pending, approved, rejected, changes_requested], default: pending }
      responses:
        "200":
          description: Custom requests
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/CustomRequest" }
        "403": { description: Fixer or admin only }
    post:
      operationId: submitCustomRequest
      tags: [requests]
      summary: Submit a custom request for one of the signed-in user's characters.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CustomRequestInput" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CustomRequest" }
        "400": { description: Bad request }
        "404": { description: Character not found }
  /requests/mine:
    get:
      operationId: listMyCustomRequests
      tags: [requests]
      summary: The signed-in user's own custom requests.
      parameters:
        - in: query
          name: type
          required: false
          schema: { type: string, enum: [property, gun, cyberware, store, ripperdoc, employee_invite, venue_stock] }
      responses:
        "200":
          description: Requests
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/CustomRequest" }
  /requests/{id}/vote:
    parameters:
      - { in: path, name: id, required: true, schema: { type: integer } }
    post:
      operationId: voteCustomRequest
      tags: [requests]
      summary: Cast or change your approve/reject vote on a custom request. An approve vote carries the mechanical params for the type (property/cyberware). When the tally reaches majority the request is decided and auto-applied.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CustomRequestVoteInput" }
      responses:
        "200":
          description: Vote recorded (and possibly decided)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CustomRequestVoteResult" }
        "400": { description: Bad request }
        "403": { description: Reviewers only / cannot vote on own request }
        "404": { description: Not found }
        "409": { description: Already decided }
  /requests/{id}/override:
    parameters:
      - { in: path, name: id, required: true, schema: { type: integer } }
    post:
      operationId: overrideCustomRequest
      tags: [requests]
      summary: Admin-only immediate approval that bypasses the vote and auto-applies. Records overriddenBy.
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CustomRequestApproval" }
      responses:
        "200":
          description: Approved via override
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CustomRequest" }
        "400": { description: Bad request }
        "403": { description: Admin only }
        "404": { description: Not found }
        "409": { description: Already decided }
  /requests/{id}/request-changes:
    parameters:
      - { in: path, name: id, required: true, schema: { type: integer } }
    post:
      operationId: requestChangesCustomRequest
      tags: [requests]
      summary: A reviewer parks the request in changes_requested with a comment and DMs the player.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RequestChangesInput" }
      responses:
        "200":
          description: Changes requested
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CustomRequest" }
        "400": { description: A comment is required }
        "403": { description: Reviewers only / cannot review own request }
        "404": { description: Not found }
        "409": { description: Already decided }
  /requests/{id}/resubmit:
    parameters:
      - { in: path, name: id, required: true, schema: { type: integer } }
    post:
      operationId: resubmitCustomRequest
      tags: [requests]
      summary: The requester sends a changes_requested request back to the review queue. Clears prior votes. Allowed with no edits.
      responses:
        "200":
          description: Resubmitted
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CustomRequest" }
        "403": { description: Only the requester can resubmit }
        "404": { description: Not found }
        "409": { description: Not awaiting changes }
  /requests/{id}:
    parameters:
      - { in: path, name: id, required: true, schema: { type: integer } }
    patch:
      operationId: updateCustomRequest
      tags: [requests]
      summary: The requester (or admin) edits a request while it is pending or changes_requested.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CustomRequestPatchInput" }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CustomRequest" }
        "403": { description: Only the requester can edit }
        "404": { description: Not found }
        "409": { description: No longer editable }
  /requests/{id}/stock-decision:
    parameters:
      - { in: path, name: id, required: true, schema: { type: integer } }
    post:
      operationId: decideStockCostRequest
      tags: [requests]
      summary: Venue owner approves or rejects a fixer/admin-proposed stock-cost request. Approving debits the venue balance and adds the stock.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/StockCostDecision" }
      responses:
        "200":
          description: Decided
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CustomRequest" }
        "400": { description: "Bad request, not a stock-cost request, or venue has insufficient funds" }
        "403": { description: "Only the venue owner (or an admin) may decide" }
        "404": { description: Not found }
        "409": { description: Already reviewed }
  /requests/{id}/employee-decision:
    parameters:
      - { in: path, name: id, required: true, schema: { type: integer } }
    post:
      operationId: decideEmployeeInvite
      tags: [requests]
      summary: The invited character's player (or an admin) accepts or denies an employment invitation. Accepting finalizes employment; denying discards it.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/EmployeeDecisionInput" }
      responses:
        "200":
          description: Decided
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CustomRequest" }
        "400": { description: "Bad request or not an employee-invite request" }
        "403": { description: "Only the invited character's player (or an admin) may decide" }
        "404": { description: Not found }
        "409": { description: Already reviewed }

  # ---------------- LORE DIRECTORY ----------------
  /directory/lore:
    get:
      operationId: listLore
      tags: [lore]
      summary: Public list of lore entries (no fixer-only bodies).
      parameters:
        - in: query
          name: category
          required: false
          schema: { type: string, enum: [corporation, gang, faction, misc] }
        - in: query
          name: q
          required: false
          schema: { type: string }
      responses:
        "200":
          description: Lore entries
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/LoreEntrySummary" }
    post:
      operationId: createLore
      tags: [lore]
      summary: Create a lore entry (admin only — publishes directly).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LoreEntryInput" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LoreEntry" }
        "400": { description: Invalid payload }
        "403": { description: Admin only }
  /directory/lore/{id}:
    parameters:
      - { in: path, name: id, required: true, schema: { type: integer } }
    get:
      operationId: getLore
      tags: [lore]
      summary: Lore entry detail. Fixer-only body + sources only returned to staff.
      responses:
        "200":
          description: Lore entry
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LoreEntry" }
        "404": { description: Not found }
    patch:
      operationId: updateLore
      tags: [lore]
      summary: Edit a lore entry (admin only — publishes directly).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LoreEntryUpdate" }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LoreEntry" }
        "400": { description: Invalid payload }
        "403": { description: Admin only }
        "404": { description: Not found }
    delete:
      operationId: deleteLore
      tags: [lore]
      summary: Delete a lore entry (admin only).
      responses:
        "204": { description: Deleted }
        "403": { description: Admin only }
        "404": { description: Not found }
  /directory/lore/edits:
    get:
      operationId: listLoreEdits
      tags: [lore]
      summary: List fixer-proposed lore edits awaiting decision (fixer/admin).
      parameters:
        - in: query
          name: status
          required: false
          schema: { type: string, enum: [pending, approved, rejected], default: pending }
      responses:
        "200":
          description: Proposed edits
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/LorePendingEdit" }
        "403": { description: Fixer or admin only }
    post:
      operationId: submitLoreEdit
      tags: [lore]
      summary: Propose a lore create/edit for admin approval (fixer/admin).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LoreEditProposalInput" }
      responses:
        "201":
          description: Submitted
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LorePendingEdit" }
        "400": { description: Invalid payload }
        "403": { description: Fixer or admin only }
  /directory/lore/edits/mine:
    get:
      operationId: listMyLoreEdits
      tags: [lore]
      summary: The signed-in fixer's own lore submissions across all statuses (fixer/admin).
      responses:
        "200":
          description: The caller's proposed edits
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/LorePendingEdit" }
        "403": { description: Fixer or admin only }
  /directory/lore/edits/{id}/approve:
    parameters:
      - { in: path, name: id, required: true, schema: { type: integer } }
    post:
      operationId: approveLoreEdit
      tags: [lore]
      summary: Approve a proposed lore edit and apply it (admin only).
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LoreEditDecision" }
      responses:
        "200":
          description: Approved
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LorePendingEdit" }
        "403": { description: Admin only }
        "404": { description: Not found }
        "409": { description: Already reviewed }
  /directory/lore/edits/{id}/reject:
    parameters:
      - { in: path, name: id, required: true, schema: { type: integer } }
    post:
      operationId: rejectLoreEdit
      tags: [lore]
      summary: Reject a proposed lore edit (admin only).
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LoreEditDecision" }
      responses:
        "200":
          description: Rejected
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LorePendingEdit" }
        "403": { description: Admin only }
        "404": { description: Not found }
        "409": { description: Already reviewed }
  /directory/lore/import/run:
    post:
      operationId: runLoreImport
      tags: [lore]
      summary: Scan the Discord lore forum + linked Google Docs into draft queue (admin only).
      responses:
        "200":
          description: Import summary
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LoreImportRunResult" }
        "403": { description: Admin only }
  /directory/lore/import/drafts:
    get:
      operationId: listLoreImportDrafts
      tags: [lore]
      summary: List lore import drafts awaiting review (admin only).
      parameters:
        - in: query
          name: status
          required: false
          schema: { type: string, enum: [pending, approved, discarded], default: pending }
      responses:
        "200":
          description: Drafts
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/LoreImportDraft" }
        "403": { description: Admin only }
  /directory/lore/import/drafts/{id}:
    parameters:
      - { in: path, name: id, required: true, schema: { type: integer } }
    patch:
      operationId: updateLoreImportDraft
      tags: [lore]
      summary: Edit a lore import draft before approving (admin only).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LoreImportDraftUpdate" }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LoreImportDraft" }
        "400": { description: Invalid payload }
        "403": { description: Admin only }
        "404": { description: Not found }
  /directory/lore/import/drafts/{id}/approve:
    parameters:
      - { in: path, name: id, required: true, schema: { type: integer } }
    post:
      operationId: approveLoreImportDraft
      tags: [lore]
      summary: Promote a draft into a published lore entry (create or merge) (admin only).
      responses:
        "200":
          description: Approved
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LoreEntry" }
        "403": { description: Admin only }
        "404": { description: Not found }
        "409": { description: Already decided }
  /directory/lore/import/drafts/{id}/discard:
    parameters:
      - { in: path, name: id, required: true, schema: { type: integer } }
    post:
      operationId: discardLoreImportDraft
      tags: [lore]
      summary: Discard a lore import draft (admin only).
      responses:
        "200":
          description: Discarded
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LoreImportDraft" }
        "403": { description: Admin only }
        "404": { description: Not found }
        "409": { description: Already decided }

components:
  schemas:
    LoreSource:
      type: object
      required: [label, url]
      properties:
        label: { type: string }
        url: { type: string }

    LoreEntrySummary:
      type: object
      required: [id, category, name, slug, aliases, hasFixerContent, updatedAt]
      properties:
        id: { type: integer }
        category: { type: string, enum: [corporation, gang, faction, misc] }
        name: { type: string }
        slug: { type: string }
        aliases:
          type: array
          items: { type: string }
        summary: { type: ["string", "null"] }
        responsibleFixer: { type: ["string", "null"] }
        hasFixerContent: { type: boolean }
        updatedAt: { type: string, format: date-time }

    LoreEntry:
      type: object
      required: [id, category, name, slug, aliases, publicBody, canViewFixer, createdAt, updatedAt]
      properties:
        id: { type: integer }
        category: { type: string, enum: [corporation, gang, faction, misc] }
        name: { type: string }
        slug: { type: string }
        aliases:
          type: array
          items: { type: string }
        summary: { type: ["string", "null"] }
        responsibleFixer: { type: ["string", "null"] }
        publicBody: { type: string }
        # Only present (non-null) when the caller is ADMIN/FIXER.
        fixerBody: { type: ["string", "null"] }
        # Only populated for ADMIN/FIXER; empty array otherwise.
        sources:
          type: array
          items: { $ref: "#/components/schemas/LoreSource" }
        # True when the caller may see fixer-only content (drives the UI tab).
        canViewFixer: { type: boolean }
        hasFixerContent: { type: boolean }
        createdById: { type: ["string", "null"] }
        updatedById: { type: ["string", "null"] }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    LoreEntryInput:
      type: object
      required: [category, name]
      properties:
        category: { type: string, enum: [corporation, gang, faction, misc] }
        name: { type: string }
        summary: { type: ["string", "null"] }
        responsibleFixer: { type: ["string", "null"] }
        aliases:
          type: array
          items: { type: string }
        publicBody: { type: string }
        fixerBody: { type: ["string", "null"] }
        sources:
          type: array
          items: { $ref: "#/components/schemas/LoreSource" }

    LoreEntryUpdate:
      type: object
      properties:
        category: { type: string, enum: [corporation, gang, faction, misc] }
        name: { type: string }
        summary: { type: ["string", "null"] }
        responsibleFixer: { type: ["string", "null"] }
        aliases:
          type: array
          items: { type: string }
        publicBody: { type: string }
        fixerBody: { type: ["string", "null"] }
        sources:
          type: array
          items: { $ref: "#/components/schemas/LoreSource" }

    LoreEditProposalInput:
      type: object
      required: [kind, diff]
      properties:
        # null for a brand-new entry proposal; set to edit an existing entry.
        loreEntryId: { type: ["integer", "null"] }
        kind: { type: string, enum: [create, edit] }
        diff: { $ref: "#/components/schemas/LoreEntryUpdate" }
        updateNote: { type: ["string", "null"] }

    LorePendingEdit:
      type: object
      required: [id, kind, submittedBy, proposedDiff, status, createdAt]
      properties:
        id: { type: integer }
        loreEntryId: { type: ["integer", "null"] }
        entryName: { type: ["string", "null"] }
        kind: { type: string, enum: [create, edit] }
        submittedBy: { type: string }
        submittedByName: { type: ["string", "null"] }
        proposedDiff: {}
        beforeSnapshot: {}
        updateNote: { type: ["string", "null"] }
        status: { type: string, enum: [pending, approved, rejected] }
        decidedById: { type: ["string", "null"] }
        decisionSummary: { type: ["string", "null"] }
        decidedAt: { type: ["string", "null"], format: date-time }
        appliedEntryId: { type: ["integer", "null"] }
        createdAt: { type: string, format: date-time }

    LoreEditDecision:
      type: object
      properties:
        decisionSummary: { type: ["string", "null"] }

    LoreImportDraft:
      type: object
      required: [id, groupKey, proposedName, proposedCategory, aliases, publicBody, sources, status, createdAt]
      properties:
        id: { type: integer }
        groupKey: { type: string }
        proposedName: { type: string }
        proposedCategory: { type: string, enum: [corporation, gang, faction, misc] }
        proposedFixer: { type: ["string", "null"] }
        aliases:
          type: array
          items: { type: string }
        summary: { type: ["string", "null"] }
        publicBody: { type: string }
        fixerBody: { type: ["string", "null"] }
        sources:
          type: array
          items: { $ref: "#/components/schemas/LoreSource" }
        suggestedMergeEntryId: { type: ["integer", "null"] }
        suggestedMergeName: { type: ["string", "null"] }
        status: { type: string, enum: [pending, approved, discarded] }
        appliedEntryId: { type: ["integer", "null"] }
        createdAt: { type: string, format: date-time }

    LoreImportDraftUpdate:
      type: object
      properties:
        proposedName: { type: string }
        proposedCategory: { type: string, enum: [corporation, gang, faction, misc] }
        proposedFixer: { type: ["string", "null"] }
        aliases:
          type: array
          items: { type: string }
        summary: { type: ["string", "null"] }
        publicBody: { type: string }
        fixerBody: { type: ["string", "null"] }
        sources:
          type: array
          items: { $ref: "#/components/schemas/LoreSource" }
        suggestedMergeEntryId: { type: ["integer", "null"] }

    LoreImportRunResult:
      type: object
      required: [scanned, created, duplicates, errors]
      properties:
        scanned: { type: integer }
        created: { type: integer }
        duplicates: { type: integer }
        errors:
          type: array
          items: { type: string }
    HealthStatus:
      type: object
      required: [status]
      properties:
        status: { type: string }

    Me:
      type: object
      required: [id, discordId, username, avatarUrl, roles, isAdmin, isFixer, isArchivist, isCsApprover, isRipperdoc, isStoreOwner]
      properties:
        id: { type: string }
        discordId: { type: string }
        username: { type: string }
        globalName: { type: ["string", "null"] }
        avatarUrl: { type: ["string", "null"] }
        roles:
          type: array
          items: { type: string }
        isAdmin: { type: boolean }
        isFixer: { type: boolean }
        isArchivist: { type: boolean }
        isCsApprover: { type: boolean }
        isRipperdoc: { type: boolean }
        isStoreOwner: { type: boolean }
        activeCharacterId: { type: ["integer", "null"] }
        vrchat:
          oneOf:
            - { $ref: "#/components/schemas/VrchatLinkSummary" }
            - { type: "null" }
          description: "Linked VRChat profile for this Discord user, or null if none registered."

    Character:
      type: object
      required: [id, name, kind, createdAt, claimed, archived, portraitUrls, statsImageUrls]
      properties:
        id: { type: integer }
        ownerId: { type: ["string", "null"] }
        claimed: { type: boolean }
        legacyDiscordUsername: { type: ["string", "null"] }
        name: { type: string }
        kind: { type: string, enum: [pc, npc] }
        archetype: { type: ["string", "null"] }
        background: { type: ["string", "null"] }
        portraitUrl: { type: ["string", "null"] }
        portraitUrls:
          type: array
          items: { type: string }
        statsImageUrls:
          type: array
          items: { type: string }
        sheetData:
          oneOf:
            - { type: "null" }
            - { $ref: "#/components/schemas/SheetData" }
        importedFromThreadId: { type: ["string", "null"] }
        importedFromChannelName: { type: ["string", "null"] }
        discordChannelId: { type: ["string", "null"] }
        isActive: { type: boolean }
        approved: { type: boolean }
        archived: { type: boolean }
        lifeStatus:
          type: string
          enum: [active, dead, missing, loa, retired]
          description: "Headline character status shown on sheets. Editable by the owner via PATCH /characters/{id}."
        lifestyleTierId: { type: ["integer", "null"] }
        lifestyleTier:
          oneOf:
            - { type: "null" }
            - { $ref: "#/components/schemas/LifestyleTier" }
        traumaTeamTier:
          type: ["string", "null"]
          enum: [silver, gold, platinum, diamond, null]
          description: "Trauma Team subscription tier. Billed monthly from bot_config.trauma_team_costs. Null = no subscription."
        xanaduGold:
          type: boolean
          description: "Xanadu Gold premium membership. Flat monthly fee from bot_config.xanadu_gold_cost."
        lastCheckupAt:
          type: ["string", "null"]
          format: date-time
          description: "Timestamp of the last ripperdoc checkup. Null = never had one."
        checkupStreak:
          type: integer
          description: "Consecutive weekly cron ticks since the last checkup. Multiplies the weekly meds bill (1× → 10× max)."
        cyberwareLevel:
          type: string
          enum: [none, medium, high, extreme]
          description: "Cyberware-risk band set by a ripperdoc on checkup. Drives the weekly meds cap in the cyberware cron: none=no charge, medium=2k cap, high=5k cap, extreme=10k cap."
        isOrganic:
          type: boolean
          description: "Marks this character as having zero chrome on purpose (CWP=0 in the importer). Suppresses missing-cyberware warnings on the dashboard."
        createdAt: { type: string, format: date-time }

    SheetData:
      type: object
      required: [preamble, sections]
      properties:
        preamble: { type: string }
        sections:
          type: object
          additionalProperties: { type: string }

    PublicCharacterSummary:
      type: object
      required: [id, name, kind, claimed, archived]
      properties:
        id: { type: integer }
        name: { type: string }
        kind: { type: string }
        archetype: { type: ["string", "null"] }
        portraitUrl: { type: ["string", "null"] }
        portraitUrls: { type: array, items: { type: string } }
        claimed: { type: boolean }
        archived: { type: boolean }
        legacyDiscordUsername: { type: ["string", "null"] }
        ownerName: { type: ["string", "null"] }
        vrchatUsername: { type: ["string", "null"], description: "Owner's linked VRChat display name, or null if unlinked/unclaimed." }
        vrchatUrl: { type: ["string", "null"], description: "Owner's VRChat profile URL, or null." }
        appliedTags: { type: array, items: { type: string }, description: "Discord forum tags applied to the source thread, resolved to display names." }
        tags: { type: array, items: { type: string }, description: "Merged display tag list (Discord-applied ∪ staff-added)." }
        lifeStatus:
          type: string
          enum: [active, dead, missing, loa, retired]

    PublicCharacter:
      allOf:
        - $ref: "#/components/schemas/Character"
        - type: object
          properties:
            ownerName: { type: ["string", "null"] }
            ownerAvatarUrl: { type: ["string", "null"] }
            tags: { type: array, items: { type: string }, description: "Merged display tag list (Discord-applied ∪ staff-added)." }

    ArchiveCharacterSummary:
      type: object
      required: [id, name, kind, claimed, archived, cwpBand, tags]
      properties:
        id: { type: integer }
        name: { type: string }
        kind: { type: string }
        archetype: { type: ["string", "null"] }
        portraitUrl: { type: ["string", "null"] }
        claimed: { type: boolean }
        archived: { type: boolean }
        lifeStatus:
          type: string
          enum: [active, dead, missing, loa, retired]
        cwpBand:
          type: string
          enum: [organic, none, medium, high, extreme]
        legacyDiscordUsername: { type: ["string", "null"] }
        importedFromChannelName: { type: ["string", "null"] }
        ownerId: { type: ["string", "null"] }
        ownerName: { type: ["string", "null"] }
        ownerAvatarUrl: { type: ["string", "null"] }
        vrchatUsername: { type: ["string", "null"] }
        vrchatUrl: { type: ["string", "null"] }
        fixerDiscordId: { type: ["string", "null"] }
        playerDiscordId: { type: ["string", "null"] }
        appliedTags: { type: array, items: { type: string } }
        tags: { type: array, items: { type: string } }
        createdAt: { type: string, format: date-time }

    ArchiveCharacter:
      type: object
      required: [id, name, kind, claimed, archived, cwpBand, tags]
      properties:
        id: { type: integer }
        name: { type: string }
        kind: { type: string }
        archetype: { type: ["string", "null"] }
        background: { type: ["string", "null"] }
        portraitUrl: { type: ["string", "null"] }
        portraitUrls: { type: array, items: { type: string } }
        statsImageUrls: { type: array, items: { type: string } }
        sheetData: {}
        claimed: { type: boolean }
        archived: { type: boolean }
        lifeStatus:
          type: string
          enum: [active, dead, missing, loa, retired]
        cwpBand:
          type: string
          enum: [organic, none, medium, high, extreme]
        legacyDiscordUsername: { type: ["string", "null"] }
        importedFromChannelName: { type: ["string", "null"] }
        appliedTags: { type: array, items: { type: string } }
        tags: { type: array, items: { type: string } }
        ownerId: { type: ["string", "null"] }
        ownerName: { type: ["string", "null"] }
        ownerAvatarUrl: { type: ["string", "null"] }
        fixerDiscordId: { type: ["string", "null"] }
        playerDiscordId: { type: ["string", "null"] }

    ArchiveUser:
      type: object
      required: [id, username]
      properties:
        id: { type: string }
        username: { type: string }
        globalName: { type: ["string", "null"] }
        avatarUrl: { type: ["string", "null"] }

    ArchiveEditInput:
      type: object
      required: [commitMessage]
      properties:
        commitMessage: { type: string, minLength: 1, description: "Required non-empty rationale; written to the audit log and changelog." }
        name: { type: string, minLength: 1 }
        archetype: { type: ["string", "null"] }
        ownerId: { type: ["string", "null"], description: "Internal users.id; null clears ownership (marks unclaimed)." }
        claimed: { type: boolean }
        kind: { type: string, enum: [pc, npc] }
        archived: { type: boolean }
        lifeStatus: { type: string, enum: [active, dead, missing, loa, retired], description: "Headline life-status column (drives the status badge/filter)." }
        cwpBand: { type: string, enum: [organic, none, medium, high, extreme] }
        fixerDiscordId: { type: ["string", "null"], description: "NPC responsible fixer Discord ID; null/empty clears." }
        playerDiscordId: { type: ["string", "null"], description: "NPC player Discord ID; null/empty clears." }
        tags: { type: array, items: { type: string }, description: "Full desired merged tag set." }
        sheetData:
          type: object
          required: [preamble, sections]
          properties:
            preamble: { type: string }
            sections: { type: object, additionalProperties: { type: string } }

    ArchiveEditResult:
      type: object
      required: [id, name, changed]
      properties:
        id: { type: integer }
        name: { type: string }
        kind: { type: string }
        archetype: { type: ["string", "null"] }
        claimed: { type: boolean }
        archived: { type: boolean }
        ownerId: { type: ["string", "null"] }
        fixerDiscordId: { type: ["string", "null"] }
        playerDiscordId: { type: ["string", "null"] }
        cwpBand:
          type: string
          enum: [organic, none, medium, high, extreme]
        tags: { type: array, items: { type: string } }
        changed: { type: array, items: { type: string } }

    AdminCharacterSummary:
      type: object
      required: [id, name, kind, claimed, archived, createdAt]
      properties:
        id: { type: integer }
        ownerId: { type: ["string", "null"] }
        ownerName: { type: ["string", "null"] }
        name: { type: string }
        kind: { type: string }
        archetype: { type: ["string", "null"] }
        approved: { type: boolean }
        archived: { type: boolean }
        claimed: { type: boolean }
        lifeStatus:
          type: string
          enum: [active, dead, missing, loa, retired]
        legacyDiscordUsername: { type: ["string", "null"] }
        importedFromChannelName: { type: ["string", "null"] }
        createdAt: { type: string, format: date-time }

    HydrateUsersInput:
      type: object
