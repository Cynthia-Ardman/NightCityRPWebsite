          type: array
          items: { type: string }
        verified18:
          type: boolean
          description: "True when the member holds the guild's Verified 18+ Discord role. When false, the portal is age-gated to the VRChat↔Discord linking guidebook page plus a link to the help channel."
        isAdmin: { type: boolean }
        isFixer: { type: boolean }
        isTrialFixer: { type: boolean, description: "Display-only: true when this fixer is still on trial. Derived from the Trial Fixer Discord role id (not its name). Trial fixers are author-only (they may create/propose missions) and do NOT get full fixer privileges; isFixer is false for them." }
        isArchivist: { type: boolean }
        isCoordinator: { type: boolean }
        isCsApprover: { type: boolean }
        isRipperdoc: { type: boolean }
        isNcpd: { type: boolean, description: "True when the member holds the NCPD officer OR Commissioner Discord role (derived from the pinned role ids). Grants access to NCPD records (arrest reports, warrants, notes, lookups) and the restricted law fields." }
        isNcpdCommissioner: { type: boolean, description: "True when the member holds the NCPD Commissioner Discord role (pinned id). Grants Book of Laws write access on top of officer abilities." }
        isStoreOwner: { type: boolean }
        isStoreEmployee: { type: boolean, description: "Data-derived: true when any of the user's characters is on staff at a store. Drives the Manage Stores nav link for employees who hold no owner role." }
        canCyberpsycho: { type: boolean, description: "True when this user may open the CyberPsycho control panel: ADMIN/FIXER role, or a per-user grant flipped on by an admin." }
        isRipperdocEmployee: { type: boolean, description: "Data-derived: true when any of the user's characters is on staff at a ripperdoc clinic. Drives the Manage Clinics nav link for employees who hold no owner role." }
        loginCount:
          type: integer
          description: "Number of times this user has logged in via Discord. Drives the first-run onboarding banner."
        onboardingBannerDismissed:
          type: boolean
          description: "True once the user has dismissed the onboarding banner; it then never re-appears."
        notificationPromptDismissed:
          type: boolean
          description: "True once the user has dismissed the dashboard notification-preferences prompt; it then never re-appears. The Settings toggles remain available regardless."
        rulesAccepted:
          type: boolean
          description: "True once the user has accepted the server rules on the first-run rules splash. While false, the SPA shows a blocking rules gate to signed-in members."
        loginRestricted:
          type: boolean
          description: "True when an admin has enabled staff-only login restriction. While true, only ADMIN / FIXER / ARCHIVIST may use the portal; the SPA shows a maintenance screen to everyone else."
        vrchat:
          oneOf:
            - { $ref: "#/components/schemas/VrchatLinkSummary" }
            - { type: "null" }
          description: "Linked VRChat profile for this Discord user, or null if none registered."

    Character:
