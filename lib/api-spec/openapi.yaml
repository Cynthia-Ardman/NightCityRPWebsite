        imageUrl: { type: ["string", "null"] }
        startAt: { type: string, format: date-time }
        endAt: { type: string, format: date-time }
        status: { type: string, enum: [scheduled, cancelled, completed] }
        needsNpcs: { type: boolean }
        npcBlurb: { type: ["string", "null"] }
        createdById: { type: ["string", "null"] }
        createdByName: { type: ["string", "null"] }
        hasDiscordEvent: { type: boolean, description: "True when a Discord scheduled event is linked." }
        discordSyncError: { type: ["string", "null"], description: "Last Discord sync error (managers only)." }
        hasVrchatEvent: { type: boolean, description: "True when a VRChat group calendar event is linked." }
        vrchatSyncError: { type: ["string", "null"], description: "Last VRChat calendar sync error (managers only)." }
