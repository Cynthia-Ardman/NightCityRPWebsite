        eventDate: { type: ["string", "null"], format: date-time }
        paidAt: { type: ["string", "null"], format: date-time }
        fixerName: { type: ["string", "null"] }
        totalPaid: { type: integer }
        actorCount: { type: integer }
        actors:
          type: array
          items: { $ref: "#/components/schemas/ActorPayoutLine" }

    ActorPayoutResult:
      type: object
      required: [result, payouts]
