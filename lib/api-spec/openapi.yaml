  # ---------------- EVENTS (non-mission calendar items: sessions, socials) ----------------
  /events:
    get:
      operationId: listEvents
      tags: [events]
      summary: "List non-cancelled events (sessions/socials). All authenticated users."
      parameters:
        - { in: query, name: limit, schema: { type: integer, default: 500, maximum: 1000 } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/EventView" }
    post:
      operationId: createEvent
      tags: [events]
      summary: "Create an event (fixer/admin). Auto-syncs a Discord scheduled event in Live mode."
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/EventCreateInput" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EventView" }
        "400": { description: Bad request }
        "403": { description: Insufficient role. }
  /events/conflicts:
    get:
      operationId: checkEventConflicts
      tags: [events]
      summary: "Surface overlapping Discord scheduled events so fixers avoid duplicates. Fixer/admin only."
      parameters:
        - { in: query, name: startAt, required: true, schema: { type: string, format: date-time } }
        - { in: query, name: endAt, required: true, schema: { type: string, format: date-time } }
        - { in: query, name: excludeEventId, schema: { type: string } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MissionConflictCheck" }
        "400": { description: Bad request }
        "403": { description: Insufficient role. }
  /events/{id}:
    parameters:
      - { in: path, name: id, required: true, schema: { type: integer } }
    get:
      operationId: getEvent
      tags: [events]
      summary: "Event detail. Manager-only fields (sign-up roster, sync error) populated for fixers/admins."
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EventView" }
        "404": { description: Not found. }
    patch:
      operationId: updateEvent
      tags: [events]
      summary: "Update an event (fixer/admin). Re-syncs the linked Discord scheduled event in Live mode."
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/EventUpdateInput" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EventView" }
        "400": { description: Bad request }
        "403": { description: Insufficient role. }
        "404": { description: Not found. }
    delete:
      operationId: cancelEvent
      tags: [events]
      summary: "Cancel an event (fixer/admin). Tears down the linked Discord scheduled event in Live mode and auto-refunds all purchased, un-attended tickets."
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [ok, ticketRefunds]
                properties:
                  ok: { type: boolean }
                  ticketRefunds: { $ref: "#/components/schemas/EventTicketRefundSummary" }
        "403": { description: Insufficient role. }
        "404": { description: Not found. }
  /me/tickets:
    get:
      operationId: listMyTickets
      tags: [events]
      summary: "Every ticket the caller ever bought (past and future), joined to the LIVE event row."
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/EventTicketView" }
  /events/{id}/tickets:
    parameters:
      - { in: path, name: id, required: true, schema: { type: integer } }
    get:
      operationId: listEventTickets
      tags: [events]
      summary: "Purchaser roster for an event. Managers or designated check-in staff only."
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/EventTicketView" }
        "403": { description: Not a manager or check-in staff for this event. }
    post:
      operationId: purchaseEventTicket
      tags: [events]
      summary: "Buy one ticket with UnbelievaBoat money. Atomic capacity reservation + idempotent wallet legs (no double-charge on retries)."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ticketTypeId]
              properties:
                ticketTypeId: { type: integer }
      responses:
        "201":
          description: Purchased
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EventTicketPurchaseResult" }
        "400": { description: "Insufficient funds or bad input." }
        "404": { description: Event or ticket type not found. }
        "409": { description: "Sold out, off sale, event not scheduled, or economy unavailable." }
        "502": { description: "UnbelievaBoat rejected the charge." }
  /events/{id}/tickets/{ticketId}/attendance:
    parameters:
      - { in: path, name: id, required: true, schema: { type: integer } }
      - { in: path, name: ticketId, required: true, schema: { type: integer } }
    post:
      operationId: setEventTicketAttendance
      tags: [events]
      summary: "Mark/unmark a ticket holder as attended (idempotent, undoable). Managers or designated check-in staff."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [attended]
              properties:
                attended: { type: boolean }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EventTicketActionResult" }
        "403": { description: Not a manager or check-in staff for this event. }
        "404": { description: Ticket not found. }
        "409": { description: Only purchased tickets can be checked in. }
  /events/{id}/tickets/{ticketId}/refund:
    parameters:
      - { in: path, name: id, required: true, schema: { type: integer } }
      - { in: path, name: ticketId, required: true, schema: { type: integer } }
    post:
      operationId: refundEventTicket
      tags: [events]
      summary: "Refund one ticket (buyer or manager) any time BEFORE it is marked attended. Money returns to the buyer; runner revenue is clawed back (sink burns are re-minted)."
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EventTicketActionResult" }
        "403": { description: Not the buyer or a manager. }
        "404": { description: Ticket not found. }
        "409": { description: "Already refunded, attended, or economy unavailable." }
        "502": { description: "UnbelievaBoat rejected the credit." }
  /events/{id}/tickets/{ticketId}/retry-payout:
    parameters:
      - { in: path, name: id, required: true, schema: { type: integer } }
      - { in: path, name: ticketId, required: true, schema: { type: integer } }
    post:
      operationId: retryEventTicketPayout
      tags: [events]
      summary: "Retry a bounced runner credit for a purchased ticket (manager only). Idempotent — never re-charges the buyer."
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EventTicketActionResult" }
        "403": { description: Insufficient role. }
        "404": { description: Ticket not found. }
        "409": { description: Payout not in a failed state (or sink event). }
        "502": { description: "Runner credit failed again." }
  /events/{id}/checkin-staff:
    parameters:
      - { in: path, name: id, required: true, schema: { type: integer } }
    get:
      operationId: listEventCheckinStaff
      tags: [events]
      summary: "List designated check-in staff for an event (fixer/admin)."
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/EventCheckinStaffView" }
        "403": { description: Insufficient role. }
    put:
      operationId: setEventCheckinStaff
      tags: [events]
      summary: "Replace-set the check-in staff list for an event (fixer/admin). Staff may be any portal users."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [userIds]
              properties:
                userIds:
                  type: array
                  items: { type: string }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/EventCheckinStaffView" }
        "400": { description: Bad request }
        "403": { description: Insufficient role. }
