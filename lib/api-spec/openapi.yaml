        kind: { type: string, description: "residential or business" }
        monthlyRent: { type: integer }

    NcpdRecord:
      type: object
      required: [character, reports, warrants, notes, fines, employment, businesses, housing]
      properties:
        character: { $ref: "#/components/schemas/NcpdRecordCharacter" }
        reports:
          type: array
          items: { $ref: "#/components/schemas/NcpdReport" }
        warrants:
          type: array
          items: { $ref: "#/components/schemas/NcpdWarrant" }
        notes:
          type: array
          items: { $ref: "#/components/schemas/NcpdNote" }
        fines:
          type: array
          items: { $ref: "#/components/schemas/NcpdFine" }
          description: "Fines levied on this character by NCPD officers."
        employment:
          type: array
          items: { $ref: "#/components/schemas/NcpdRecordVenue" }
          description: "Venues where this character is on the payroll."
        businesses:
          type: array
          items: { $ref: "#/components/schemas/NcpdRecordVenue" }
          description: "Venues this character owns."
        housing:
          type: array
          items: { $ref: "#/components/schemas/NcpdRecordLease" }
          description: "Active leases held by this character."
        balance:
          type: ["integer", "null"]
          description: "Owner's account balance (eddies). Null when the character is unclaimed or the balance can't be read."

    NcpdReport:
      type: object
      required: [id, characterId, title, body, createdAt, updatedAt]
      properties:
        id: { type: integer }
        characterId: { type: integer }
        characterName: { type: string, description: "Joined character name — present on the cross-character list endpoint." }
        officerId: { type: ["string", "null"] }
        officerName: { type: ["string", "null"] }
        title: { type: string }
        body: { type: string }
        charges: { type: ["string", "null"] }
        arrestedAt: { type: ["string", "null"], format: date-time }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    NcpdReportInput:
      type: object
      required: [characterId, title, body]
      properties:
        characterId: { type: integer }
        title: { type: string, minLength: 1 }
        body: { type: string, minLength: 1 }
        charges: { type: ["string", "null"] }
        arrestedAt: { type: ["string", "null"], format: date-time }

    NcpdReportUpdate:
      type: object
      properties:
        title: { type: string, minLength: 1 }
        body: { type: string, minLength: 1 }
        charges: { type: ["string", "null"] }
        arrestedAt: { type: ["string", "null"], format: date-time }

    NcpdWarrant:
      type: object
      required: [id, characterId, reason, status, createdAt, updatedAt]
      properties:
        id: { type: integer }
        characterId: { type: integer }
        characterName: { type: string, description: "Joined character name — present on the cross-character list endpoint." }
        issuedById: { type: ["string", "null"] }
        issuedByName: { type: ["string", "null"] }
        reason: { type: string }
        status: { type: string, enum: [open, served, revoked] }
        notes: { type: ["string", "null"] }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    NcpdWarrantInput:
      type: object
      required: [characterId, reason]
      properties:
        characterId: { type: integer }
        reason: { type: string, minLength: 1 }
        notes: { type: ["string", "null"] }

    NcpdWarrantUpdate:
      type: object
      properties:
        reason: { type: string, minLength: 1 }
        notes: { type: ["string", "null"] }
        status: { type: string, enum: [open, served, revoked] }

    NcpdNote:
      type: object
      required: [id, characterId, note, createdAt]
      properties:
        id: { type: integer }
        characterId: { type: integer }
        authorId: { type: ["string", "null"] }
        authorName: { type: ["string", "null"] }
        note: { type: string }
        createdAt: { type: string, format: date-time }

    NcpdNoteInput:
      type: object
      required: [note]
      properties:
        note: { type: string, minLength: 1 }

    NcpdFine:
      type: object
      required: [id, characterId, amount, reason, status, createdAt, updatedAt]
      properties:
        id: { type: integer }
        characterId: { type: integer }
        characterName: { type: string, description: "Joined character name — present on the player 'my fines' endpoint." }
        issuedById: { type: ["string", "null"] }
        officerName: { type: ["string", "null"] }
        amount: { type: integer, description: "Fine amount in eddies (positive)." }
        reason: { type: string }
        status: { type: string, enum: [unpaid, paid, void] }
        paidAt: { type: ["string", "null"], format: date-time }
        paidByUserId: { type: ["string", "null"] }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    NcpdFineInput:
      type: object
      required: [characterId, amount, reason]
      properties:
        characterId: { type: integer }
        amount: { type: integer, minimum: 1 }
        reason: { type: string, minLength: 1 }

    NcpdLaw:
      type: object
      required: [id, title, body, sortOrder, createdAt, updatedAt]
      properties:
        id: { type: integer }
        title: { type: string }
        body: { type: string, description: "Public statute text." }
        severity:
          type: ["string", "null"]
          enum: [infraction, misdemeanor, felony, null]
          description: "RESTRICTED — only returned to NCPD/fixer/admin viewers; stripped for everyone else."
        punishment: { type: ["string", "null"], description: "RESTRICTED — only returned to NCPD/fixer/admin viewers." }
        restrictedNotes: { type: ["string", "null"], description: "RESTRICTED — only returned to NCPD/fixer/admin viewers." }
        sortOrder: { type: integer }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    NcpdLawInput:
      type: object
      required: [title, body]
      properties:
        title: { type: string, minLength: 1 }
        body: { type: string, minLength: 1 }
        severity: { type: ["string", "null"], enum: [infraction, misdemeanor, felony, null] }
        punishment: { type: ["string", "null"] }
        restrictedNotes: { type: ["string", "null"] }
        sortOrder: { type: integer }

    NcpdLawUpdate:
      type: object
      properties:
        title: { type: string, minLength: 1 }
        body: { type: string, minLength: 1 }
        severity: { type: ["string", "null"], enum: [infraction, misdemeanor, felony, null] }
        punishment: { type: ["string", "null"] }
        restrictedNotes: { type: ["string", "null"] }
        sortOrder: { type: integer }
