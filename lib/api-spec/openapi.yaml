      responses:
        "200":
          description: Offers
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/SaleOffer" }
        "403": { description: Forbidden }
        "404": { description: Not found }
  /stores/{id}/deposit:
    parameters:
      - { in: path, name: id, required: true, schema: { type: integer } }
    post:
      operationId: depositToStore
      tags: [stores]
      summary: Owner moves eddies from their personal wallet into the store account
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/VenueAccountInput" }
      responses:
        "200":
          description: Moved
          content:
            application/json:
              schema: { $ref: "#/components/schemas/VenueAccountResult" }
        "400": { description: Bad amount or insufficient personal wallet balance }
        "403": { description: Not the owner }
        "404": { description: Not found }
        "409": { description: Economy disabled }
        "502": { description: Wallet sync failed }
  /stores/{id}/withdraw:
    parameters:
      - { in: path, name: id, required: true, schema: { type: integer } }
    post:
      operationId: withdrawFromStore
      tags: [stores]
      summary: Owner moves eddies from the store account into their personal wallet
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/VenueAccountInput" }
      responses:
        "200":
          description: Moved
          content:
            application/json:
              schema: { $ref: "#/components/schemas/VenueAccountResult" }
        "400": { description: Bad amount or insufficient venue balance }
        "403": { description: Not the owner }
        "404": { description: Not found }
        "409": { description: Economy disabled }
        "502": { description: Wallet sync failed }
  /stores/{id}/grant:
    parameters:
      - { in: path, name: id, required: true, schema: { type: integer } }
    post:
      operationId: grantStoreBalance
      tags: [stores]
      summary: Admin grants eddies directly into a store account (no personal-wallet leg)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/VenueAccountInput" }
      responses:
        "200":
          description: Granted
          content:
            application/json:
              schema: { $ref: "#/components/schemas/VenueAccountResult" }
        "400": { description: Bad amount or would exceed the maximum balance }
        "403": { description: Not an admin }
        "404": { description: Not found }
  /stores/{id}/give:
    parameters:
      - { in: path, name: id, required: true, schema: { type: integer } }
    post:
      operationId: giveToStore
      tags: [stores]
      summary: Any player gifts eddies from their personal wallet into a store account
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/VenueAccountInput" }
      responses:
        "200":
          description: Gifted
          content:
            application/json:
              schema: { $ref: "#/components/schemas/VenueAccountResult" }
        "400": { description: Bad amount or insufficient personal wallet balance }
        "404": { description: Not found }
        "409": { description: Economy disabled }
        "502": { description: Wallet sync failed }
  /stores/{id}/transactions:
    parameters:
      - { in: path, name: id, required: true, schema: { type: integer } }
    get:
      operationId: getStoreTransactions
      tags: [stores]
      summary: Per-store account transaction history (owner or staff)
      responses:
        "200":
          description: History
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/WalletTransaction" }
        "403": { description: Not owner / not staff }
        "404": { description: Not found }
  /stores/{id}/stock:
    parameters:
      - { in: path, name: id, required: true, schema: { type: integer } }
    post:
      operationId: addStoreStock
      tags: [stores]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/StockInput" }
      responses:
        "201":
          description: Added
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StockItem" }
  /stores/{id}/request-stock:
    parameters:
      - { in: path, name: id, required: true, schema: { type: integer } }
    post:
      operationId: requestStoreStock
      tags: [stores]
      summary: Store owner requests a custom (off-catalog) item be stocked. Goes to a fixer vote that sets the cost, then back to the owner to approve and pay.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/VenueStockRequestInput" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CustomRequest" }
        "400": { description: "Bad request or no eligible owner character" }
        "403": { description: Forbidden }
        "404": { description: Not found }
  /stores/{id}/stock/{stockId}:
    parameters:
      - { in: path, name: id, required: true, schema: { type: integer } }
      - { in: path, name: stockId, required: true, schema: { type: integer } }
    patch:
      operationId: updateStoreStock
      tags: [stores]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/StockUpdate" }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StockItem" }
    delete:
      operationId: removeStoreStock
      tags: [stores]
      responses:
        "204": { description: Removed }

