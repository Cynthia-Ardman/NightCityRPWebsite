                type: array
                items: { $ref: "#/components/schemas/AdminUser" }
  /admin/users/{userId}:
    parameters:
      - { in: path, name: userId, required: true, schema: { type: string } }
    get:
      operationId: adminGetUser
      tags: [admin]
      responses:
        "200":
          description: User
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminUser" }
  /admin/users/hydrate:
    post:
      operationId: adminHydrateUsers
      tags: [admin]
      summary: Bulk-hydrate username / globalName / avatarUrl from Discord for users with placeholder usernames.
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: "#/components/schemas/HydrateUsersInput" }
      responses:
        "200":
          description: Hydration counts
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HydrateUsersResult" }
  /admin/users/{userId}/roles:
    parameters:
      - { in: path, name: userId, required: true, schema: { type: string } }
    post:
      operationId: adminSyncUserRoles
      tags: [admin]
      summary: Re-sync this user's roles from Discord
      responses:
        "200":
          description: Synced
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminUser" }
  /admin/users/{userId}/cyberpsycho-access:
    parameters:
      - { in: path, name: userId, required: true, schema: { type: string } }
    post:
      operationId: adminSetCyberpsychoAccess
      tags: [admin]
      summary: Grant or revoke this user's per-user CyberPsycho control panel access.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CyberpsychoAccessInput" }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CyberpsychoAccessResult" }
  /admin/discord/members:
    get:
      operationId: adminSearchDiscordMembers
      tags: [admin]
      summary: Search the Discord guild for a member to assign as a character owner (includes members who have never signed in to the portal).
      parameters:
        - { in: query, name: q, required: true, schema: { type: string } }
      responses:
        "200":
          description: Matching guild members
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/DiscordMemberOption" }
  /admin/discord/channels:
    get:
      operationId: adminSearchDiscordChannels
      tags: [admin]
      summary: Search the Discord guild's text channels by name so staff can reference a channel in a review discussion.
      parameters:
        - { in: query, name: q, required: false, schema: { type: string } }
      responses:
        "200":
          description: Matching guild channels
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/DiscordChannelOption" }
  /admin/characters:
    get:
      operationId: adminListCharacters
      tags: [admin]
      responses:
        "200":
          description: All characters
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/AdminCharacterSummary" }
    post:
      operationId: adminCreateCharacter
      tags: [admin]
      summary: "Manually create an approved character (admin only), optionally assigning an owner and portraits."
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AdminCreateCharacterInput" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Character" }
        "400": { description: Invalid input }
        "404": { description: Owner (user) not found }
  /admin/characters/{id}/owner:
    parameters:
      - { in: path, name: id, required: true, schema: { type: integer } }
    put:
      operationId: adminAssignCharacterOwner
      tags: [admin]
      summary: Assign or reassign the ownerId of an imported (unclaimed) character.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AssignOwnerInput" }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Character" }
        "404": { description: Character or user not found }
    delete:
      operationId: adminClearCharacterOwner
      tags: [admin]
      summary: Clear ownerId on an imported character (mark it unclaimed again).
      responses:
        "200":
          description: Cleared
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Character" }
        "404": { description: Not found }
  /admin/characters/{id}/checkup:
    parameters:
      - { in: path, name: id, required: true, schema: { type: integer } }
    post:
      operationId: adminRecordCheckup
      tags: [admin]
      summary: Record a ripperdoc checkup — resets the weekly meds streak multiplier to 1×.
      responses:
        "200":
          description: Checkup recorded
          content:
            application/json:
              schema:
                type: object
                required: [characterId, checkupStreak]
                properties:
                  characterId: { type: integer }
                  lastCheckupAt: { type: ["string", "null"], format: date-time }
                  checkupStreak: { type: integer }
        "404": { description: Not found }

  /admin/characters/{id}/medical:
    parameters:
      - { in: path, name: id, required: true, schema: { type: integer } }
    get:
      operationId: getCharacterMedical
      tags: [admin]
      summary: Consolidated ripperdoc medical record — derived band, installed chrome, checkup history, meds payments.
      responses:
        "200":
          description: Medical record
          content:
            application/json:
              schema:
                type: object
                required: [characterId, characterName, kind, band, usedCwp, checkupStreak, installed, checkups, medsPayments]
                properties:
                  characterId: { type: integer }
                  characterName: { type: string }
                  kind: { type: string }
                  cyberwareLevel: { type: ["string", "null"] }
                  band: { type: string }
                  usedCwp: { type: number }
                  createdAt: { type: ["string", "null"], format: date-time }
                  lastCheckupAt: { type: ["string", "null"], format: date-time }
                  checkupStreak: { type: integer }
                  installed:
                    type: array
                    items:
                      type: object
                      required: [id, name, cwp]
                      properties:
                        id: { type: integer }
                        name: { type: ["string", "null"] }
                        quantity: { type: ["integer", "null"] }
                        notes: { type: ["string", "null"] }
                        cwp: { type: number }
                  checkups:
                    type: array
                    items:
                      type: object
                      required: [id]
                      properties:
                        id: { type: integer }
                        message: { type: ["string", "null"] }
                        actorName: { type: ["string", "null"] }
                        createdAt: { type: ["string", "null"], format: date-time }
                        level: { type: ["string", "null"] }
                  medsPayments:
                    type: array
                    items:
                      type: object
                      required: [id, amount, kind]
                      properties:
                        id: { type: integer }
                        amount: { type: integer }
                        kind: { type: string }
                        memo: { type: ["string", "null"] }
                        category: { type: ["string", "null"] }
                        createdAt: { type: ["string", "null"], format: date-time }
                  bills:
                    type: array
                    description: "Paid (approved) sale offers billed to this character — service bills, purchases, installs, removals — newest first."
                    items:
                      type: object
                      required: [id, offerType, description, amount, venueKind]
                      properties:
                        id: { type: integer }
                        offerType: { type: string, description: "sale | install | install_owned | remove | give | service | stock_add" }
                        description: { type: string, description: "What the bill was for (item name or the freeform service note)." }
                        category: { type: ["string", "null"] }
                        quantity: { type: ["integer", "null"] }
                        amount: { type: integer }
                        memo: { type: ["string", "null"] }
                        venueName: { type: ["string", "null"], description: "The store/clinic the bill came from." }
                        venueKind: { type: string, description: "store | ripperdoc" }
                        paidAt: { type: ["string", "null"], format: date-time }
        "403": { description: Forbidden }
        "404": { description: Not found }

  # ---------------- DIRECTORY (public character sheets) ----------------
  /directory/characters:
    get:
      operationId: listPublicCharacters
      tags: [directory]
      summary: Public list of imported character sheets.
      parameters:
        - { in: query, name: q, schema: { type: string }, description: "Free-text filter. By default matches character name, legacy Discord handle, and owner handle. When mode=content, additionally matches against background and sheet section bodies." }
        - { in: query, name: scope, schema: { type: string, enum: [all, active, retired, unclaimed, pc, npc] } }
        - { in: query, name: tags, schema: { type: string }, description: "Comma-separated list of Discord forum tag names. Returns characters whose appliedTags overlap with any of these." }
        - { in: query, name: mode, schema: { type: string, enum: [name, content] }, description: "Search mode for `q`. `name` (default) matches identifiers only; `content` also searches sheet body text." }
      responses:
        "200":
          description: List
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/PublicCharacterSummary" }
  /directory/character-tags:
    get:
      operationId: listPublicCharacterTags
      tags: [directory]
      summary: Distinct Discord forum tag names across all imported characters.
      responses:
        "200":
          description: List of tag names, sorted alphabetically.
          content:
            application/json:
              schema:
                type: array
                items: { type: string }
  /directory/tag-options:
    get:
      operationId: listTagOptions
      tags: [directory]
      summary: "Global reusable character tag options (any authenticated user)."
      responses:
        "200":
          description: Tag options sorted by name.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/TagOption" }
    post:
      operationId: createTagOption
      tags: [directory]
      summary: "Create a new global tag option (FIXER/ADMIN)."
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TagOptionInput" }
      responses:
        "201":
          description: Created tag option
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TagOption" }
        "400": { description: Invalid payload }
        "403": { description: Forbidden }
        "409": { description: A tag with that name already exists }
  /directory/tag-options/{id}:
    parameters:
      - { in: path, name: id, required: true, schema: { type: integer } }
    patch:
      operationId: updateTagOption
      tags: [directory]
      summary: "Rename a global tag option (FIXER/ADMIN). The new name is also propagated to every character that already has the old tag applied."
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TagOptionInput" }
      responses:
        "200":
          description: Updated tag option
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TagOption" }
        "400": { description: Invalid payload or no change }
        "403": { description: Forbidden }
        "404": { description: Not found }
        "409": { description: A tag with that name already exists }
    delete:
      operationId: deleteTagOption
      tags: [directory]
      summary: "Delete a global tag option (FIXER/ADMIN)."
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                type: object
                required: [ok]
                properties:
                  ok: { type: boolean }
        "403": { description: Forbidden }
        "404": { description: Not found }
  /directory/characters/{id}:
    parameters:
      - { in: path, name: id, required: true, schema: { type: integer } }
    get:
      operationId: getPublicCharacter
      tags: [directory]
      summary: Full sheet data for a single imported character (public).
      responses:
        "200":
          description: Character sheet
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PublicCharacter" }
        "404": { description: Not found }

  # ---------------- CHARACTER ARCHIVE (fixer/admin management) ----------------
  /directory/archive:
    get:
      operationId: listArchiveCharacters
      tags: [directory]
      summary: "Staff-only archive roster with full management fields (FIXER/ADMIN)."
      parameters:
        - { in: query, name: q, schema: { type: string } }
        - { in: query, name: scope, schema: { type: string, enum: [all, active, retired, claimed, unclaimed, pc, npc] } }
        - { in: query, name: status, schema: { type: string }, description: "Comma-separated life-status values (active, dead, missing, loa, retired); matches ANY." }
        - { in: query, name: bands, schema: { type: string }, description: "Comma-separated CWP bands (organic, none, medium, high, extreme); matches ANY." }
        - { in: query, name: tags, schema: { type: string }, description: "Comma-separated tag names; matches the union of applied + manual tags." }
        - { in: query, name: mode, schema: { type: string, enum: [name, content] } }
        - { in: query, name: sort, schema: { type: string, enum: [recent, name] } }
      responses:
        "200":
          description: Archive roster
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ArchiveCharacterSummary" }
        "403": { description: Forbidden }
  /directory/archive/users:
    get:
      operationId: listArchiveUsers
      tags: [directory]
      summary: "Owner-picker user search for the archive editor (FIXER/ADMIN)."
      parameters:
        - { in: query, name: q, schema: { type: string } }
      responses:
        "200":
          description: Matching users
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ArchiveUser" }
        "403": { description: Forbidden }
  /directory/archive/{id}:
    parameters:
      - { in: path, name: id, required: true, schema: { type: integer } }
    get:
      operationId: getArchiveCharacter
      tags: [directory]
      summary: "Full editable character detail for the archive editor (FIXER/ADMIN)."
      responses:
        "200":
          description: Character
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ArchiveCharacter" }
        "403": { description: Forbidden }
        "404": { description: Not found }
    patch:
      operationId: updateArchiveCharacter
      tags: [directory]
      summary: "Immediate-apply staff edit. Requires a non-empty commitMessage; audit-logged."
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ArchiveEditInput" }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ArchiveEditResult" }
        "400": { description: Invalid edit or blank commit message }
        "403": { description: Forbidden }
        "404": { description: Not found }

  # ---------------- STORAGE ----------------
  /storage/uploads/request-url:
    post:
      tags: [storage]
      operationId: requestUploadUrl
      summary: Request a presigned URL for file upload
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UploadUrlRequest" }
      responses:
        "200":
          description: Presigned upload URL generated.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UploadUrlResponse" }
        "400": { description: Missing or invalid required fields. }
        "500": { description: Failed to generate upload URL. }
  /storage/public-objects/{filePath}:
    get:
      tags: [storage]
      operationId: getPublicObject
      summary: Serve a public asset from PUBLIC_OBJECT_SEARCH_PATHS
      parameters:
        - { in: path, name: filePath, required: true, schema: { type: string } }
      responses:
        "200":
          description: Object content streamed with correct Content-Type.
          content:
            "*/*":
              schema: { type: string, format: binary }
        "404": { description: File not found. }
  /storage/objects/{objectPath}:
    get:
      tags: [storage]
      operationId: getStorageObject
      summary: Serve an object entity from PRIVATE_OBJECT_DIR
      parameters:
        - { in: path, name: objectPath, required: true, schema: { type: string } }
      responses:
        "200":
          description: Object content streamed with correct Content-Type.
          content:
            "*/*":
              schema: { type: string, format: binary }
        "404": { description: Object not found. }
  /admin/wallet/adjust:
    post:
      operationId: adminAdjustWallet
      tags: [admin]
      summary: Manual eddie adjustment (admin only)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/WalletAdjustmentInput" }
      responses:
        "200":
          description: Adjusted
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Wallet" }
  /admin/wallet/sink:
    post:
      operationId: adminSinkWallet
      tags: [admin]
      summary: Pay Night City Bot on behalf of a character — burn eddies (admin only)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AdminSinkInput" }
      responses:
        "200":
          description: Burned
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Wallet" }
  /admin/jobs/run:
    post:
      operationId: adminRunJob
      tags: [admin]
      summary: Manually trigger a cron job
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/JobRunInput" }
      responses:
        "200":
          description: Job triggered
          content:
            application/json:
              schema: { $ref: "#/components/schemas/JobRunResult" }
  /admin/jobs:
    get:
      operationId: adminListJobs
      tags: [admin]
      responses:
        "200":
          description: Recent job runs
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/JobRunResult" }

  # ---------------- DASHBOARD ----------------
  /dashboard/summary:
    get:
      operationId: getDashboardSummary
      tags: [dashboard]
      summary: Top-level dashboard counts and recent activity
      responses:
        "200":
          description: Summary
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DashboardSummary" }
  /dashboard/upcoming-bills:
    get:
      operationId: getUpcomingBills
      tags: [dashboard]
      summary: Projected rent and cyberpsychosis-meds charges for the signed-in user
      responses:
        "200":
          description: Upcoming bills
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UpcomingBills" }
  /admin/lifestyle-tiers:
    get:
      operationId: adminListLifestyleTiers
      tags: [lifestyle]
      summary: List all lifestyle tiers (including archived)
      responses:
        "200":
          description: Lifestyle tiers
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/LifestyleTier" }
    post:
      operationId: adminCreateLifestyleTier
      tags: [lifestyle]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LifestyleTierInput" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LifestyleTier" }
  /admin/lifestyle-tiers/{id}:
    parameters:
      - { in: path, name: id, required: true, schema: { type: integer } }
    patch:
      operationId: adminUpdateLifestyleTier
      tags: [lifestyle]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LifestyleTierPatch" }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LifestyleTier" }
    delete:
      operationId: adminArchiveLifestyleTier
      tags: [lifestyle]
      responses:
        "204": { description: Archived }
  /dashboard/activity:
    get:
      operationId: getRecentActivity
      tags: [dashboard]
      responses:
        "200":
          description: Recent activity events
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ActivityEvent" }
  /economy/income:
    get:
      operationId: getIncomeStatus
      tags: [wallet]
      summary: Dashboard income-command availability, cooldowns, eligibility, and balance
      responses:
        "200":
          description: Income command status
          content:
            application/json:
              schema: { $ref: "#/components/schemas/IncomeStatus" }
  /economy/income/work:
    post:
      operationId: runIncomeWork
      tags: [wallet]
      summary: Run the WORK command (anyone; 100–200 eddies, 20h cooldown)
      responses:
        "200":
          description: WORK payout applied
          content:
            application/json:
              schema: { $ref: "#/components/schemas/IncomeCommandResult" }
        "429":
          description: On cooldown
          content:
            application/json:
              schema:
                type: object
                properties:
                  error: { type: string }
                  cooldownEndsAt: { type: string, format: date-time, nullable: true }
        "502": { description: Wallet provider unavailable }
  /economy/income/slut:
    post:
      operationId: runIncomeSlut
      tags: [wallet]
      summary: Run the SLUT command (joytoy role only; 100–500 or a 1–3% fine, 20h cooldown)
      responses:
        "200":
          description: SLUT result applied
          content:
            application/json:
              schema: { $ref: "#/components/schemas/IncomeCommandResult" }
        "403": { description: Not a joytoy }
        "429":
          description: On cooldown
          content:
            application/json:
              schema:
                type: object
                properties:
                  error: { type: string }
                  cooldownEndsAt: { type: string, format: date-time, nullable: true }
        "502": { description: Wallet provider unavailable }
  /vrchat/status:
    get:
      operationId: getVrchatStatus
      tags: [vrchat]
      summary: The requesting staffer's VRChat agent meta, latest status snapshot, and recent commands
      responses:
        "200":
          description: Agent status
          content:
            application/json:
              schema: { $ref: "#/components/schemas/VrchatStatusResponse" }
        "401": { description: Not signed in }
        "403": { description: Not an admin or fixer }
  /vrchat/commands:
    post:
      operationId: queueVrchatCommand
      tags: [vrchat]
      summary: Queue a command for the staffer's own VRChat agent
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/VrchatCommandRequest" }
      responses:
        "201":
          description: Command queued
          content:
            application/json:
              schema: { $ref: "#/components/schemas/VrchatCommandCreated" }
        "400": { description: Invalid command kind }
        "401": { description: Not signed in }
        "403": { description: Not an admin or fixer }
  /vrchat/agent/revoke:
    post:
      operationId: revokeVrchatAgent
      tags: [vrchat]
      summary: Revoke the staffer's current agent token (the running agent stops working)
      responses:
        "200":
          description: Revoked
          content:
            application/json:
              schema:
                type: object
                required: [ok]
                properties:
                  ok: { type: boolean }
        "401": { description: Not signed in }
        "403": { description: Not an admin or fixer }
  /vrchat/instances:
    get:
      operationId: listVrchatInstances
      tags: [vrchat]
      summary: Currently-open NCRP VRChat group instances (served from the poller cache)
      responses:
        "200":
          description: Live instances
          content:
            application/json:
              schema: { $ref: "#/components/schemas/VrchatInstanceList" }
        "401": { description: Not signed in }
  /vrchat/instances/refresh:
    post:
      operationId: refreshVrchatInstances
      tags: [vrchat]
      summary: Staff-only — force an immediate poll of the NCRP group's open instances
      responses:
        "200":
          description: Refreshed
          content:
            application/json:
              schema:
                type: object
                required: [ok, count]
                properties:
                  ok: { type: boolean }
                  count: { type: integer }
        "400": { description: VRChat credentials not configured }
        "401": { description: Not signed in }
        "403": { description: Not an admin or fixer }
        "502": { description: VRChat poll failed }
  /vrchat/session:
    get:
      operationId: getVrchatSession
      tags: [vrchat]
      summary: Staff-only — VRChat poller session health (never returns cookie values)
      responses:
        "200":
          description: Session status
          content:
            application/json:
              schema: { $ref: "#/components/schemas/VrchatSessionInfo" }
        "401": { description: Not signed in }
        "403": { description: Not an admin or fixer }
  /vrchat/session/connect:
    post:
      operationId: connectVrchatSession
      tags: [vrchat]
      summary: Staff-only — begin a manual login (triggers VRChat to email a one-time code)
      responses:
        "200":
          description: Connect started or completed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/VrchatConnectResult" }
        "400": { description: VRChat credentials not configured }
        "401": { description: Not signed in }
        "403": { description: Not an admin or fixer }
        "502": { description: VRChat connect failed }
  /vrchat/session/verify:
    post:
      operationId: verifyVrchatSession
      tags: [vrchat]
      summary: Staff-only — finish a manual login with the 6-digit code VRChat emailed
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/VrchatVerifyRequest" }
      responses:
        "200":
          description: Connected
          content:
            application/json:
              schema: { $ref: "#/components/schemas/VrchatConnectResult" }
        "400": { description: Invalid or missing code }
        "401": { description: Not signed in }
        "403": { description: Not an admin or fixer }
        "502": { description: VRChat verify failed }
  /me/wallet:
    get:
      operationId: getMyWallet
      tags: [wallet]
      summary: Per-user eddies balance from Unbelievaboat (account-level, not per-character)
      responses:
        "200":
          description: Wallet balance for signed-in user
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UserWallet" }
  /me/wallet/withdraw:
    post:
      operationId: withdrawEddies
      tags: [wallet]
      summary: Move eddies from the signed-in user's bank to their cash (spendable) balance
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/WalletMoveInput" }
      responses:
        "200":
          description: Updated wallet balance after the withdrawal
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UserWallet" }
  /me/wallet/deposit:
    post:
      operationId: depositEddies
      tags: [wallet]
      summary: Move eddies from the signed-in user's cash (spendable) balance into their bank
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/WalletMoveInput" }
      responses:
        "200":
          description: Updated wallet balance after the deposit
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UserWallet" }
  /me/wallet/transactions:
    get:
      operationId: getMyWalletTransactions
      tags: [wallet]
      summary: Combined wallet ledger for the signed-in user across all their characters
      responses:
        "200":
          description: Transaction history
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/WalletTransaction" }
  /requests:
    get:
      operationId: listCustomRequests
      tags: [requests]
      summary: List custom requests across all players (fixer/admin only). Filter by lifecycle bucket (active/resolved/archive) or legacy status.
      parameters:
        - in: query
          name: bucket
          required: false
          description: Lifecycle bucket. active = pending/changes_requested; resolved = approved/rejected/cancelled; archive = closed. Overrides `status` when set.
          schema: { type: string, enum: [active, resolved, archive] }
        - in: query
          name: status
          required: false
          schema: { type: string, enum: [pending, approved, rejected, changes_requested, cancelled, closed], default: pending }
      responses:
        "200":
          description: Custom requests
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/CustomRequest" }
        "403": { description: Fixer or admin only }
    post:
      operationId: submitCustomRequest
      tags: [requests]
      summary: Submit a custom request for one of the signed-in user's characters.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CustomRequestInput" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CustomRequest" }
        "400": { description: Bad request }
        "404": { description: Character not found }
  /requests/mine:
    get:
      operationId: listMyCustomRequests
      tags: [requests]
      summary: The signed-in user's own custom requests.
      parameters:
        - in: query
          name: type
          required: false
          schema: { type: string, enum: [property, gun, cyberware, item, store, ripperdoc, employee_invite, venue_stock] }
      responses:
        "200":
          description: Requests
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/CustomRequest" }
  /requests/{id}/vote:
    parameters:
      - { in: path, name: id, required: true, schema: { type: integer } }
    post:
      operationId: voteCustomRequest
      tags: [requests]
      summary: Cast or change your approve/reject vote on a custom request. An approve vote carries the mechanical params for the type (property/cyberware). When the tally reaches majority the request is decided and auto-applied.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CustomRequestVoteInput" }
      responses:
        "200":
          description: Vote recorded (and possibly decided)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CustomRequestVoteResult" }
        "400": { description: Bad request }
        "403": { description: Reviewers only / cannot vote on own request }
        "404": { description: Not found }
        "409": { description: Already decided }
  /requests/{id}/override:
    parameters:
      - { in: path, name: id, required: true, schema: { type: integer } }
    post:
      operationId: overrideCustomRequest
      tags: [requests]
      summary: Admin-only immediate approval that bypasses the vote and auto-applies. Records overriddenBy.
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CustomRequestApproval" }
      responses:
        "200":
          description: Approved via override
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CustomRequest" }
        "400": { description: Bad request }
        "403": { description: Admin only }
        "404": { description: Not found }
        "409": { description: Already decided }
  /requests/{id}/request-changes:
    parameters:
      - { in: path, name: id, required: true, schema: { type: integer } }
    post:
      operationId: requestChangesCustomRequest
      tags: [requests]
      deprecated: true
      summary: "RETIRED. Reviewers no longer block requests in changes_requested; use the /review comment thread instead. Always returns 410."
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RequestChangesInput" }
      responses:
        "410": { description: Retired. Use the /review comment thread; it never blocks approval. }
        "409": { description: Already decided }
  /requests/{id}/resubmit:
    parameters:
      - { in: path, name: id, required: true, schema: { type: integer } }
    post:
      operationId: resubmitCustomRequest
      tags: [requests]
      summary: The requester sends a changes_requested request back to the review queue. Clears prior votes. Allowed with no edits.
      responses:
        "200":
          description: Resubmitted
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CustomRequest" }
        "403": { description: Only the requester can resubmit }
        "404": { description: Not found }
        "409": { description: Not awaiting changes }
  /requests/{id}/submit:
    parameters:
      - { in: path, name: id, required: true, schema: { type: integer } }
    post:
      operationId: submitDraftCustomRequest
      tags: [requests]
      summary: The requester promotes their own draft into the review queue. Re-reserves the on-map building (if any) and announces to reviewers.
      responses:
        "200":
          description: Submitted
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CustomRequest" }
        "403": { description: Only the requester can submit }
        "404": { description: Not found }
        "409": { description: "Not a draft, or the reserved building is no longer available" }
  /requests/{id}:
    parameters:
      - { in: path, name: id, required: true, schema: { type: integer } }
    patch:
      operationId: updateCustomRequest
      tags: [requests]
      summary: The requester (or admin) edits a request while it is a draft, pending, or changes_requested.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CustomRequestPatchInput" }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CustomRequest" }
        "403": { description: Only the requester can edit }
        "404": { description: Not found }
        "409": { description: No longer editable }
    delete:
      operationId: deleteDraftCustomRequest
      tags: [requests]
      summary: The requester discards their own draft. Only draft requests can be deleted.
      responses:
        "204": { description: Deleted }
        "403": { description: Only the requester can delete }
        "404": { description: Not found }
        "409": { description: Only draft requests can be deleted }
  /requests/{id}/stock-decision:
    parameters:
      - { in: path, name: id, required: true, schema: { type: integer } }
    post:
      operationId: decideStockCostRequest
      tags: [requests]
      summary: Venue owner approves or rejects a fixer/admin-proposed stock-cost request. Approving debits the venue balance and adds the stock.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/StockCostDecision" }
      responses:
        "200":
          description: Decided
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CustomRequest" }
        "400": { description: "Bad request, not a stock-cost request, or venue has insufficient funds" }
        "403": { description: "Only the venue owner (or an admin) may decide" }
        "404": { description: Not found }
        "409": { description: Already reviewed }
  /requests/{id}/employee-decision:
    parameters:
      - { in: path, name: id, required: true, schema: { type: integer } }
    post:
      operationId: decideEmployeeInvite
      tags: [requests]
      summary: The invited character's player (or an admin) accepts or denies an employment invitation. Accepting finalizes employment; denying discards it.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/EmployeeDecisionInput" }
      responses:
        "200":
          description: Decided
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CustomRequest" }
        "400": { description: "Bad request or not an employee-invite request" }
        "403": { description: "Only the invited character's player (or an admin) may decide" }
        "404": { description: Not found }
        "409": { description: Already reviewed }

  /requests/{id}/participation-decision:
    parameters:
      - { in: path, name: id, required: true, schema: { type: integer } }
    post:
      operationId: decideMissionParticipation
      tags: [requests]
      summary: The assigned character's player (or an admin) approves or declines a fixer's mission assignment. Declining removes the player from the mission roster.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/EmployeeDecisionInput" }
      responses:
        "200":
          description: Decided
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CustomRequest" }
        "400": { description: "Bad request or not a mission-participation request" }
        "403": { description: "Only the assigned character's player (or an admin) may decide" }
        "404": { description: Not found }
        "409": { description: Already reviewed }

  # ---------------- LORE DIRECTORY ----------------
  /directory/lore:
    get:
      operationId: listLore
      tags: [lore]
      summary: Public list of lore entries (no fixer-only bodies).
      parameters:
        - in: query
          name: category
          required: false
          schema: { type: string, enum: [corporation, gang, faction, location, misc] }
        - in: query
          name: q
          required: false
          schema: { type: string }
        - in: query
          name: sort
          required: false
          description: "Sort order. 'recent' (default) = newest-updated first; 'alpha' = A→Z by name."
          schema: { type: string, enum: [recent, alpha], default: recent }
      responses:
        "200":
          description: Lore entries
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/LoreEntrySummary" }
    post:
      operationId: createLore
      tags: [lore]
      summary: Create a lore entry (admin only — publishes directly).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LoreEntryInput" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LoreEntry" }
        "400": { description: Invalid payload }
        "403": { description: Admin only }
  /directory/lore/{id}:
    parameters:
      - { in: path, name: id, required: true, schema: { type: integer } }
    get:
      operationId: getLore
      tags: [lore]
      summary: Lore entry detail. Fixer-only body + sources only returned to staff.
      responses:
        "200":
          description: Lore entry
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LoreEntry" }
        "404": { description: Not found }
    patch:
      operationId: updateLore
      tags: [lore]
      summary: Edit a lore entry (admin only — publishes directly).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LoreEntryUpdate" }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LoreEntry" }
        "400": { description: Invalid payload }
        "403": { description: Admin only }
        "404": { description: Not found }
    delete:
      operationId: deleteLore
      tags: [lore]
      summary: Delete a lore entry (admin only).
      responses:
        "204": { description: Deleted }
        "403": { description: Admin only }
        "404": { description: Not found }
  /directory/lore/edits:
    get:
      operationId: listLoreEdits
      tags: [lore]
