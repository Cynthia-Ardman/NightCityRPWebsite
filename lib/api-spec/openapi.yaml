          content:
            application/json:
              schema:
                type: object
                required: [ok, status]
                properties:
                  ok: { type: boolean }
                  status: { type: string }
        "403": { description: Admin only }
        "404": { description: Not found }
        "409": { description: Already decided }
  /pending-edits/{id}/request-changes:
    parameters:
      - { in: path, name: id, required: true, schema: { type: integer } }
    post:
      operationId: requestChangesPendingEdit
      tags: [pending-edits]
      summary: A reviewer parks the edit in changes_requested with a comment and DMs the submitter.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RequestChangesInput" }
      responses:
        "200":
          description: Changes requested
          content:
            application/json:
              schema:
                type: object
                required: [ok, status]
                properties:
                  ok: { type: boolean }
                  status: { type: string }
        "400": { description: A comment is required }
        "403": { description: Reviewers only / cannot review own edit }
        "404": { description: Not found }
        "409": { description: Already decided }
  /pending-edits/{id}/resubmit:
    parameters:
      - { in: path, name: id, required: true, schema: { type: integer } }
    post:
      operationId: resubmitPendingEdit
      tags: [pending-edits]
      summary: The submitter sends a changes_requested edit back to the review queue. Clears prior votes. Allowed with no edits.
      responses:
        "200":
          description: Resubmitted
          content:
            application/json:
              schema:
                type: object
                required: [ok, status]
                properties:
                  ok: { type: boolean }
                  status: { type: string }
        "403": { description: Only the submitter can resubmit }
        "404": { description: Not found }
        "409": { description: Not awaiting changes }
  /pending-edits/{id}/cancel:
    parameters:
      - { in: path, name: id, required: true, schema: { type: integer } }
    post:
      operationId: cancelPendingEdit
      tags: [pending-edits]
      summary: Submitter (or admin) withdraws a pending edit
      responses:
        "200":
          description: Cancelled
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  status: { type: string }
  /characters/{id}/pending-edit:
    parameters:
      - { in: path, name: id, required: true, schema: { type: integer } }
    get:
      operationId: getCharacterPendingEdit
      tags: [pending-edits]
