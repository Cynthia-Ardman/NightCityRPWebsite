components:
  schemas:
    VrchatUserRef:
      type: object
      required: [id, name]
      properties:
        id: { type: string }
        name: { type: string }
    VrchatOccupant:
      type: object
      required: [id, displayName]
      properties:
        id: { type: string }
        displayName: { type: string }
    VrchatAgentMeta:
      type: object
      required: [exists, online, tokenIssued, revoked, lastSeenAt, statusAt, label]
      properties:
        exists: { type: boolean, description: "Whether an agent row has ever been provisioned for this staffer." }
        online: { type: boolean, description: "True if the agent has polled within the online window." }
        tokenIssued: { type: boolean, description: "True while a non-revoked token exists." }
        revoked: { type: boolean }
        lastSeenAt: { type: string, format: date-time, nullable: true }
        statusAt: { type: string, format: date-time, nullable: true }
        label: { type: string, nullable: true, description: "Friendly label the agent reports (usually the VRChat display name)." }
    VrchatAgentStatusSnapshot:
      type: object
      description: "Latest snapshot the agent reported. All fields optional; absent until the agent connects."
      properties:
        psycho_active: { type: boolean }
        operation: { type: string, description: "Human-readable progress of the in-flight operation, empty when idle." }
        session_expired: { type: boolean }
        my_id: { type: string }
        my_name: { type: string }
        location: { type: string, nullable: true, description: "Current VRChat instance as world:instance, or null." }
        patrol_interval: { type: integer }
        agent_version: { type: string }
        blocked_count: { type: integer }
        blocked: { type: array, items: { $ref: "#/components/schemas/VrchatUserRef" } }
        allowlist_count: { type: integer }
        allowlist: { type: array, items: { $ref: "#/components/schemas/VrchatUserRef" } }
        users: { type: array, items: { $ref: "#/components/schemas/VrchatOccupant" } }
    VrchatCommandSummary:
      type: object
      required: [id, kind, status, error, createdAt, completedAt]
      properties:
        id: { type: integer }
        kind: { type: string }
        status: { type: string, description: "pending | claimed | done | error" }
        error: { type: string, nullable: true }
        createdAt: { type: string, format: date-time }
        completedAt: { type: string, format: date-time, nullable: true }
    VrchatStatusResponse:
      type: object
      required: [agent, status, commands]
      properties:
        agent: { $ref: "#/components/schemas/VrchatAgentMeta" }
        status:
          nullable: true
          allOf:
            - $ref: "#/components/schemas/VrchatAgentStatusSnapshot"
        commands: { type: array, items: { $ref: "#/components/schemas/VrchatCommandSummary" } }
    VrchatCommandRequest:
      type: object
      required: [kind]
      properties:
        kind:
          type: string
          enum: [isolate, restore, refresh, snapshot, save_allowlist, restart_vrchat]
        params:
          type: object
          nullable: true
          additionalProperties: true
          description: "Command-specific payload, e.g. { allowlist: [{ id, name }] } for save_allowlist."
    VrchatCommandCreated:
      type: object
      required: [id, kind, status]
      properties:
        id: { type: integer }
        kind: { type: string }
        status: { type: string }
    VrchatInstance:
      type: object
      required: [location, worldId, worldName, instanceShortId, accessType, userCount, roleNames, firstSeenAt, launchUrl]
      properties:
        location: { type: string, description: "Full VRChat location id (worldId:instanceId)." }
        worldId: { type: string }
        worldName: { type: string }
        thumbnailUrl: { type: string, nullable: true }
        instanceShortId: { type: string }
        accessType:
          type: string
          enum: [group_public, group_plus, group_members, invite_plus, friends_plus, invite, public, unknown]
        region: { type: string, nullable: true }
        userCount: { type: integer }
        capacity: { type: integer, nullable: true }
        roleNames:
          type: array
          items: { type: string }
          description: "Display names of the group roles allowed to join. Empty for open or non-role-gated instances."
        firstSeenAt: { type: string, format: date-time, description: "When the poller first saw this instance open (used as an uptime proxy)." }
        launchUrl: { type: string, description: "Official vrchat.com launch link for this instance." }
    VrchatInstanceList:
      type: object
      required: [instances, configured]
      properties:
        instances: { type: array, items: { $ref: "#/components/schemas/VrchatInstance" } }
        configured: { type: boolean, description: "Whether VRChat credentials are configured server-side." }
    VrchatSessionInfo:
      type: object
      required: [configured, connected, pending]
      properties:
        configured: { type: boolean, description: "Whether VRChat credentials are configured server-side." }
        connected: { type: boolean, description: "Whether an authenticated VRChat session cookie is stored." }
        pending: { type: boolean, description: "Whether a login is awaiting an emailed one-time code." }
        displayName: { type: string, nullable: true, description: "Connected VRChat account display name." }
        lastAuthAt: { type: string, format: date-time, nullable: true, description: "Last successful authenticated VRChat call." }
        lastError: { type: string, nullable: true, description: "Last login/poll error surfaced to staff." }
    VrchatConnectResult:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [connected, needs_email_code]
          description: "connected = session live; needs_email_code = VRChat emailed a code to enter."
        displayName: { type: string, nullable: true }
    VrchatVerifyRequest:
      type: object
      required: [code]
      properties:
        code: { type: string, description: "The 6-digit one-time code VRChat emailed." }
    BreachPos:
      type: object
      required: [r, c]
      properties:
        r: { type: integer, description: "Row index in the code matrix (0-based)." }
        c: { type: integer, description: "Column index in the code matrix (0-based)." }
    BreachPuzzle:
      type: object
      required: [id, createdBy, assignedUserId, difficulty, timeLimitSeconds, grid, daemons, bufferSize, solutionCount, rewardEddies, status, solvedCount, createdAt]
      properties:
        id: { type: integer }
        createdBy: { type: string }
        createdByName: { type: ["string", "null"] }
        assignedUserId: { type: string }
        assignedUserName: { type: ["string", "null"] }
        assignedCharacterId: { type: ["integer", "null"] }
        assignedCharacterName: { type: ["string", "null"] }
        difficulty: { type: string, enum: [easy, medium, hard, very_hard, nightmare, impossible] }
        timeLimitSeconds: { type: integer }
        grid:
          type: array
          description: "The code matrix as rows of hex byte strings."
          items:
            type: array
            items: { type: string }
        daemons:
          type: array
          description: "Each daemon is a sequence of hex byte strings to breach."
          items:
            type: array
            items: { type: string }
        bufferSize: { type: integer }
        solutionCount: { type: integer }
        rewardEddies: { type: integer }
        rewardItemName: { type: ["string", "null"] }
        rewardItemCategory: { type: ["string", "null"] }
        rewardNote: { type: ["string", "null"] }
        contextLabel: { type: ["string", "null"], description: "Optional mission / event / custom context this breach is tied to (free text, or a snapshot of the linked mission's title)." }
        missionId: { type: ["integer", "null"], description: "Optional hard link to a real mission; when set the breach appears on that mission's page." }
        missionTitle: { type: ["string", "null"], description: "Current title of the linked mission (null if unlinked or the mission was deleted)." }
        status: { type: string, enum: [sent, in_progress, success, partial, failed, expired] }
        startedAt: { type: ["string", "null"], format: date-time }
        completedAt: { type: ["string", "null"], format: date-time }
        selection:
          type: ["array", "null"]
          items: { $ref: "#/components/schemas/BreachPos" }
        solvedCount: { type: integer }
        timeTakenSeconds: { type: ["integer", "null"] }
        rewardPaidAt: { type: ["string", "null"], format: date-time }
        dmSentAt: { type: ["string", "null"], format: date-time }
        createdAt: { type: string, format: date-time }
    BreachPreviewInput:
      type: object
      required: [difficulty]
      properties:
        difficulty: { type: string, enum: [easy, medium, hard, very_hard, nightmare, impossible] }
    BreachPreview:
      type: object
      required: [difficulty, grid, daemons, bufferSize, solutionCount, solutionPath]
      properties:
        difficulty: { type: string, enum: [easy, medium, hard, very_hard, nightmare, impossible] }
        grid:
          type: array
          description: "The code matrix as rows of hex byte strings."
          items:
            type: array
            items: { type: string }
        daemons:
          type: array
          description: "Each daemon is a sequence of hex byte strings to breach."
          items:
            type: array
            items: { type: string }
        bufferSize: { type: integer }
        solutionCount: { type: integer }
        solutionPath:
          type: array
          description: "One worked solution path (empty when the grid is unsolvable, e.g. impossible)."
          items: { $ref: "#/components/schemas/BreachPos" }
    BreachPuzzlePayload:
      type: object
      required: [grid, daemons, bufferSize]
      description: "A previewed puzzle to assign verbatim (from previewBreachPuzzle)."
      properties:
        grid:
          type: array
          items:
            type: array
            items: { type: string }
        daemons:
          type: array
          items:
            type: array
            items: { type: string }
        bufferSize: { type: integer }
    BreachPuzzleInput:
      type: object
      required: [assignedCharacterId, difficulty, timeLimitSeconds]
      properties:
        assignedCharacterId: { type: integer, description: "The character to send the puzzle to; its owning player receives the DM." }
        difficulty: { type: string, enum: [easy, medium, hard, very_hard, nightmare, impossible] }
        timeLimitSeconds: { type: integer, minimum: 10, maximum: 600 }
        rewardEddies: { type: integer, minimum: 0, description: "Eddies paid to the player on success. Defaults to 0." }
        rewardItemName: { type: ["string", "null"] }
        rewardItemCategory: { type: ["string", "null"] }
        rewardNote: { type: ["string", "null"] }
        contextLabel: { type: ["string", "null"], description: "Optional mission / event / custom context to tie this breach to (free text)." }
        missionId: { type: ["integer", "null"], description: "Optional id of a real mission to link this breach to. When set, contextLabel is snapshotted from the mission title if not otherwise provided." }
        puzzle:
          description: "Optional previewed puzzle to assign exactly as shown; omit to generate a fresh one."
          oneOf:
            - { $ref: "#/components/schemas/BreachPuzzlePayload" }
            - { type: "null" }
    BreachResultInput:
      type: object
      required: [selection]
      properties:
        selection:
          type: array
          description: "The player's final selected path through the matrix."
          items: { $ref: "#/components/schemas/BreachPos" }
    BreachResult:
      type: object
      required: [puzzle, success, solvedCount, totalDaemons, valid, rewardPaid]
      properties:
        puzzle: { $ref: "#/components/schemas/BreachPuzzle" }
        success: { type: boolean, description: "True when every daemon was breached within the buffer." }
        valid: { type: boolean, description: "True when the submitted path obeys the alternating row/column rules." }
        solvedCount: { type: integer }
        totalDaemons: { type: integer }
        rewardPaid: { type: boolean, description: "True if a reward was paid out by this call. Usually false on idempotent retry or when there is no reward, but MAY be true on retry when this call settles a previously-unsettled reward leg." }
        rewardEddies: { type: integer }
        rewardItemName: { type: ["string", "null"] }
        message: { type: ["string", "null"] }
    BreachPracticeDifficultyStats:
      type: object
      required: [attempts, solves, fastestClearMs]
      properties:
        attempts: { type: integer, minimum: 0 }
        solves: { type: integer, minimum: 0 }
        fastestClearMs:
          type: ["integer", "null"]
          description: "Best (smallest) clear time in ms; null until first solve."
    BreachPracticeStats:
      type: object
      description: "Per-difficulty personal practice progress for the caller."
      required: [easy, medium, hard, very_hard, nightmare]
      properties:
        easy: { $ref: "#/components/schemas/BreachPracticeDifficultyStats" }
        medium: { $ref: "#/components/schemas/BreachPracticeDifficultyStats" }
