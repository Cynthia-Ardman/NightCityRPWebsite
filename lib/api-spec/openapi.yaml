    parameters:
      - { in: path, name: id, required: true, schema: { type: integer } }
    post:
      operationId: giveRipperdocItem
      tags: [ripperdocs]
      summary: Give a stock item to a character for free instantly (transfers the item now; no charge)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/StoreSaleInput" }
      responses:
        "200":
          description: Give completed (or dry-run preview in Test mode)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApproveOfferResult" }
        "400": { description: Bad request }
        "403": { description: Not authorized }
        "404": { description: Not found }
        "409": { description: "Out of stock, buyer unclaimed, or economy disabled" }
        "502": { description: Wallet provider unavailable }
  /ripperdocs/{id}/remove:
    parameters:
      - { in: path, name: id, required: true, schema: { type: integer } }
    post:
      operationId: removeRipperdocCyberware
      tags: [ripperdocs]
      summary: Uninstall cyberware from a character instantly (optional fee charged now)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CyberwareRemoveInput" }
      responses:
        "200":
          description: Removal completed (or dry-run preview in Test mode)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApproveOfferResult" }
        "400": { description: Item is not installed cyberware or buyer has insufficient funds }
        "403": { description: Not authorized }
        "404": { description: Cyberware or character not found }
        "409": { description: Character unclaimed or economy disabled }
        "502": { description: Wallet provider unavailable }
