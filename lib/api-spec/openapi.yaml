        voters:
          type: array
          description: "Reviewers who have already cast a vote on this proposal. Empty on the player-facing /edits/mine view."
          items:
            type: object
            required: [id, vote]
            properties:
              id: { type: string }
              name: { type: ["string", "null"] }
              avatarUrl: { type: ["string", "null"] }
              vote: { type: string, enum: [approve, reject] }
        canVote: { type: boolean }
        canOverride: { type: boolean }
        canClose: { type: boolean }
        canReopen: { type: boolean }
        decided: { type: ["string", "null"], enum: [approved, rejected, null], description: "Vote-endpoint only: the decision a freshly-cast vote tipped the proposal to, or null." }
        cleared: { type: boolean, description: "Vote-endpoint only: true when re-casting the same vote cleared (un-voted) it." }

