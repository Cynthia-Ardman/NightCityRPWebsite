        "403": { description: Forbidden }
        "404": { description: Not found }
  /ripperdocs/{id}/stock:
    parameters:
      - { in: path, name: id, required: true, schema: { type: integer } }
    post:
      operationId: addRipperdocStock
      tags: [ripperdocs]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/StockInput" }
      responses:
        "201":
          description: Added
