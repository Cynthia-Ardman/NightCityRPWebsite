  /review/{subjectType}/{id}/comments:
    parameters:
      - { in: path, name: subjectType, required: true, schema: { type: string, enum: [edit, request, sheet, lore] } }
      - { in: path, name: id, required: true, schema: { type: integer } }
    get:
      operationId: listReviewComments
      tags: [review]
      summary: The two-way comment thread on a review subject (character edit / custom request / sheet). Visible to the submitter and any reviewer. Comments never change the subject's status.
      responses:
        "200":
          description: Thread, oldest first
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ReviewComment" }
        "400": { description: Bad subject }
        "403": { description: Submitter or reviewers only }
        "404": { description: Not found }
    post:
      operationId: postReviewComment
      tags: [review]
      summary: Post a comment on a review subject. Never changes status, so it can never block an approval. Best-effort DMs the submitter when a reviewer comments.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ReviewCommentInput" }
      responses:
        "201":
          description: Comment created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReviewComment" }
        "400": { description: Comment body required / too long / bad subject }
        "403": { description: Submitter or reviewers only }
        "404": { description: Not found }
  /review/{subjectType}/{id}/seen:
    parameters:
      - { in: path, name: subjectType, required: true, schema: { type: string, enum: [edit, request, sheet, lore] } }
      - { in: path, name: id, required: true, schema: { type: integer } }
    post:
      operationId: markReviewSeen
      tags: [review]
      summary: Mark a review subject as seen by the current user (called when a reviewer opens it). Drops it from their unseen notification count until there is fresh activity.
      responses:
        "200":
          description: Marked seen
          content:
            application/json:
              schema:
                type: object
                required: [ok]
                properties:
                  ok: { type: boolean }
        "400": { description: Bad subject }
        "403": { description: Submitter or reviewers only }
        "404": { description: Not found }
  /review/unseen-counts:
    get:
      operationId: getReviewUnseenCounts
      tags: [review]
      summary: Per-queue count of actionable review items the current reviewer has not yet seen. Role-gated like the queue lists; excludes the viewer's own submissions. Lore is not included.
      responses:
        "200":
          description: Unseen counts
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReviewUnseenCounts" }
  /review/my-unseen:
    get:
      operationId: getMyUnseen
      tags: [review]
      summary: The submitter's unread view — per queue, the ids of the caller's own submissions with unseen activity (a reviewer comment or a decision/close), plus a grand total for the nav badge. Not role-gated.
      responses:
        "200":
          description: Unseen submission ids for the current user
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MyUnseen" }
  /review/unseen-ids:
    get:
      operationId: getReviewUnseenIds
      tags: [review]
      summary: The reviewer's per-row unread view — same actionable scope and role gating as unseen-counts, but returns the unseen ids per queue so the staff page can dot each ticket.
      responses:
        "200":
          description: Unseen actionable ids per queue
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReviewUnseenIds" }
  /review/unread-detail:
    get:
      operationId: getReviewUnreadDetail
      tags: [review]
      summary: Per-item count of unread discussion comments (authored by someone other than the viewer, since the reviewer's last-seen) for each actionable ticket, keyed by id per queue. Same actionable scope and role gating as unseen-ids.
      responses:
        "200":
          description: Per-item unread discussion counts per queue
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReviewUnreadDetail" }
  /review/{subjectType}/{id}/discord-thread:
    parameters:
      - { in: path, name: subjectType, required: true, schema: { type: string, enum: [edit, request, sheet, mission, lore] } }
      - { in: path, name: id, required: true, schema: { type: integer } }
    get:
      operationId: getReviewDiscordThread
      tags: [review]
      summary: The subject's Discord discussion thread, displayed READ-ONLY on the detail page. Reviewers/staff only. The portal never posts to Discord. Serves review tickets (edit/request/sheet) and missions. Returns linked:false with an empty list when no thread is linked yet.
      responses:
        "200":
          description: Discord thread mirror
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DiscordThreadView" }
        "400": { description: Bad subject }
        "403": { description: Reviewers only }
        "404": { description: Not found }
  /review/{subjectType}/{id}/close:
    parameters:
      - { in: path, name: subjectType, required: true, schema: { type: string, enum: [edit, request, sheet, lore] } }
      - { in: path, name: id, required: true, schema: { type: integer } }
    post:
      operationId: closeReviewTicket
      tags: [review]
      summary: Archive a resolved ticket. When the ticket was approved this commits its deferred effect (lease / inventory / character materialization / edit diff) exactly once. Idempotent — re-closing a closed ticket is a no-op 200. Reviewers only.
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ReviewCloseInput" }
      responses:
        "200":
          description: Closed (returns the updated subject shape)
          content:
            application/json:
              schema: { type: object, additionalProperties: true }
        "400": { description: Bad subject / character missing/archived/unclaimed }
        "403": { description: Reviewers only }
        "404": { description: Not found }
        "409": { description: Ticket is not in a resolved state }
  /review/{subjectType}/{id}/reopen:
    parameters:
      - { in: path, name: subjectType, required: true, schema: { type: string, enum: [edit, request, sheet, lore] } }
      - { in: path, name: id, required: true, schema: { type: integer } }
    post:
      operationId: reopenReviewTicket
      tags: [review]
      summary: Send a resolved (approved | rejected) ticket back to pending for another vote. Clears votes and the decision fields. Refuses when the effect was already applied. Reviewers only.
      responses:
        "200":
          description: Reopened (returns the updated subject shape)
          content:
            application/json:
              schema: { type: object, additionalProperties: true }
        "400": { description: Bad subject }
        "403": { description: Reviewers only }
        "404": { description: Not found }
        "409": { description: Ticket cannot be reopened (wrong state or effect already applied) }
  # ---------------- BREACH PROTOCOL (hacking minigame) ----------------
  /breach/puzzles:
    get:
      operationId: listBreachPuzzles
      tags: [breach]
      summary: Staff log of every generated Breach Protocol puzzle (newest first).
      parameters:
        - { in: query, name: status, schema: { type: string, enum: [sent, in_progress, success, partial, failed, expired] } }
        - { in: query, name: missionId, schema: { type: integer }, description: "Only return breaches linked to this mission." }
      responses:
        "200":
          description: Puzzles
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/BreachPuzzle" }
        "403": { description: Requires FIXER or ADMIN role }
    post:
      operationId: createBreachPuzzle
      tags: [breach]
      summary: Generate a timed puzzle at a difficulty, assign it to a character's player, and DM a play link.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BreachPuzzleInput" }
      responses:
        "201":
          description: Created and sent
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BreachPuzzle" }
        "400": { description: Invalid input (e.g. character has no linked player) }
        "403": { description: Requires FIXER or ADMIN role }
        "404": { description: Character not found }
  /breach/puzzles/preview:
    post:
      operationId: previewBreachPuzzle
      tags: [breach]
      summary: Generate a puzzle with a worked solution for staff preview (not persisted).
      description: >-
        Staff-only. Generates a puzzle at the requested difficulty and returns it
        along with one worked solution path so a fixer can preview before
        assigning. Nothing is saved; pass the returned grid/daemons/bufferSize
        back to POST /breach/puzzles to assign exactly what was previewed.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BreachPreviewInput" }
      responses:
        "200":
          description: Generated preview
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BreachPreview" }
        "400": { description: Invalid difficulty }
        "403": { description: Requires FIXER or ADMIN role }
  /breach/mine:
    get:
      operationId: listMyBreachPuzzles
      tags: [breach]
      summary: The caller's own Breach Protocol puzzles (assigned to them), newest first.
      responses:
        "200":
          description: Puzzles
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/BreachPuzzle" }
  /breach/mine/pending-count:
    get:
      operationId: getMyBreachPendingCount
      tags: [breach]
      summary: Count of the caller's un-started incoming breaches (status 'sent'); polled to flash the My Breaches nav.
      responses:
        "200":
          description: Pending count
          content:
            application/json:
              schema:
                type: object
                required: [count]
                properties:
                  count: { type: integer }
  /breach/puzzles/{id}:
    parameters:
      - { in: path, name: id, required: true, schema: { type: integer } }
    get:
      operationId: getBreachPuzzle
      tags: [breach]
      summary: A single puzzle (the assigned player or staff).
      responses:
        "200":
          description: Puzzle
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BreachPuzzle" }
        "403": { description: Forbidden }
        "404": { description: Not found }
  /breach/puzzles/{id}/start:
    parameters:
      - { in: path, name: id, required: true, schema: { type: integer } }
    post:
      operationId: startBreachPuzzle
      tags: [breach]
      summary: Start the server-authoritative timer for this puzzle (assigned player; idempotent).
      responses:
        "200":
          description: Started (returns the puzzle with startedAt set)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BreachPuzzle" }
        "403": { description: Forbidden }
        "404": { description: Not found }
        "409": { description: Puzzle already completed }
  /breach/puzzles/{id}/result:
    parameters:
      - { in: path, name: id, required: true, schema: { type: integer } }
    post:
      operationId: submitBreachResult
      tags: [breach]
      summary: Submit the final selected path; server scores it, pays any reward once, and notifies staff.
      description: >-
        Authoritative scoring. Invalid or losing paths are recorded as a failed
        attempt (still 200). Resubmitting a completed puzzle returns the recorded
        outcome idempotently (no double pay). `ln` is usually false on resubmit,
        but MAY be true when this call settles a previously-unsettled reward (e.g.
        an earlier payout leg failed and is now retried).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BreachResultInput" }
      responses:
        "200":
          description: Scored, or idempotent replay of an already-completed puzzle.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BreachResult" }
        "403": { description: Forbidden }
        "404": { description: Not found }
  /characters/{id}/breach:
    parameters:
      - { in: path, name: id, required: true, schema: { type: integer } }
    get:
      operationId: listCharacterBreachPuzzles
      tags: [breach]
      summary: Breach Protocol history for a single character (owner or staff), newest first.
      responses:
        "200":
          description: Puzzles
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/BreachPuzzle" }
        "403": { description: Forbidden }
        "404": { description: Not found }
  /breach/practice/stats:
    get:
      operationId: getBreachPracticeStats
      tags: [breach]
      summary: The caller's own opt-in, account-synced practice stats.
      description: >-
        Personal practice progress (attempts / solves / fastest clear per
        difficulty) mirrored to the logged-in player's account so it follows
        them across devices. This is intentionally separate from the
        server-authoritative assigned-puzzle flow: no economy, no rewards, no
        leaderboards, not visible to anyone else.
      responses:
        "200":
          description: Practice stats
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BreachPracticeStats" }
        "401": { description: Authentication required }
    delete:
      operationId: clearBreachPracticeStats
      tags: [breach]
      summary: Reset the caller's account-synced practice stats.
      responses:
        "200":
          description: Stats after reset (all zeroed)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BreachPracticeStats" }
        "401": { description: Authentication required }
  /breach/practice/leaderboard:
    get:
      operationId: getBreachPracticeLeaderboard
      tags: [breach]
      summary: Fastest individual practice clear runs per difficulty.
      description: >-
        A per-difficulty ranking of the fastest individual practice clear runs.
        Every successful run competes on its own, so one player can hold several
        slots. Only players who opted into account sync appear. Public: no
        login required. No economy or rewards — a friendly fastest-time ranking
        only.
      responses:
        "200":
          description: Leaderboard
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BreachPracticeLeaderboard" }
  /breach/practice/record:
    post:
      operationId: recordBreachPracticeAttempt
      tags: [breach]
      summary: Record one practice attempt against the caller's account.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BreachPracticeRecordInput" }
      responses:
        "200":
          description: Updated practice stats
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BreachPracticeStats" }
        "400": { description: Invalid difficulty }
        "401": { description: Authentication required }
  /breach/practice/merge:
    post:
      operationId: mergeBreachPracticeStats
      tags: [breach]
      summary: First-sync merge of the browser's local-only practice stats into the account.
      description: >-
        Folds local stats into the account, summing attempts/solves and keeping
        the better (smaller) fastest clear per difficulty. The client clears its
        local snapshot after a successful merge so the same history is not
        re-added on a later sync.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BreachPracticeMergeInput" }
      responses:
        "200":
          description: Merged practice stats
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BreachPracticeStats" }
        "401": { description: Authentication required }

  # ---------------- NCPD ----------------
  /ncpd/characters:
