          type: object
          required: [paid, simulated, failed, skipped, live]
          properties:
            paid: { type: integer }
            simulated: { type: integer }
            failed: { type: integer }
            skipped: { type: integer }
            live: { type: boolean }
        payouts:
          type: array
          items: { $ref: "#/components/schemas/ActorPayoutEvent" }

