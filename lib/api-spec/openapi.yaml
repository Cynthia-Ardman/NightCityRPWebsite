            username: { type: string }
            globalName: { type: [string, "null"] }
            avatarUrl: { type: [string, "null"] }
            roles:
              type: array
              items: { type: string }
            lastSeenAt: { type: [string, "null"], format: date-time }
        characters:
          type: array
          items:
            type: object
            required: [id, name]
            properties:
              id: { type: integer }
              name: { type: string }
              lifeStatus: { type: string }
              archived: { type: boolean }
              claimed: { type: boolean }
              lastCheckupAt: { type: [string, "null"], format: date-time }
              checkupStreak: { type: [integer, "null"] }
        checkups:
          type: array
          description: >-
            Ripperdoc checkup history across all of this player's characters,
            newest first (sourced from the audit log — same records the
            Ripperdoc Console shows). actorName is the doc/staff member who
            recorded the visit.
          items:
            type: object
            required: [id]
            properties:
              id: { type: integer }
              characterId: { type: [integer, "null"] }
              characterName: { type: [string, "null"] }
              actorName: { type: [string, "null"] }
              message: { type: [string, "null"] }
              level: { type: [string, "null"] }
              createdAt: { type: [string, "null"], format: date-time }
        medsCharges:
          type: array
          description: >-
            Cyberware/meds charge history across this player's characters
            (wallet rows in the cyberware category), newest first. Memos carry
            the week count for weekly meds bills.
          items:
            type: object
            required: [id, amount, kind, createdAt]
            properties:
              id: { type: integer }
              characterId: { type: [integer, "null"] }
              characterName: { type: [string, "null"] }
              amount: { type: integer }
              kind: { type: string }
              memo: { type: [string, "null"] }
              createdAt: { type: string, format: date-time }
        auditEntries:
          type: array
          items:
            type: object
            required: [id, category, action, createdAt]
            properties:
              id: { type: integer }
              category: { type: string }
              action: { type: string }
              message: { type: [string, "null"] }
              targetType: { type: [string, "null"] }
              targetId: { type: [string, "null"] }
              createdAt: { type: string, format: date-time }
        activityEvents:
          type: array
          items:
            type: object
            required: [id, kind, message, createdAt]
            properties:
              id: { type: integer }
              kind: { type: string }
              message: { type: string }
              createdAt: { type: string, format: date-time }
        walletTransactions:
          type: array
          items:
            type: object
            required: [id, amount, kind, source, createdAt]
            properties:
              id: { type: integer }
              characterId: { type: [integer, "null"] }
              characterName: { type: [string, "null"] }
              amount: { type: integer }
              kind: { type: string }
              memo: { type: [string, "null"] }
              source: { type: string }
              counterpartyName: { type: [string, "null"] }
              counterpartyCharacterId: { type: [integer, "null"] }
              counterpartyCharacterName: { type: [string, "null"] }
              counterpartyVenueKind: { type: [string, "null"], enum: [store, ripperdoc, null] }
              counterpartyVenueId: { type: [integer, "null"] }
              counterpartyVenueName: { type: [string, "null"] }
              createdAt: { type: string, format: date-time }
        missions:
          type: array
          items:
            type: object
            required: [id, paymentStatus, createdAt]
            properties:
              id: { type: integer }
              missionId: { type: [integer, "null"] }
              missionTitle: { type: [string, "null"] }
              missionStartAt: { type: [string, "null"], format: date-time }
              characterName: { type: [string, "null"] }
              attendanceCreditedAt: { type: [string, "null"], format: date-time }
              paymentStatus: { type: string }
              payAmount: { type: [integer, "null"] }
              paidAt: { type: [string, "null"], format: date-time }
              createdAt: { type: string, format: date-time }
        actorPayments:
          type: array
          items:
            type: object
            required: [id, amount, paymentStatus, createdAt]
            properties:
              id: { type: integer }
              missionId: { type: [integer, "null"] }
              missionName: { type: [string, "null"] }
              eventType: { type: [string, "null"] }
              characterName: { type: [string, "null"] }
              fixerName: { type: [string, "null"] }
              amount: { type: integer }
              paymentStatus: { type: string }
              missionDate: { type: [string, "null"], format: date-time }
              paidAt: { type: [string, "null"], format: date-time }
              createdAt: { type: string, format: date-time }
        attendanceClaims:
          type: array
          items:
            type: object
            required: [id, weekStart, amount, claimedAt]
            properties:
              id: { type: integer }
              weekStart: { type: string }
              amount: { type: integer }
              claimedAt: { type: string, format: date-time }
        drafts:
          type: array
          description: >-
            Character-sheet drafts this player has created but not yet submitted
            for review (status = draft). Read-only; visible to fixer/admin.
          items:
            type: object
            required: [id, name, status, createdAt]
            properties:
              id: { type: integer }
              name: { type: string }
              characterId: { type: [integer, "null"] }
              status: { type: string }
              createdAt: { type: string, format: date-time }
        rejectedRequests:
          type: array
          description: >-
            Proposals (custom requests) this player submitted that were rejected
            in review (status = rejected). Read-only; visible to fixer/admin. Link
            each to /requests?focus=<id> to open and read it in the review queue.
          items:
            type: object
            required: [id, type, title, status, createdAt]
            properties:
              id: { type: integer }
              type: { type: string }
              title: { type: string }
              description: { type: [string, "null"] }
              characterId: { type: [integer, "null"] }
              status: { type: string }
              reviewerNote: { type: [string, "null"] }
              reviewedAt: { type: [string, "null"], format: date-time }
              createdAt: { type: string, format: date-time }
        stores:
          type: array
          items:
            type: object
            required: [id, name, balance, createdAt]
            properties:
              id: { type: integer }
              name: { type: string }
              kind: { type: [string, "null"] }
              location: { type: [string, "null"] }
              balance: { type: integer }
              createdAt: { type: string, format: date-time }
        ripperdocs:
          type: array
          items:
            type: object
            required: [id, name, balance, createdAt]
            properties:
              id: { type: integer }
              name: { type: string }
              location: { type: [string, "null"] }
              balance: { type: integer }
              createdAt: { type: string, format: date-time }
        historicalAppearances:
          type: [object, "null"]
          description: >-
            Imported historical mission attendance for this player from the
            community attendance sheet (appearance count + dates). Null when no
            imported record exists.
          required: [count, dates]
          properties:
            count: { type: integer }
            dates:
              type: array
              items: { type: string }
            username: { type: [string, "null"] }
            updatedAt: { type: [string, "null"], format: date-time }

    InventoryItemInput:
      type: object
      required: [name, quantity]
      properties:
        name: { type: string, minLength: 1, maxLength: 500 }
        category: { type: string }
        quantity: { type: integer, minimum: 1 }
        notes: { type: string }
        cyberwareReq: { type: ["string", "null"], description: "Cyberware required to operate this item (guns). Staff-only." }
        equipped: { type: boolean }

    InventoryItemUpdate:
      type: object
      properties:
        name: { type: string, minLength: 1, maxLength: 500 }
        category: { type: string }
        quantity: { type: integer, minimum: 0 }
        notes: { type: string }
        cyberwareReq: { type: ["string", "null"], description: "Cyberware required to operate this item (guns). Staff-only." }
        equipped: { type: boolean }

    InventoryTransferInput:
      type: object
      required: [toCharacterId, mode]
      properties:
        toCharacterId: { type: integer }
        mode: { type: string, enum: [give, sell] }
        quantity: { type: integer, minimum: 1, description: "Defaults to 1. Cannot exceed source quantity." }
        price: { type: integer, minimum: 1, description: "Required when mode=sell. Total price paid by recipient." }
        memo: { type: string }

    Wallet:
      type: object
      required: [characterId, balance, source]
      properties:
        characterId: { type: integer }
        balance: { type: integer }
        bank: { type: integer }
        cash: { type: integer }
        source: { type: string, enum: [unbelievaboat, local] }
        updatedAt: { type: string, format: date-time }

    UserWallet:
      type: object
      required: [balance, source]
      properties:
        balance: { type: integer }
        cash: { type: integer }
        bank: { type: integer }
        source: { type: string, enum: [unbelievaboat, local] }

    WalletMoveInput:
      type: object
      required: [amount]
      properties:
        amount: { type: integer, minimum: 1, description: "Positive number of eddies to move between bank and cash." }
        idempotencyKey: { type: string, maxLength: 100, description: "Client-generated key (e.g. a UUID created once per submit) so a network retry / double-click of the same withdraw or deposit doesn't move eddies twice." }

    TransferInput:
      type: object
      required: [toCharacterId, amount]
      properties:
        toCharacterId: { type: integer }
        amount: { type: integer, minimum: 1 }
        memo: { type: string }
        idempotencyKey: { type: string, maxLength: 100, description: "Client-generated key (e.g. a UUID created once per submit) so a network retry / double-click of the same transfer doesn't move eddies twice." }

    SinkInput:
      type: object
      required: [amount]
      properties:
        amount: { type: integer, minimum: 1 }
        memo: { type: string }
        idempotencyKey: { type: string, maxLength: 100, description: "Client-generated key (e.g. a UUID created once per submit) so a retry / double-click doesn't burn eddies twice." }

    AdminSinkInput:
      type: object
      required: [characterId, amount]
      properties:
        characterId: { type: integer }
        amount: { type: integer, minimum: 1 }
        memo: { type: string }
        idempotencyKey: { type: string, maxLength: 100, description: "Client-generated key so a retry / double-click doesn't burn eddies twice." }

    WalletTransaction:
      type: object
      required: [id, amount, kind, createdAt]
      properties:
        id: { type: integer }
        characterId: { type: ["integer", "null"] }
        characterName: { type: ["string", "null"] }
        userId: { type: ["string", "null"] }
        amount: { type: integer }
        kind:
          type: string
          description: |
            Wallet transaction kind. Includes legacy values plus per-billing-line
            kinds emitted by the autobill cron (rent, business_rent, lifestyle,
            baseline, trauma_team, xanadu_gold, meds, transfer, lifestyle_unpaid,
            and others) plus economy kinds (store_deposit, store_withdraw,
            ripperdoc_deposit, ripperdoc_withdraw, reconcile, reconcile_seed).
            Treat as an open vocabulary.
        memo: { type: ["string", "null"] }
        category:
          type: ["string", "null"]
          description: |
            Coarse display/reporting bucket derived from kind+memo: rent,
            cyberware, mission, business, membership, fee, purchase, transfer,
            sink, other. Independent of `kind` (which stays load-bearing for billing).
            Always populated in responses (derived on the fly if not stored).
        counterpartyName: { type: ["string", "null"] }
        counterpartyCharacterId: { type: ["integer", "null"] }
        counterpartyCharacterName: { type: ["string", "null"] }
        source:
          type: string
          description: "Origin of the change (website, ub, reconciliation, store, ripperdoc, mission, commission, admin). Open vocabulary."
        syncStatus:
          type: string
          description: "UB sync state: synced, pending, failed, reconciled. Open vocabulary."
        previousBalance: { type: ["integer", "null"] }
        newBalance: { type: ["integer", "null"] }
        errorMessage: { type: ["string", "null"] }
        storeId: { type: ["integer", "null"] }
        ripperdocId: { type: ["integer", "null"] }
        counterpartyVenueKind:
          type: ["string", "null"]
          description: "Kind of counterparty venue referenced by the transaction: store, ripperdoc, or null."
        counterpartyVenueId: { type: ["integer", "null"] }
        counterpartyVenueName: { type: ["string", "null"] }
        createdAt: { type: string, format: date-time }

    CharacterStatus:
      type: object
      required: [characterId, loa, attending, openShop, updatedAt]
      properties:
        characterId: { type: integer }
        loa: { type: boolean }
        loaReturnsAt: { type: ["string", "null"], format: date-time }
        attending: { type: boolean }
        openShop: { type: boolean }
        statusMessage: { type: ["string", "null"] }
        updatedAt: { type: string, format: date-time }

    CharacterStatusUpdate:
      type: object
      properties:
        loa: { type: boolean }
        loaReturnsAt: { type: string, format: date-time }
        attending: { type: boolean }
        openShop: { type: boolean }
        statusMessage: { type: string }

    RipperdocPublic:
      type: object
      required: [id, name]
      properties:
        id: { type: integer }
        name: { type: string }
        ownerId: { type: ["string", "null"], description: "User id of the clinic owner; lets the owner reveal the Manage action." }
        ownerName: { type: ["string", "null"] }
        purpose: { type: ["string", "null"] }
        location: { type: ["string", "null"] }
        description: { type: ["string", "null"] }
        bannerUrl: { type: ["string", "null"] }
        employeeNames:
          type: array
          items: { type: string }

    StorePublic:
      type: object
      required: [id, name]
      properties:
        id: { type: integer }
        name: { type: string }
        ownerName: { type: ["string", "null"] }
        kind: { type: string, enum: [guns, gear, clothing, mixed, other] }
        purpose: { type: ["string", "null"] }
        location: { type: ["string", "null"] }
        description: { type: ["string", "null"] }
        bannerUrl: { type: ["string", "null"] }
        employeeNames:
          type: array
          items: { type: string }

    Store:
      type: object
      required: [id, name, kind, ownerId, employees, stock]
      properties:
        id: { type: integer }
        name: { type: string }
        ownerId: { type: string }
        ownerCharacterId: { type: ["integer", "null"] }
        housingId: { type: ["integer", "null"], description: "Business lease this venue operates out of (null = off-map / unlinked)." }
        balance: { type: integer, description: "Website-only business account balance (eddies)." }
        kind: { type: string, enum: [guns, gear, clothing, mixed, other] }
        purpose: { type: ["string", "null"] }
        location: { type: ["string", "null"] }
        description: { type: ["string", "null"] }
        bannerUrl: { type: ["string", "null"] }
        lease:
          oneOf: [{ $ref: "#/components/schemas/BusinessLease" }, { type: "null" }]
        employees:
          type: array
          items: { $ref: "#/components/schemas/Employee" }
        stock:
          type: array
          items: { $ref: "#/components/schemas/StockItem" }

    StoreUpdate:
      type: object
      properties:
        name: { type: string }
        kind: { type: string, enum: [guns, gear, clothing, mixed, other] }
        purpose: { type: ["string", "null"] }
        location: { type: ["string", "null"] }
        description: { type: ["string", "null"] }
        bannerUrl: { type: ["string", "null"] }
        ownerId: { type: string }
        ownerCharacterId: { type: ["integer", "null"] }
        housingId: { type: ["integer", "null"], description: "Staff-only: associate (or clear with null) the business lease this venue operates out of." }

    Ripperdoc:
      type: object
      required: [id, name, ownerId, employees, stock]
      properties:
        id: { type: integer }
        name: { type: string }
        ownerId: { type: string }
        ownerCharacterId: { type: ["integer", "null"] }
        housingId: { type: ["integer", "null"], description: "Business lease this venue operates out of (null = off-map / unlinked)." }
        balance: { type: integer, description: "Website-only business account balance (eddies)." }
        purpose: { type: ["string", "null"] }
        location: { type: ["string", "null"] }
        description: { type: ["string", "null"] }
        bannerUrl: { type: ["string", "null"] }
        lease:
          oneOf: [{ $ref: "#/components/schemas/BusinessLease" }, { type: "null" }]
        employees:
          type: array
          items: { $ref: "#/components/schemas/Employee" }
        stock:
          type: array
          items: { $ref: "#/components/schemas/StockItem" }

    RipperdocUpdate:
      type: object
      properties:
        name: { type: string }
        purpose: { type: ["string", "null"] }
        location: { type: ["string", "null"] }
        description: { type: ["string", "null"] }
        bannerUrl: { type: ["string", "null"] }
        ownerId: { type: string }
        ownerCharacterId: { type: ["integer", "null"] }
        housingId: { type: ["integer", "null"], description: "Staff-only: associate (or clear with null) the business lease this venue operates out of." }

    BusinessLease:
      type: object
      required: [id, address, monthlyRent]
      properties:
        id: { type: integer }
        address: { type: string }
        monthlyRent: { type: integer }
        listingId: { type: ["integer", "null"] }
        characterId: { type: ["integer", "null"] }
        characterName: { type: ["string", "null"] }
        district: { type: ["string", "null"] }
        tier: { type: ["string", "null"] }

    Employee:
      type: object
      required: [id, characterId, name, role, commissionPct]
      properties:
        id: { type: integer }
        characterId: { type: integer }
        name: { type: string }
        role: { type: string }
        commissionPct: { type: integer, minimum: 0, maximum: 100, description: "Percent of each sale this employee earns as commission." }

    EmployeeInput:
      type: object
      required: [characterId, role]
      properties:
        characterId: { type: integer }
        role: { type: string, minLength: 1 }
        commissionPct: { type: integer, minimum: 0, maximum: 100 }

    EmployeePatch:
      type: object
      properties:
        role: { type: string, minLength: 1 }
        commissionPct: { type: integer, minimum: 0, maximum: 100 }

    StockPurchaseInput:
      type: object
      required: [catalogId]
      properties:
        catalogId: { type: integer, description: "Catalog gun (store) or cyberware (ripperdoc) id." }
        qty: { type: integer, minimum: 1, description: "Defaults to 1." }
        retailPrice: { type: integer, minimum: 0, description: "Shelf price for the new stock. Defaults to the catalog price." }
        unitCost: { type: integer, minimum: 0, description: "Fixer/admin only: override the per-unit cost. 0 stocks for free; a custom (>0) cost routes a cost-approval to the venue owner instead of charging immediately. Ignored for owner/employee callers." }

    StockPurchaseResult:
      type: object
      required: [totalCost, unitCost]
      properties:
        stock: { $ref: "#/components/schemas/StockItem", description: "The added/merged stock row. Absent when the purchase routed a cost-approval to the owner." }
        balance: { type: integer, description: "Venue account balance after the purchase. Absent when pending owner approval." }
        totalCost: { type: integer }
        unitCost: { type: integer, description: "Cost per unit charged to the venue." }
        pendingApproval: { type: boolean, description: "True when a fixer/admin custom cost created a cost-approval routed to the venue owner; no stock added and no balance charged until they approve." }
        requestId: { type: integer, description: "Id of the created stock-cost custom request (when pendingApproval)." }

    SaleOffer:
      type: object
      required: [id, kind, itemName, unitPrice, quantity, totalPrice, buyerCharacterId, buyerUserId, commissionPct, status]
      properties:
        id: { type: integer }
        kind: { type: string, enum: [store, ripperdoc] }
        offerType: { type: string, enum: [sale, install, remove, give, stock_add, install_owned, service], description: "What the offer does. Defaults to sale." }
        cwp: { type: ["integer", "null"], description: "Per-unit cyberware points (install) or the points removed (remove)." }
        removedItemId: { type: ["integer", "null"], description: "The installed inventory item a remove offer uninstalls." }
        installItemId: { type: ["integer", "null"], description: "The buyer-owned uninstalled inventory item an install_owned offer fits." }
        storeId: { type: ["integer", "null"] }
        ripperdocId: { type: ["integer", "null"] }
        stockId: { type: ["integer", "null"] }
        itemName: { type: string }
        itemCategory: { type: ["string", "null"] }
        unitPrice: { type: integer }
        quantity: { type: integer }
        totalPrice: { type: integer }
        costBasis: { type: ["integer", "null"], description: "Shop's total acquisition cost for this offer, snapshotted at offer time. Commission is a % of (totalPrice - costBasis)." }
        buyerCharacterId: { type: integer }
        buyerUserId: { type: string }
        sellerCharacterId: { type: ["integer", "null"] }
        sellerEmployeeId: { type: ["integer", "null"] }
        commissionPct: { type: integer }
        commissionAmount: { type: ["integer", "null"] }
        commissionSettledAt: { type: ["string", "null"], format: date-time }
        createdById: { type: string }
        memo: { type: ["string", "null"] }
        status: { type: string, enum: [pending, approved, denied, expired] }
        expiresAt: { type: ["string", "null"], format: date-time }
        decidedAt: { type: ["string", "null"], format: date-time }
        createdAt: { type: string, format: date-time }
        venueName: { type: ["string", "null"] }
        buyerName: { type: ["string", "null"] }

    ApproveOfferResult:
      type: object
      properties:
        offer: { $ref: "#/components/schemas/SaleOffer" }
        inventoryItem: { $ref: "#/components/schemas/InventoryItem" }
        commissionPaid: { type: integer }
        venueBalance: { type: integer }
        duplicate: { type: boolean, description: "True when the offer was already approved (idempotent retry)." }
        dryRun: { type: boolean, description: "True in Test mode — nothing was written." }
        wouldDebitBuyer: { type: integer }
        wouldCreditStore: { type: integer }
        wouldPayCommission: { type: integer }

    StockItem:
      type: object
      required: [id, name, price, quantity]
      properties:
        id: { type: integer }
        name: { type: string }
        category: { type: ["string", "null"] }
        price: { type: integer }
        cost: { type: integer, description: "Per-unit cost the shop paid. Commission is taken from profit (price - cost), not the full price. 0 => whole sale is profit." }
        quantity: { type: integer }
        notes: { type: ["string", "null"] }
        description: { type: ["string", "null"] }
        powerLevel: { type: ["string", "null"], description: "Power level (gun-store stock)." }
        cyberwareReq: { type: ["string", "null"], description: "Cyberware required to operate the gun (gun-store stock)." }

    StockInput:
      type: object
      required: [name, price, quantity]
      properties:
        name: { type: string, minLength: 1 }
        category: { type: string }
        price: { type: integer, minimum: 0 }
        cost: { type: integer, minimum: 0, description: "Per-unit cost the shop paid. Commission is taken from profit (price - cost). Defaults to 0." }
        quantity: { type: integer, minimum: 0 }
        notes: { type: string }
        description: { type: string }
        slot: { type: string, description: "Cyberware slot (clinic stock). Encoded into notes alongside CWP." }
        cwp: { type: integer, minimum: 0, description: "Cyberware points (clinic stock). Encoded into notes as 'CWP <n>'." }
        powerLevel: { type: string, description: "Power level (gun-store stock). Staff-only." }
        cyberwareReq: { type: string, description: "Cyberware required to operate the gun (gun-store stock). Staff-only." }

    StockOfferInput:
      type: object
      required: [itemName, unitPrice]
      description: "Admin proposal to add a cyberware piece to a venue's stock, billed to the venue on owner approval."
      properties:
        itemName: { type: string, minLength: 1 }
        unitPrice: { type: integer, minimum: 0, description: "Per-unit price billed to the venue account." }
        quantity: { type: integer, minimum: 1, description: "Defaults to 1." }
        cwp: { type: ["integer", "null"], minimum: 0, description: "Per-unit cyberware points." }
        memo: { type: ["string", "null"] }

    StoreSaleInput:
      type: object
      required: [stockId, buyerCharacterId]
      properties:
        stockId: { type: integer }
        buyerCharacterId: { type: integer }
        qty: { type: integer, minimum: 1, description: "Defaults to 1." }
        memo: { type: string }

    StoreSaleResult:
      type: object
      required: [stock, inventoryItem]
      properties:
        stock: { $ref: "#/components/schemas/StockItem" }
        inventoryItem: { $ref: "#/components/schemas/InventoryItem" }
        totalPaid: { type: integer }

    CyberwareInstallInput:
      type: object
      required: [stockId, buyerCharacterId]
      properties:
        stockId: { type: integer }
        buyerCharacterId: { type: integer }
        qty: { type: integer, minimum: 1, description: "Defaults to 1." }
        price: { type: integer, minimum: 0, description: "Install fee. Defaults to the stock item's price." }
        cwp: { type: integer, minimum: 0, description: "Operator CWP override; only used when the catalog has no authoritative value." }
        memo: { type: string }

    CyberwareRemoveInput:
      type: object
      required: [removedItemId, buyerCharacterId]
      properties:
        removedItemId: { type: integer, description: "The installed inventory item to uninstall." }
        buyerCharacterId: { type: integer }
        fee: { type: integer, minimum: 0, description: "Optional removal fee. Defaults to 0 (free)." }
        memo: { type: string }
        destination: { type: string, enum: [patient, clinic], description: "Where the removed chrome goes. 'patient' (default) keeps it in the character's inventory as removed chrome; 'clinic' moves it into the clinic's stock." }

    InstallOwnedInput:
      type: object
      required: [installItemId, buyerCharacterId]
      properties:
        installItemId: { type: integer, description: "The buyer-owned uninstalled cyberware inventory item to fit." }
        buyerCharacterId: { type: integer }
        price: { type: integer, minimum: 0, description: "Optional install fee. Defaults to 0 (free)." }
        cwp: { type: integer, minimum: 0, description: "Operator CWP override; only used when the catalog has no authoritative value." }
        memo: { type: string }

    ServiceBillInput:
      type: object
      required: [buyerCharacterId, amount, note]
      properties:
        buyerCharacterId: { type: integer, description: "The character being billed." }
        amount: { type: integer, minimum: 1, description: "Bill amount in eurodollars." }
        note: { type: string, maxLength: 200, description: "What the bill is for (shown to the player)." }

    CharacterCyberwareStatus:
      type: object
      required: [characterId, characterName, kind, used, installed]
      properties:
        characterId: { type: integer }
        characterName: { type: string }
        kind: { type: ["string", "null"], description: "pc or npc." }
        used: { type: integer, description: "Total CWP currently installed." }
        max: { type: ["integer", "null"], description: "CWP cap (null = unlimited, NPC)." }
        available: { type: ["integer", "null"], description: "Remaining CWP (null = unlimited)." }
        installed:
          type: array
          items:
            type: object
            required: [id, name, cwp]
            properties:
              id: { type: integer }
              name: { type: string }
              quantity: { type: ["integer", "null"] }
              notes: { type: ["string", "null"] }
              cwp: { type: integer }
        uninstalled:
          type: array
          description: "Cyberware the character owns but hasn't had fitted (no CWP tag) — install candidates."
          items:
            type: object
            required: [id, name]
            properties:
              id: { type: integer }
              name: { type: string }
              quantity: { type: ["integer", "null"] }
              notes: { type: ["string", "null"] }

    VenueAccountInput:
      type: object
      required: [amount]
      properties:
        amount: { type: integer, minimum: 1, description: "Whole eddies to move between the owner's personal wallet and the venue account." }
        idempotencyKey: { type: string, maxLength: 100, description: "Client-generated key (e.g. a UUID created once per submit) so network retries / double-clicks of the same move don't debit or credit twice." }
        memo: { type: string, maxLength: 200, description: "Optional note attached to a player gift (giveToStore only); ignored by deposit/withdraw/grant." }

    VenueAccountResult:
      type: object
      required: [ok, venueBalance, walletBalance]
      properties:
        ok: { type: boolean }
        venueBalance: { type: integer, description: "Venue balance after the move (unchanged when dryRun)." }
        walletBalance: { type: integer, description: "Owner personal wallet balance after the move (unchanged when dryRun)." }
        dryRun: { type: boolean, description: "True when the economy is in Test mode — nothing was written." }
        proposedVenueBalance: { type: integer, description: "What the venue balance WOULD become (Test mode only)." }
        proposedWalletBalance: { type: integer, description: "What the wallet balance WOULD become (Test mode only)." }

    EconomyOutOfSyncEntry:
      type: object
      required: [userId, username, walletBalance]
      properties:
        userId: { type: string }
        discordId: { type: string }
        username: { type: string }
        globalName: { type: ["string", "null"] }
        walletBalance: { type: integer, description: "Website-stored wallet balance." }
        ubBalance: { type: ["integer", "null"], description: "Live UnbelievaBoat total, or null if UB could not be reached." }
        lastSyncedUbBalance: { type: ["integer", "null"] }
        diff: { type: ["integer", "null"], description: "ubBalance - walletBalance, or null if UB unavailable." }
        lastSyncedAt: { type: ["string", "null"], format: date-time }
        lastSyncStatus: { type: ["string", "null"] }
        lastSyncError: { type: ["string", "null"] }

    EconomyOutOfSyncList:
      type: object
      required: [mode, entries]
      properties:
        mode: { type: string, enum: [disabled, test, enabled], description: "Current economy processing mode." }
        entries:
          type: array
          items: { $ref: "#/components/schemas/EconomyOutOfSyncEntry" }

    EconomyRetryResult:
      type: object
      required: [ok, status]
      properties:
        ok: { type: boolean }
        status: { type: string, description: "Outcome of the retry (synced, failed, disabled, dry_run, duplicate, pending, insufficient_funds)." }
        balance: { type: integer }
        error: { type: ["string", "null"] }

    StockUpdate:
      type: object
      properties:
        name: { type: string, minLength: 1 }
        category: { type: string }
        price: { type: integer, minimum: 0 }
        cost: { type: integer, minimum: 0, description: "Per-unit cost the shop paid. Commission is taken from profit (price - cost)." }
        quantity: { type: integer, minimum: 0 }
        notes: { type: string }
        description: { type: string }
        powerLevel: { type: string, description: "Power level (gun-store stock). Staff-only." }
        cyberwareReq: { type: string, description: "Cyberware required to operate (gun-store stock). Staff-only." }

    CustomGunInput:
      type: object
      description: |
        Payload for granting a one-off CUSTOM gun to a character (staff action).
      required: [characterId, name]
      properties:
        characterId: { type: integer, description: Owning character id. }
        name: { type: string, description: The bespoke gun's name. }
        description: { type: ["string", "null"] }
        imageUrl: { type: ["string", "null"] }
        cyberwareReq: { type: ["string", "null"], description: "Cyberware required to operate the gun." }
    CustomCatalogItem:
      type: object
      description: |
        An approved one-off custom item (gun / cyberware / off-map property)
