openapi: 3.1.0
info:
  title: Api
  version: 0.1.0
  description: Night City RP Portal API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
  - name: auth
  - name: characters
  - name: inventory
  - name: wallet
  - name: status
  - name: directory
  - name: catalog
  - name: stores
  - name: ripperdocs
  - name: fixer
  - name: pending-edits
  - name: sheets
  - name: dice
  - name: admin
  - name: dashboard
  - name: storage
    description: Object storage upload and serving endpoints.
  - name: requests
    description: Off-catalog custom requests (off-map property, custom guns, custom cyberware).
  - name: vrchat
    description: Admin/fixer VRChat CyberPsycho control panel (drives each staffer's local agent).
  - name: ncpd
    description: NCPD arrest reports, warrants, character records and the Book of Laws.

paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HealthStatus" }

  # ---------------- AUTH ----------------
  /auth/discord/login:
    get:
      operationId: discordLogin
      tags: [auth]
      summary: Redirect to Discord OAuth2
      responses:
        "302": { description: Redirect to Discord }
  /auth/discord/callback:
    get:
      operationId: discordCallback
      tags: [auth]
      summary: Discord OAuth2 callback
      parameters:
        - { in: query, name: code, schema: { type: string } }
        - { in: query, name: state, schema: { type: string } }
      responses:
        "302": { description: Redirect after login }
  /auth/logout:
    post:
      operationId: logout
      tags: [auth]
      responses:
        "204": { description: Logged out }
  /auth/onboarding/dismiss:
    post:
      operationId: dismissOnboarding
      tags: [auth]
      summary: Dismiss the first-run onboarding banner for the current user
      responses:
        "200":
          description: Banner dismissed
          content:
            application/json:
              schema:
                type: object
                required: [ok]
                properties:
                  ok: { type: boolean }
        "401": { description: Not logged in }
  /auth/notification-prompt/dismiss:
    post:
      operationId: dismissNotificationPrompt
      tags: [auth]
      summary: Dismiss the dashboard "set your Discord ping preferences" prompt
      responses:
        "200":
          description: Prompt dismissed
          content:
            application/json:
              schema:
                type: object
                required: [ok]
                properties:
                  ok: { type: boolean }
        "401": { description: Not logged in }
  /auth/accept-rules:
    post:
      operationId: acceptRules
      tags: [auth]
      summary: Accept the server rules (first-run rules splash)
      description: |
        Persists the current user's `rulesAccepted` flag so the blocking rules
        gate never reappears, and grants the "rules read" Discord role. Idempotent.
        The Discord role grant is best-effort and only fires on the real
        deployment; `roleGranted` reports whether it succeeded.
      responses:
        "200":
          description: Rules accepted
          content:
            application/json:
              schema:
                type: object
                required: [ok, roleGranted]
                properties:
                  ok: { type: boolean }
                  roleGranted:
                    type: boolean
                    description: "True when the Discord rules role was granted on this call."
        "401": { description: Not logged in }
  /auth/me:
    get:
      operationId: getMe
      tags: [auth]
      summary: Current session user
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Me" }
        "401": { description: Not logged in }

  # ---------------- CHARACTERS ----------------
  /characters:
    get:
      operationId: listMyCharacters
      tags: [characters]
      summary: List the current user's characters (PC + NPC)
      responses:
        "200":
          description: List
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Character" }
    post:
      operationId: createCharacter
      tags: [characters]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CharacterInput" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Character" }
  /characters/{id}:
    parameters:
      - { in: path, name: id, required: true, schema: { type: integer } }
    get:
      operationId: getCharacter
      tags: [characters]
      responses:
        "200":
          description: Character
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Character" }
    patch:
      operationId: updateCharacter
      tags: [characters]
      summary: Submit a character edit for fixer review
      description: |
        Character edits no longer auto-apply. Submitting a PATCH queues a
        `pending_character_edit` row that must be approved by a majority of
        FIXER / CS_APPROVER / ADMIN reviewers (the submitter is excluded
        from the eligible-voter pool). Returns 202 with the pending edit
        id. Only one pending edit may exist per character at a time.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CharacterUpdate" }
      responses:
        "200":
          description: |
            Cosmetic-only edit (portraits, background, archetype, or sheet
            preamble/formatting) applied immediately without review.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CharacterEditAutoApplied" }
        "202":
          description: Edit queued for review
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CharacterEditSubmission" }
        "400": { description: No changes or invalid payload }
        "409":
          description: A pending edit already exists for this character
          content:
            application/json:
              schema:
                type: object
                properties:
                  error: { type: string }
                  pendingEditId: { type: integer }
    delete:
      operationId: deleteCharacter
      tags: [characters]
      responses:
        "204": { description: Deleted }
  /characters/{id}/updates:
    parameters:
      - { in: path, name: id, required: true, schema: { type: integer } }
    get:
      operationId: listCharacterUpdates
      tags: [characters]
      summary: Newest-first list of owner-written update notes for this character
      responses:
        "200":
          description: Update notes
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/CharacterUpdateNote" }
  /characters/{id}/deactivate:
    parameters:
      - { in: path, name: id, required: true, schema: { type: integer } }
    post:
      operationId: deactivateCharacter
      tags: [characters]
      summary: Archive a character (cannot be active while archived)
      responses:
        "200":
          description: Archived
          content:
            application/json:
              schema:
                type: object
                required: [success, archived]
                properties:
                  success: { type: boolean }
                  archived: { type: boolean }
        "404": { description: Not found }

  /characters/{id}/reactivate:
    parameters:
      - { in: path, name: id, required: true, schema: { type: integer } }
    post:
      operationId: reactivateCharacter
      tags: [characters]
      summary: Restore a previously archived character
      responses:
        "200":
          description: Restored
          content:
            application/json:
              schema:
                type: object
                required: [success, archived]
                properties:
                  success: { type: boolean }
                  archived: { type: boolean }
        "404": { description: Not found }

  # ---------------- INVENTORY ----------------
  /characters/{id}/inventory:
    parameters:
      - { in: path, name: id, required: true, schema: { type: integer } }
    get:
      operationId: getCharacterInventory
      tags: [inventory]
      responses:
        "200":
          description: Inventory
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/InventoryItem" }
    post:
      operationId: addInventoryItem
      tags: [inventory]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/InventoryItemInput" }
      responses:
        "201":
          description: Added
          content:
            application/json:
              schema: { $ref: "#/components/schemas/InventoryItem" }
  /characters/{id}/inventory/{itemId}:
    parameters:
      - { in: path, name: id, required: true, schema: { type: integer } }
      - { in: path, name: itemId, required: true, schema: { type: integer } }
    patch:
      operationId: updateInventoryItem
      tags: [inventory]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/InventoryItemUpdate" }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/InventoryItem" }
    delete:
      operationId: removeInventoryItem
      tags: [inventory]
      responses:
        "204": { description: Removed }
  /characters/{id}/inventory/{itemId}/transfer:
    parameters:
      - { in: path, name: id, required: true, schema: { type: integer } }
      - { in: path, name: itemId, required: true, schema: { type: integer } }
    post:
      operationId: transferInventoryItem
      tags: [inventory]
      summary: Give or sell an inventory item to another character
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/InventoryTransferInput" }
      responses:
        "200":
          description: Transferred
          content:
            application/json:
              schema: { $ref: "#/components/schemas/InventoryItem" }
        "400": { description: Bad request }
        "404": { description: Not found }
        "409": { description: Recipient unclaimed or owner missing }
        "502": { description: Wallet provider unavailable }

  # ---------------- WALLET (UnbelievaBoat is source of truth) ----------------
  /inventory-items/{uuid}:
    parameters:
      - { in: path, name: uuid, required: true, schema: { type: string, format: uuid } }
    get:
      operationId: getInventoryItemHistory
      tags: [inventory]
      summary: Per-instance chain of custody (owner or fixer/admin)
      responses:
        "200":
          description: Item plus event timeline
          content:
            application/json:
              schema: { $ref: "#/components/schemas/InventoryItemHistory" }
        "403": { description: Not owner / not staff }
        "404": { description: Unknown uuid }

  /characters/{id}/wallet:
    parameters:
      - { in: path, name: id, required: true, schema: { type: integer } }
    get:
      operationId: getWallet
      tags: [wallet]
      summary: Live balance from UnbelievaBoat
      responses:
        "200":
          description: Wallet
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Wallet" }
  /characters/{id}/wallet/transfer:
    parameters:
      - { in: path, name: id, required: true, schema: { type: integer } }
    post:
      operationId: transferEddies
      tags: [wallet]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TransferInput" }
      responses:
        "200":
          description: Transferred
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Wallet" }
  /characters/{id}/wallet/sink:
    parameters:
      - { in: path, name: id, required: true, schema: { type: integer } }
    post:
      operationId: sinkEddies
      tags: [wallet]
      summary: Pay Night City Bot — burn eddies out of the economy (debit only)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SinkInput" }
      responses:
        "200":
          description: Burned
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Wallet" }
  /characters/{id}/wallet/transactions:
    parameters:
      - { in: path, name: id, required: true, schema: { type: integer } }
    get:
      operationId: getWalletTransactions
      tags: [wallet]
      responses:
        "200":
          description: Transaction history
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/WalletTransaction" }

  # ---------------- STATUS (LOA / Attend / Open Shop) ----------------
  /characters/{id}/status:
    parameters:
      - { in: path, name: id, required: true, schema: { type: integer } }
    get:
      operationId: getCharacterStatus
      tags: [status]
      responses:
        "200":
          description: Status
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CharacterStatus" }
    patch:
      operationId: updateCharacterStatus
      tags: [status]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CharacterStatusUpdate" }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CharacterStatus" }
  /characters/{id}/lifestyle:
    parameters:
      - { in: path, name: id, required: true, schema: { type: integer } }
    put:
      operationId: setCharacterLifestyle
      tags: [characters]
      summary: Set or clear the character's monthly lifestyle tier (owner only)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CharacterLifestyleInput" }
      responses:
        "200":
          description: Updated character
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Character" }
        "404": { description: Not found }

  # ---------------- PUBLIC DIRECTORIES ----------------
  /directory/ripperdocs:
    get:
      operationId: listRipperdocs
      tags: [directory]
      summary: Public list of ripperdoc clinics (no stock)
      responses:
        "200":
          description: List
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/RipperdocPublic" }
  /directory/ripperdocs/{id}:
    parameters:
      - { in: path, name: id, required: true, schema: { type: integer } }
    get:
      operationId: getRipperdocPublic
      tags: [directory]
      responses:
        "200":
          description: Ripperdoc
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RipperdocPublic" }
  /directory/stores:
    get:
      operationId: listStores
      tags: [directory]
      summary: Public list of stores (no stock)
      responses:
        "200":
          description: List
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/StorePublic" }
  /directory/stores/{id}:
    parameters:
      - { in: path, name: id, required: true, schema: { type: integer } }
    get:
      operationId: getStorePublic
      tags: [directory]
      responses:
        "200":
          description: Store
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StorePublic" }

  # ---------------- CATALOGS (read-only public) ----------------
  /catalog/custom:
    get:
      operationId: listCustomCatalogItems
      tags: [catalog]
      description: |
        Fixer/admin only. Lists the one-off CUSTOM (off-catalog) items of a
        given type — custom guns, custom cyberware, or off-map/custom property —
        that were approved via the custom-request flow, joined to the owning
        character. Used to power the staff-only "Custom" tab on each catalog
        page. Players never see this.
      parameters:
        - in: query
          name: type
          required: true
          schema: { type: string, enum: [gun, cyberware, property] }
      responses:
        "200":
          description: Approved custom items of the requested type.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/CustomCatalogItem" }
        "400": { description: Invalid or missing type }
        "403": { description: Forbidden }
  /catalog/guns:
    get:
      operationId: listGuns
      tags: [catalog]
      responses:
        "200":
          description: |
            Gun catalog. Entries with status="draft" are only returned when
            the caller is ADMIN or FIXER; everyone else sees only live (or
            null-status legacy) entries.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/CatalogGun" }
    post:
      operationId: createGun
      tags: [catalog]
      description: |
        Fixer/admin endpoint. Creates a new weapon catalog entry. New entries
        default to status="draft" so they stay staff-only until promoted to
        live. The creation is audit-logged.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CatalogGunInput" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CatalogGun" }
        "400": { description: Invalid payload }
  /catalog/guns/{id}:
    parameters:
      - { in: path, name: id, required: true, schema: { type: integer } }
    patch:
      operationId: updateGun
      tags: [catalog]
      description: |
        Fixer/admin endpoint. Any subset of editable fields may be supplied;
        omitted fields are left unchanged. Every applied edit is audit-logged
        with before/after values.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CatalogGunUpdate" }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CatalogGunUpdateResult" }
        "400": { description: Invalid payload or no changes }
        "404": { description: Gun not found }
    delete:
      operationId: deleteGun
      tags: [catalog]
      description: |
        Fixer/admin endpoint. Permanently removes a weapon catalog entry. This
        only deletes the registry template; weapons already owned by characters
        are separate inventory rows and are not affected. The deletion is
        audit-logged.
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                type: object
                required: [ok]
                properties:
                  ok: { type: boolean }
        "403": { description: Forbidden }
        "404": { description: Gun not found }
  /catalog/custom-guns:
    post:
      operationId: createCustomGun
      tags: [catalog]
      description: |
        Fixer/admin endpoint. Grants a one-off CUSTOM gun directly to a specific
        character: it materializes the inventory item AND records an
        auto-approved custom-request row so the gun appears in the staff-only
        CUSTOM tab. This is the same end result as an admin override of a
        player's custom-gun request, without the vote. Distinct from
        POST /catalog/guns, which adds a purchasable CATALOG template.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CustomGunInput" }
      responses:
        "201":
          description: The granted custom gun, in the CustomCatalogItem shape.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CustomCatalogItem" }
        "400": { description: Invalid payload or archived character }
        "403": { description: Forbidden }
        "404": { description: Character not found }
  /catalog/cyberware:
    get:
      operationId: listCyberware
      tags: [catalog]
      responses:
        "200":
          description: Cyberware catalog
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/CatalogCyberware" }
    post:
      operationId: createCyberware
      tags: [catalog]
      description: |
        Fixer/admin endpoint. Creates a new cyberware catalog entry. The
        creation is audit-logged.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CatalogCyberwareInput" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CatalogCyberware" }
        "400": { description: Invalid payload }
  /catalog/cyberware/{id}:
    parameters:
      - { in: path, name: id, required: true, schema: { type: integer } }
    patch:
      operationId: updateCyberware
      tags: [catalog]
      description: |
        Fixer/admin endpoint. Any subset of editable fields may be supplied;
        omitted fields are left unchanged. Every applied edit is audit-logged
        with before/after values.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CatalogCyberwareUpdate" }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CatalogCyberwareUpdateResult" }
        "400": { description: Invalid payload or no changes }
        "404": { description: Cyberware not found }
    delete:
      operationId: deleteCyberware
      tags: [catalog]
      description: |
        Fixer/admin endpoint. Permanently removes a cyberware catalog entry.
        This only deletes the registry template; cyberware already installed on
        characters are separate inventory rows and are not affected. The
        deletion is audit-logged.
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                type: object
                required: [ok]
                properties:
                  ok: { type: boolean }
        "403": { description: Forbidden }
        "404": { description: Cyberware not found }
  /catalog/rent:
    get:
      operationId: listRentListings
      tags: [catalog]
      responses:
        "200":
          description: Rent and leases
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/CatalogRent" }
    post:
      operationId: createRentListing
      tags: [catalog]
      description: |
        Fixer/admin endpoint. Creates a new property catalog listing. `kind`
        selects residential (player self-lease) or business (request-only);
        defaults to residential. A freshly created listing is never occupied.
        The creation is audit-logged.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CatalogRentInput" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CatalogRent" }
        "400": { description: Invalid payload }
  /catalog/rent/available-business:
    get:
      operationId: listAvailableBusinessBuildings
      tags: [catalog]
      summary: "Business buildings open for an on-map venue (unleased & unreserved)."
      description: |
        Returns the business-kind rent listings that currently have no lease and
        no live on-map venue reservation, for the venue request dialog's
        "On Map" building picker.
      responses:
        "200":
          description: Available business buildings
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/AvailableBusinessBuilding" }
  /catalog/districts:
    get:
      operationId: listDistricts
      tags: [catalog]
      summary: "Fixer-managed district list for the property creator dropdown."
      responses:
        "200":
          description: Districts
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/CatalogDistrict" }
    post:
      operationId: createDistrict
      tags: [catalog]
      summary: "Add a district to the managed list (FIXER/ADMIN). Idempotent by name."
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CatalogDistrictInput" }
      responses:
        "200":
          description: Already existed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CatalogDistrict" }
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CatalogDistrict" }
        "400": { description: Invalid payload }
  /catalog/rent/{id}:
    parameters:
      - { in: path, name: id, required: true, schema: { type: integer } }
    patch:
      operationId: updateRentListing
      tags: [catalog]
      summary: "Edit a housing listing (FIXER/ADMIN); used to attach/clear a single image."
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CatalogRentUpdate" }
      responses:
        "200":
          description: Updated listing
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CatalogRent" }
        "400": { description: Invalid payload or no changes }
        "403": { description: Forbidden }
        "404": { description: Not found }
    delete:
      operationId: deleteRentListing
      tags: [catalog]
      description: |
        Fixer/admin endpoint. Permanently removes a property catalog listing.
        Blocked with 409 while the property is occupied (has an active lease);
        the tenant must be moved out first. The deletion is audit-logged.
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                type: object
                required: [ok]
                properties:
                  ok: { type: boolean }
        "403": { description: Forbidden }
        "404": { description: Not found }
        "409": { description: Property is occupied; vacate the tenant first }
  /catalog/lifestyle:
    get:
      operationId: listLifestyleTiers
      tags: [catalog]
