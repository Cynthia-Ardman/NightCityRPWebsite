          content:
            application/json:
              schema: { $ref: "#/components/schemas/FixerNpc" }
    patch:
      operationId: updateFixerNpc
      tags: [fixer]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/FixerNpcUpdate" }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FixerNpc" }

  # ---------------- CHARACTER SHEETS ----------------
  /sheets:
    get:
      operationId: listMySheets
      tags: [sheets]
      summary: My submitted character sheets
      responses:
        "200":
          description: Sheets
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/CharacterSheet" }
    post:
      operationId: submitSheet
      tags: [sheets]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CharacterSheetInput" }
      responses:
        "201":
          description: Submitted; CS Approvers notified on Discord
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CharacterSheet" }
  /sheets/pending:
    get:
      operationId: listPendingSheets
      tags: [sheets]
      summary: Pending sheets (reviewers only) with per-sheet vote tallies. Filter by lifecycle bucket.
      parameters:
        - in: query
          name: bucket
          required: false
          description: Lifecycle bucket. active = pending/changes_requested; resolved = approved/rejected/cancelled; archive = closed. Defaults to pending only.
          schema: { type: string, enum: [active, resolved, archive] }
      responses:
        "200":
          description: Pending
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/PendingSheetSummary" }
  /sheets/{id}:
    parameters:
      - { in: path, name: id, required: true, schema: { type: integer } }
    get:
      operationId: getSheet
      tags: [sheets]
      responses:
        "200":
          description: Sheet
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CharacterSheet" }
    patch:
      operationId: updateSheet
      tags: [sheets]
      summary: Owner updates a draft or changes_requested sheet
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CharacterSheetPatchInput" }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CharacterSheet" }
    delete:
      operationId: deleteSheet
      tags: [sheets]
      summary: Owner deletes a draft
      responses:
        "204": { description: Deleted }
  /sheets/{id}/submit:
    parameters:
      - { in: path, name: id, required: true, schema: { type: integer } }
    post:
      operationId: submitDraftSheet
      tags: [sheets]
      summary: Promote a draft (or changes_requested) sheet to pending review
      responses:
        "200":
          description: Submitted
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CharacterSheet" }
  /sheets/{id}/vote:
    parameters:
      - { in: path, name: id, required: true, schema: { type: integer } }
    post:
      operationId: voteSheet
      tags: [sheets]
      summary: Cast or change your approve/reject vote on a pending sheet. When the tally reaches majority the sheet is decided (approve materializes the character).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SheetVoteInput" }
      responses:
        "200":
          description: Vote recorded (and possibly decided)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SheetVoteResult" }
        "400": { description: Bad request }
        "403": { description: Reviewers only / cannot vote on own sheet }
        "404": { description: Not found }
        "409": { description: Already decided }
  /sheets/{id}/override:
    parameters:
      - { in: path, name: id, required: true, schema: { type: integer } }
    post:
      operationId: overrideSheet
      tags: [sheets]
      summary: Admin-only immediate decision that bypasses the vote. Approves (and materializes on close) or denies. Records overriddenBy.
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: "#/components/schemas/OverrideDecisionInput" }
      responses:
        "200":
          description: Approved via override
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CharacterSheet" }
        "403": { description: Admin only }
        "404": { description: Not found }
        "409": { description: Already decided }
  /sheets/{id}/request-changes:
    parameters:
      - { in: path, name: id, required: true, schema: { type: integer } }
    post:
      operationId: requestChangesSheet
      tags: [sheets]
      deprecated: true
      summary: "RETIRED. Reviewers no longer block sheets in changes_requested; use the /review comment thread instead. Always returns 410."
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RequestChangesInput" }
      responses:
        "410": { description: Retired. Use the /review comment thread; it never blocks approval. }
        "409": { description: Already decided }

  # ---------------- PENDING CHARACTER EDITS ----------------
  /pending-edits:
    get:
      operationId: listPendingEdits
      tags: [pending-edits]
      summary: List pending character edits (staff see all; players see only their own). Reviewers can filter by lifecycle bucket.
      parameters:
        - in: query
          name: bucket
          required: false
          description: Lifecycle bucket (reviewers only). active = pending/changes_requested; resolved = approved/rejected/cancelled; archive = closed. Defaults to open edits plus anything decided in the last 7 days.
          schema: { type: string, enum: [active, resolved, archive] }
      responses:
        "200":
          description: Pending edits
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/PendingEditSummary" }
  /pending-edits/{id}:
    parameters:
      - { in: path, name: id, required: true, schema: { type: integer } }
    get:
      operationId: getPendingEdit
      tags: [pending-edits]
      summary: Full detail (diff + before/after + tally) for one pending edit
      responses:
        "200":
          description: Pending edit detail
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PendingEditDetail" }
        "404": { description: Not found }
  /pending-edits/{id}/vote:
    parameters:
      - { in: path, name: id, required: true, schema: { type: integer } }
    post:
      operationId: votePendingEdit
      tags: [pending-edits]
      summary: Cast or change your approve/reject vote on a pending edit
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PendingEditVoteInput" }
      responses:
        "200":
          description: Vote recorded
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PendingEditVoteResult" }
  /pending-edits/{id}/override:
    parameters:
      - { in: path, name: id, required: true, schema: { type: integer } }
    post:
      operationId: overridePendingEdit
      tags: [pending-edits]
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: "#/components/schemas/OverrideDecisionInput" }
      summary: Admin-only immediate approval that bypasses the vote and applies the edit. Records overriddenBy.
      responses:
        "200":
          description: Approved via override
          content:
            application/json:
              schema:
                type: object
                required: [ok, status]
                properties:
                  ok: { type: boolean }
                  status: { type: string }
        "403": { description: Admin only }
        "404": { description: Not found }
        "409": { description: Already decided }
  /pending-edits/{id}/request-changes:
    parameters:
      - { in: path, name: id, required: true, schema: { type: integer } }
    post:
      operationId: requestChangesPendingEdit
      tags: [pending-edits]
      deprecated: true
      summary: "RETIRED. Reviewers no longer block edits in changes_requested; use the /review comment thread instead. Always returns 410."
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RequestChangesInput" }
      responses:
        "410": { description: Retired. Use the /review comment thread; it never blocks approval. }
  /pending-edits/{id}/resubmit:
    parameters:
      - { in: path, name: id, required: true, schema: { type: integer } }
    post:
      operationId: resubmitPendingEdit
      tags: [pending-edits]
      summary: The submitter sends a changes_requested edit back to the review queue. Clears prior votes. Allowed with no edits.
      responses:
        "200":
          description: Resubmitted
          content:
            application/json:
              schema:
                type: object
                required: [ok, status]
                properties:
                  ok: { type: boolean }
                  status: { type: string }
        "403": { description: Only the submitter can resubmit }
        "404": { description: Not found }
        "409": { description: Not awaiting changes }
  /pending-edits/{id}/cancel:
    parameters:
      - { in: path, name: id, required: true, schema: { type: integer } }
    post:
      operationId: cancelPendingEdit
      tags: [pending-edits]
      summary: Submitter (or admin) withdraws a pending edit
      responses:
        "200":
          description: Cancelled
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  status: { type: string }
  /characters/{id}/pending-edit:
    parameters:
      - { in: path, name: id, required: true, schema: { type: integer } }
    get:
      operationId: getCharacterPendingEdit
      tags: [pending-edits]
      summary: Convenience lookup — does this character have a pending edit?
      responses:
        "200":
          description: Pending edit exists
          content:
            application/json:
              schema:
                type: object
                required: [id, submittedAt, submittedBy]
                properties:
                  id: { type: integer }
                  submittedAt: { type: string, format: date-time }
                  submittedBy: { type: string }
        "204": { description: No pending edit }

  # ---------------- DICE ----------------
  /dice/roll:
