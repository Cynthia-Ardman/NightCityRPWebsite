        "400": { description: Bad request or buyer has insufficient funds }
        "404": { description: Not found }
        "409": { description: "Out of stock, buyer unclaimed, or economy disabled" }
        "502": { description: Wallet provider unavailable }
  /ripperdocs/{id}/install:
    parameters:
      - { in: path, name: id, required: true, schema: { type: integer } }
    post:
      operationId: installRipperdocCyberware
      tags: [ripperdocs]
      summary: Install stock cyberware onto a character instantly (CWP-validated; charges the buyer + installs now)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CyberwareInstallInput" }
      responses:
        "200":
          description: Install completed (or dry-run preview in Test mode)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApproveOfferResult" }
        "400": { description: Bad request or buyer has insufficient funds }
        "403": { description: Not authorized }
        "404": { description: Not found }
        "409": { description: "Out of stock, buyer unclaimed, CWP capacity exceeded, or economy disabled" }
        "502": { description: Wallet provider unavailable }
