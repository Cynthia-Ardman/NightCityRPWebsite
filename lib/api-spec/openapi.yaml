      required: [id, type, title, status, characterId]
      properties:
        id: { type: integer }
        type: { type: string, enum: [gun, cyberware, property] }
        title: { type: string }
        description: { type: ["string", "null"] }
        imageUrl: { type: ["string", "null"] }
        details: {}
        status: { type: string }
        appliedRef: { type: ["string", "null"] }
        characterId: { type: integer }
        characterName: { type: ["string", "null"] }
        ownerId: { type: ["string", "null"] }
        createdAt: { type: string, format: date-time }
    CatalogGun:
      type: object
      required: [id, name, price]
      properties:
        id: { type: integer }
        name: { type: string }
        category: { type: ["string", "null"] }
        manufacturer: { type: ["string", "null"] }
        damage: { type: ["string", "null"] }
        magSize: { type: ["integer", "null"] }
        price: { type: integer }
        notes: { type: ["string", "null"] }
        wholesalePrice: { type: ["integer", "null"] }
        restriction: { type: ["string", "null"] }
        status: { type: ["string", "null"] }
        powerLevel: { type: ["string", "null"] }
        weaponType: { type: ["string", "null"] }
        fireMode: { type: ["string", "null"] }
        imageUrl: { type: ["string", "null"] }
        cyberwareReq: { type: ["string", "null"], description: "Cyberware required to operate this weapon." }
        wikiUrl: { type: ["string", "null"], description: "Link to the Cyberpunk wiki page." }
        prefabThreadUrl: { type: ["string", "null"], description: "Link to the Discord prefab thread." }
    CatalogGunUpdate:
      type: object
      description: |
        Fixer/admin patch. Any subset of these fields may be supplied; omitted
        fields are left unchanged.
      properties:
        name: { type: string }
        category: { type: ["string", "null"] }
        manufacturer: { type: ["string", "null"] }
        damage: { type: ["string", "null"] }
        magSize: { type: ["integer", "null"] }
        price: { type: integer }
        wholesalePrice: { type: ["integer", "null"] }
        restriction: { type: ["string", "null"] }
        powerLevel: { type: ["string", "null"] }
        weaponType: { type: ["string", "null"] }
        fireMode: { type: ["string", "null"] }
        notes: { type: ["string", "null"] }
        imageUrl: { type: ["string", "null"] }
        cyberwareReq: { type: ["string", "null"], description: "Cyberware required to operate this weapon." }
        wikiUrl: { type: ["string", "null"], description: "Link to the Cyberpunk wiki page." }
        prefabThreadUrl: { type: ["string", "null"], description: "Link to the Discord prefab thread." }
        status:
          type: ["string", "null"]
          enum: [draft, live, retired, null]
          description: "Visibility status; only ADMIN/FIXER may set."
    CatalogGunUpdateResult:
      type: object
      description: |
        The updated weapon plus the list of fields that actually changed in
        this edit (used for audit/UX context).
      required: [id, name, price, changed]
      allOf:
        - $ref: "#/components/schemas/CatalogGun"
        - type: object
          required: [changed]
          properties:
            changed:
              type: array
              items: { type: string }
    CatalogGunInput:
      type: object
      required: [name]
      properties:
        name: { type: string }
        category: { type: ["string", "null"] }
        manufacturer: { type: ["string", "null"] }
        damage: { type: ["string", "null"] }
        magSize: { type: ["integer", "null"] }
        price: { type: integer, default: 0 }
        wholesalePrice: { type: ["integer", "null"] }
        restriction: { type: ["string", "null"] }
        powerLevel: { type: ["string", "null"] }
        weaponType: { type: ["string", "null"] }
        fireMode: { type: ["string", "null"] }
        notes: { type: ["string", "null"] }
        imageUrl: { type: ["string", "null"] }
        cyberwareReq: { type: ["string", "null"], description: "Cyberware required to operate this weapon." }
        wikiUrl: { type: ["string", "null"], description: "Link to the Cyberpunk wiki page." }
        prefabThreadUrl: { type: ["string", "null"], description: "Link to the Discord prefab thread." }
        status:
          type: ["string", "null"]
          enum: [draft, live, retired, null]
          default: draft
          description: "Visibility status; defaults to draft."

    CatalogCyberware:
      type: object
      required: [id, name, price, slot]
      properties:
        id: { type: integer }
        name: { type: string }
        slot: { type: string }
        price: { type: integer }
        installCost: { type: ["integer", "null"] }
        description: { type: ["string", "null"] }
        cwp: { type: ["string", "null"] }
        wholesalePrice: { type: ["integer", "null"] }

    CatalogCyberwareUpdate:
      type: object
      description: |
        Fixer/admin patch. Any subset of these fields may be supplied; omitted
        fields are left unchanged.
      properties:
        name: { type: string }
        slot: { type: string }
        cwp: { type: ["string", "null"] }
        price: { type: integer }
        wholesalePrice: { type: ["integer", "null"] }
        installCost: { type: ["integer", "null"] }
        description: { type: ["string", "null"] }
    CatalogCyberwareUpdateResult:
      type: object
      description: |
        The updated cyberware plus the list of fields that actually changed in
        this edit (used for audit/UX context).
      required: [id, name, price, slot, changed]
      allOf:
        - $ref: "#/components/schemas/CatalogCyberware"
        - type: object
          required: [changed]
          properties:
            changed:
              type: array
              items: { type: string }

    CatalogCyberwareInput:
      type: object
      required: [name, slot]
      properties:
        name: { type: string }
        slot: { type: string }
        cwp: { type: ["string", "null"] }
        price: { type: integer, default: 0 }
        wholesalePrice: { type: ["integer", "null"] }
        installCost: { type: ["integer", "null"] }
        description: { type: ["string", "null"] }

    CatalogDistrict:
      type: object
      required: [id, name]
      properties:
        id: { type: integer }
        name: { type: string }
    CatalogDistrictInput:
      type: object
      required: [name]
      properties:
        name: { type: string, minLength: 1, maxLength: 64 }

    CatalogRent:
      type: object
      required: [id, name, monthlyRent, occupied]
      properties:
        id: { type: integer }
        name: { type: string }
        district: { type: ["string", "null"] }
        tier: { type: ["string", "null"] }
        monthlyRent: { type: integer }
        description: { type: ["string", "null"] }
        imageUrl: { type: ["string", "null"] }
        kind:
          type: string
          enum: [residential, business]
          description: "residential (player self-lease) or business (request-only). Defaults to residential."
        leasable:
          type: boolean
          description: False for catalog-visible listings that can never be leased or requested (e.g. Claw-owned properties).
        occupied:
          type: boolean
          description: True when an active lease already references this listing.
        occupantCharacterId:
          type: integer
          description: Staff-only — the character currently occupying this listing.
        occupantCharacterName:
          type: string
          description: Staff-only — name of the occupying character.
        housingId:
          type: integer
          description: Staff-only — the housing (lease) row id, used to remove the occupant.

    CatalogRentUpdate:
      type: object
      description: |
        Fixer/admin patch for a housing listing. Any subset may be supplied;
        omitted fields are left unchanged. Mainly used to attach/clear a single
        listing image.
      properties:
        name: { type: string }
        district: { type: ["string", "null"] }
        tier: { type: ["string", "null"] }
        monthlyRent: { type: integer }
        description: { type: ["string", "null"] }
        imageUrl: { type: ["string", "null"] }
        leasable: { type: boolean }

    CatalogRentInput:
      type: object
      required: [name]
      properties:
        name: { type: string }
        district: { type: ["string", "null"] }
        tier: { type: ["string", "null"] }
        monthlyRent: { type: integer, default: 0 }
        description: { type: ["string", "null"] }
        imageUrl: { type: ["string", "null"] }
        kind:
          type: string
          enum: [residential, business]
          default: residential
          description: "residential (player self-lease) or business (request-only)."
        leasable:
          type: boolean
          default: true
          description: False marks the listing as catalog-visible but never leaseable.

    AvailableBusinessBuilding:
      type: object
      required: [id, name, monthlyRent]
      description: |
        A business building currently open for an on-map venue (no active lease,
        no live reservation). Used to populate the venue request "On Map" picker.
      properties:
        id: { type: integer }
        name: { type: string }
        district: { type: ["string", "null"] }
        tier: { type: ["string", "null"] }
        monthlyRent: { type: integer }

    TagOption:
      type: object
      required: [id, name]
      properties:
        id: { type: integer }
        name: { type: string }

    TagOptionInput:
      type: object
      required: [name]
      properties:
        name: { type: string }

    HousingLease:
      type: object
      required: [id, characterId, characterName, address, monthlyRent, createdAt]
      properties:
        id: { type: integer }
        characterId: { type: integer }
        characterName: { type: string }
        listingId: { type: ["integer", "null"] }
        address: { type: string }
        district: { type: ["string", "null"] }
        tier: { type: ["string", "null"] }
        monthlyRent: { type: integer }
        paidThrough: { type: ["string", "null"], format: date-time }
        notes: { type: ["string", "null"] }
        kind:
          type: string
          enum: [residential, business]
          description: "Residential leases pause rent on LOA; business leases keep billing."
        delinquent: { type: boolean, description: "True when paidThrough is in the past — informational only." }
        delinquentSince:
          type: ["string", "null"]
          format: date-time
          description: "First failed-rent timestamp. Null = current. Starts the eviction grace clock."
        daysUntilEviction:
          type: ["integer", "null"]
          description: "Days remaining in the grace window. 0 = will be evicted on the next eviction_sweep run. Null = not delinquent."
        createdAt: { type: string, format: date-time }

    OffMapProperty:
      type: object
      required: [id, characterId, characterName, address, monthlyRent, kind, createdAt]
      properties:
        id: { type: integer }
        characterId: { type: integer }
        characterName: { type: string }
        ownerName: { type: ["string", "null"], description: "Discord username of the owning player, or null if the character is unclaimed." }
        address: { type: string }
        district: { type: ["string", "null"] }
        tier: { type: ["string", "null"] }
        monthlyRent: { type: integer }
        kind:
          type: string
          enum: [residential, business]
          description: "residential = Off-Map Housing; business = property attached to an Off-Map Business venue."
        paidThrough: { type: ["string", "null"], format: date-time }
        delinquent: { type: boolean }
        notes: { type: ["string", "null"] }
        venueName: { type: ["string", "null"], description: "Name of the store/ripperdoc this business lease backs, or null for residential / unlinked leases." }
        createdAt: { type: string, format: date-time }

    HousingReviewerNote:
      type: object
      properties:
        reviewerNote: { type: string }

    HousingRequest:
      type: object
      required: [id, characterId, characterName, listingId, listingName, monthlyRent, requestedById, kind, status, createdAt]
      properties:
        id: { type: integer }
        characterId: { type: integer }
        characterName: { type: string }
        listingId: { type: integer }
        listingName: { type: string }
        district: { type: ["string", "null"] }
        tier: { type: ["string", "null"] }
        monthlyRent: { type: integer }
        requestedById: { type: string }
        requestedByName: { type: ["string", "null"] }
        kind: { type: string, enum: [residential, business] }
        notes: { type: ["string", "null"] }
        status: { type: string, enum: [pending, approved, rejected] }
        reviewedById: { type: ["string", "null"] }
        reviewedAt: { type: ["string", "null"], format: date-time }
        reviewerNote: { type: ["string", "null"] }
        createdAt: { type: string, format: date-time }

    CustomRequest:
      type: object
      required: [id, type, characterId, characterName, requestedById, title, status, createdAt]
      properties:
        id: { type: integer }
        type: { type: string, enum: [property, gun, cyberware, item, store, ripperdoc, stock_cost, employee_invite, venue_stock, mission_participation] }
        characterId: { type: integer }
        characterName: { type: string }
        requestedById: { type: string }
        requestedByName: { type: ["string", "null"] }
        title: { type: string, description: "Player label: location/address (property), item name (gun/cyberware), or venue name (store/ripperdoc)." }
        description: { type: ["string", "null"] }
        imageUrl: { type: ["string", "null"], description: "Legacy single reference image — always the first entry of imageUrls." }
        imageUrls:
          type: array
          items: { type: string }
          description: "All reference images the player attached (ordered). Legacy rows with only imageUrl are surfaced as a one-element array."
        details: { description: "Optional type-specific payload captured at submit time. For store/ripperdoc carries { purpose, location }.", nullable: true }
        status: { type: string, enum: [draft, pending, approved, rejected, changes_requested, cancelled, closed] }
        reviewedById: { type: ["string", "null"] }
        reviewedAt: { type: ["string", "null"], format: date-time }
        reviewerNote: { type: ["string", "null"], description: "On changes_requested this carries the reviewer's comment to the player." }
        appliedRef: { type: ["string", "null"], description: "What was materialized on approval (housing:<id> / inventory:<uuid>)." }
        overriddenBy: { type: ["string", "null"], description: "Admin user id if approved via override." }
        approveCount: { type: integer, description: "Review tally — present on list responses." }
        rejectCount: { type: integer }
        pauseCount: { type: integer, description: "Pause markers — visible flag only, never counted toward the decision threshold." }
        threshold: { type: integer, description: "Majority needed among eligible reviewers (excludes the requester)." }
        myVote: { type: ["string", "null"], enum: [approve, reject, pause, null], description: "The viewer's own vote, if any." }
        eligibleReviewers:
          type: array
          description: "Full roster of reviewers eligible to vote on this request (excludes the requester). Present on list responses."
          items: { $ref: "#/components/schemas/EligibleReviewer" }
        voters:
          type: array
          description: "Reviewers who have already cast a vote on this request. Present on list responses."
          items:
            type: object
            required: [id, vote]
            properties:
              id: { type: string }
              name: { type: ["string", "null"] }
              avatarUrl: { type: ["string", "null"] }
              vote: { type: string, enum: [approve, reject, pause] }
        createdAt: { type: string, format: date-time }
        lastActivityAt: { type: string, format: date-time }

    CustomRequestVoteInput:
      type: object
      required: [vote]
      properties:
        vote: { type: string, enum: [approve, reject, pause], description: "Pause is a visible marker only — it never counts toward the decision threshold." }
        note: { type: string, maxLength: 2000 }
        monthlyRent: { type: integer, minimum: 0, description: "Required on an approve vote for property requests." }
        kind: { type: string, enum: [residential, business], description: "For property approve votes; defaults residential." }
        businessName: { type: string, description: "Optional for property approve votes: sets/replaces the leased business/property name." }
        cwp: { type: number, minimum: 0, description: "Required on an approve vote for cyberware requests." }
        unitCost: { type: integer, minimum: 0, description: "Required on an approve vote for venue_stock requests: per-unit cost billed to the venue on owner approval." }
        retail: { type: integer, minimum: 0, description: "Required on an approve vote for venue_stock requests: shelf price for the new stock." }
        qty: { type: integer, minimum: 1, description: "Required on an approve vote for venue_stock requests: number of units to stock." }

    CustomRequestVoteResult:
      allOf:
        - $ref: "#/components/schemas/CustomRequest"
        - type: object
          properties:
            decided: { type: ["string", "null"], enum: [approved, rejected, null] }

    CustomRequestPatchInput:
      type: object
      properties:
        title: { type: string }
        description: { type: string }
        imageUrl: { type: string, description: "Legacy single-image patch; ignored when imageUrls is present." }
        imageUrls:
          type: array
          items: { type: string }
          description: "Replaces the full reference-image set (max 8). Empty array clears all images."
        purpose: { type: string, description: "Venue requests only." }
        location: { type: string, description: "Venue requests only." }

    RequestChangesInput:
      type: object
      required: [comment]
      properties:
        comment: { type: string, minLength: 1, maxLength: 2000 }

    CustomRequestInput:
      type: object
      required: [type, characterId, title]
      properties:
        type: { type: string, enum: [property, gun, cyberware, item, store, ripperdoc] }
        characterId: { type: integer }
        title: { type: string }
        description: { type: string, description: "Required for store/ripperdoc requests." }
        imageUrl: { type: string, description: "Legacy single reference image object path; ignored when imageUrls is present." }
        imageUrls:
          type: array
          items: { type: string }
          description: "Optional reference images (object paths, ordered, max 8)."
        purpose: { type: string, description: "Required for store/ripperdoc requests; what the venue is for." }
        location: { type: string, description: "Required for off-map store/ripperdoc requests; free-text in-world location." }
        locationKind:
          type: string
          enum: [off_map, on_map]
          description: "Store/ripperdoc requests: off_map uses free-text location; on_map reserves a business building (listingId). Defaults to off_map."
        listingId: { type: integer, description: "Required for on_map store/ripperdoc requests; the business catalog_rent building to reserve." }
        storeKind:
          type: string
          enum: [guns, mixed]
          description: "Store requests only (Off-Map Business type picker): 'guns' tags the venue as a Gun Store (surfaces under the Guns badge), 'mixed' is a general store. Defaults to mixed. Ignored for ripperdoc requests."
        attachProperty: { type: boolean, description: "Off-map store/ripperdoc requests only: when true the fixer mints an off-map business lease (rent/district/tier set at CLOSE & APPLY) linked to the new venue. On-map venues always lease their reserved building, so this is ignored there." }
        source: { type: string, description: "For gun/cyberware requests: which store/ripperdoc the player wants it from, or a free-text 'Custom' source. Stored on details.source." }
        asDraft: { type: boolean, description: "When true the request is saved as a private draft (status=draft): not announced to reviewers and holding no building reservation until submitted via /requests/{id}/submit." }

    OverrideDecisionInput:
      type: object
      properties:
        decision: { type: string, enum: [approve, deny], description: "Override outcome. Defaults to approve; deny rejects the ticket (no effect applied on close)." }

    CustomRequestApproval:
      type: object
      properties:
        decision: { type: string, enum: [approve, deny], description: "Override outcome. Defaults to approve; deny rejects the ticket and ignores the mechanical params below." }
        reviewerNote: { type: string }
        monthlyRent: { type: integer, minimum: 0, description: "Required for property requests." }
        kind: { type: string, enum: [residential, business], description: "For property requests; defaults residential." }
        businessName: { type: string, description: "Optional for property requests: sets/replaces the leased business/property name." }
        cwp: { type: number, minimum: 0, description: "Required for cyberware requests; sets chrome point cost." }
        unitCost: { type: integer, minimum: 0, description: "For venue_stock requests: per-unit cost billed to the venue on owner approval." }
        retail: { type: integer, minimum: 0, description: "For venue_stock requests: shelf price for the new stock." }
        qty: { type: integer, minimum: 1, description: "For venue_stock requests: number of units to stock." }

    CustomRequestRejection:
      type: object
      properties:
        reviewerNote: { type: string }

    StockCostDecision:
      type: object
      required: [decision]
      properties:
        decision: { type: string, enum: [approve, reject] }
        reviewerNote: { type: string }

    EmployeeInviteResult:
      type: object
      required: [pendingApproval, requestId]
      properties:
        pendingApproval: { type: boolean, description: "Always true — adding an employee now creates a pending invitation the invited character's player must accept." }
        requestId: { type: integer, description: "Id of the created employee_invite custom request." }

    EmployeeDecisionInput:
      type: object
      required: [decision]
      properties:
        decision: { type: string, enum: [accept, deny] }

    VenueStockRequestInput:
      type: object
      required: [name]
      properties:
        name: { type: string, minLength: 1, description: "Item name to stock." }
        category: { type: string, description: "Optional stock category." }
        description: { type: string, description: "Optional notes for the fixers reviewing the request." }
        source: { type: string, description: "Optional free-text source/notes carried on details.source." }

    HousingLeaseInput:
      type: object
      required: [catalogRentId, characterId]
      properties:
        catalogRentId: { type: integer }
        characterId: { type: integer }
        notes: { type: string }
        kind:
          type: string
          enum: [residential, business]

    HousingLeaseUpdate:
      type: object
      properties:
        kind:
          type: string
          enum: [residential, business]
        notes: { type: ["string", "null"] }
        monthlyRent: { type: integer, minimum: 0 }

    ListingHistory:
      type: object
      required: [listing, currentTenant, payments, timeline]
      properties:
        listing:
          type: object
          required: [id, name, monthlyRent]
          properties:
            id: { type: integer }
            name: { type: string }
            district: { type: ["string", "null"] }
            tier: { type: ["string", "null"] }
            monthlyRent: { type: integer }
            kind: { type: ["string", "null"], enum: [residential, business, null] }
        currentTenant:
          oneOf:
            - type: object
              required: [housingId, characterId, characterName, monthlyRent, kind, since]
              properties:
                housingId: { type: integer }
                characterId: { type: integer }
                characterName: { type: string }
                ownerId: { type: ["string", "null"] }
                ownerName: { type: ["string", "null"] }
                monthlyRent: { type: integer }
                kind: { type: string, enum: [residential, business] }
                paidThrough: { type: ["string", "null"], format: date-time }
                delinquentSince: { type: ["string", "null"], format: date-time }
                since: { type: string, format: date-time }
            - type: "null"
        payments:
          type: array
          items:
            type: object
            required: [id, amount, kind, date]
            properties:
              id: { type: integer }
              amount: { type: integer }
              kind: { type: string }
              memo: { type: ["string", "null"] }
              characterId: { type: ["integer", "null"] }
              characterName: { type: ["string", "null"] }
              date: { type: string, format: date-time }
        timeline:
          type: array
          items:
            type: object
            required: [id, kind, message, date]
            properties:
              id: { type: integer }
              kind: { type: string }
              message: { type: string }
              actorName: { type: ["string", "null"] }
              date: { type: string, format: date-time }

    FixerNpc:
      type: object
      required: [id, name, fixerId, fixerName, createdAt]
      properties:
        id: { type: integer }
        name: { type: string }
        archetype: { type: ["string", "null"] }
        district: { type: ["string", "null"] }
        description: { type: ["string", "null"] }
        portraitUrl: { type: ["string", "null"] }
        contact: { type: ["string", "null"] }
        fixerId: { type: string }
        fixerName: { type: string }
        createdAt: { type: string, format: date-time }

    FixerNpcInput:
      type: object
      required: [name]
      properties:
        name: { type: string, minLength: 1 }
        archetype: { type: string }
        district: { type: string }
        description: { type: string }
        portraitUrl: { type: string }
        contact: { type: string }

    FixerNpcUpdate:
      type: object
      properties:
        name: { type: string, minLength: 1 }
        archetype: { type: string }
        district: { type: string }
        description: { type: string }
        portraitUrl: { type: string }
        contact: { type: string }

    CharacterSheet:
      type: object
      required: [id, ownerId, name, status, createdAt, data]
      properties:
        id: { type: integer }
        ownerId: { type: string }
        ownerName: { type: string }
        characterId: { type: ["integer", "null"] }
        name: { type: string }
        status: { type: string, enum: [draft, pending, approved, rejected, changes_requested] }
        discordMessageId: { type: ["string", "null"] }
        decisionBy: { type: ["string", "null"] }
        decisionNote: { type: ["string", "null"], description: "On changes_requested this carries the reviewer's comment." }
        decidedAt: { type: ["string", "null"], format: date-time }
        overriddenBy: { type: ["string", "null"], description: "Admin user id if approved via override." }
        ownerAvatarUrl: { type: ["string", "null"] }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time, description: "Revision stamp bumped on every save. Send it back as baseUpdatedAt on PATCH to detect stale edits." }
        submittedAt: { type: ["string", "null"], format: date-time, description: "When the sheet was submitted for review. Effective value: explicit submit timestamp, else the Discord announce time, else createdAt. Null only on a never-submitted draft." }
        data: { $ref: "#/components/schemas/CharacterSheetData" }
        # Review fields — present on GET /sheets/{id} only.
        votes:
          type: array
          items: { $ref: "#/components/schemas/ReviewVoteRecord" }
        eligibleReviewers:
          type: array
          description: "Full roster of reviewers eligible to vote (excludes the submitter). Present on GET /sheets/{id} only."
          items: { $ref: "#/components/schemas/EligibleReviewer" }
        eligibleVoterCount: { type: integer }
        threshold: { type: integer }
        approveCount: { type: integer }
        rejectCount: { type: integer }
        pauseCount: { type: integer, description: "Pause markers — visible flag only, never counted toward the decision threshold." }
        myVote: { $ref: "#/components/schemas/ReviewerSelfVote" }
        canVote: { type: boolean }
        canRequestChanges: { type: boolean }
        canOverride: { type: boolean }
        canResubmit: { type: boolean }

    EligibleReviewer:
      type: object
      description: "A reviewer permitted to vote on a subject (excludes the submitter). Used to render who has not voted yet."
      required: [id, isTrialFixer]
      properties:
        id: { type: string }
        name: { type: ["string", "null"] }
        avatarUrl: { type: ["string", "null"] }
        isTrialFixer: { type: boolean, description: "Display-only: true when this reviewer is a trial fixer (still on probation)." }

    ReviewVoteRecord:
      type: object
      required: [id, voterId, vote, votedAt]
      properties:
        id: { type: integer }
        voterId: { type: string }
        voterName: { type: ["string", "null"] }
        voterAvatarUrl: { type: ["string", "null"] }
        vote: { type: string, enum: [approve, reject, pause] }
        note: { type: ["string", "null"] }
        votedAt: { type: string, format: date-time }

    ReviewerSelfVote:
      oneOf:
        - type: "null"
        - type: object
          required: [vote]
          properties:
            vote: { type: string, enum: [approve, reject, pause] }
            note: { type: ["string", "null"] }
            votedAt: { type: string, format: date-time }

    PendingSheetSummary:
      type: object
      required: [id, name, status, createdAt, submittedAt, ownerId, approveCount, rejectCount, threshold]
      properties:
        id: { type: integer }
        name: { type: string }
        status: { type: string, enum: [draft, pending, approved, rejected, changes_requested] }
        createdAt: { type: string, format: date-time }
        submittedAt: { type: string, format: date-time, description: "When the sheet was submitted for review (effective value with fallbacks to the Discord announce time then createdAt)." }
        lastActivityAt: { type: string, format: date-time }
        ownerId: { type: string }
        ownerName: { type: ["string", "null"] }
        ownerAvatarUrl: { type: ["string", "null"] }
        approveCount: { type: integer }
        rejectCount: { type: integer }
        pauseCount: { type: integer, description: "Pause markers — visible flag only, never counted toward the decision threshold." }
        threshold: { type: integer }
        myVote: { $ref: "#/components/schemas/ReviewerSelfVote" }
        eligibleReviewers:
          type: array
          description: "Full roster of reviewers eligible to vote on this sheet (excludes the owner). Present on the reviewer-facing pending list."
          items: { $ref: "#/components/schemas/EligibleReviewer" }
        voters:
          type: array
          description: "Reviewers who have already cast a vote on this sheet. Present on the reviewer-facing pending list."
          items:
            type: object
            required: [id, vote]
            properties:
              id: { type: string }
              name: { type: ["string", "null"] }
              avatarUrl: { type: ["string", "null"] }
              vote: { type: string, enum: [approve, reject, pause] }

    SheetVoteInput:
      type: object
      required: [vote]
      properties:
        vote: { type: string, enum: [approve, reject, pause], description: "Pause is a visible marker only — it never counts toward the decision threshold." }
        note: { type: string, maxLength: 2000 }

    SheetVoteResult:
      type: object
      required: [status, approveCount, rejectCount, threshold]
      properties:
        status: { type: string, enum: [pending, approved, rejected, changes_requested] }
        decided: { type: ["string", "null"], enum: [approved, rejected, null] }
        approveCount: { type: integer }
        rejectCount: { type: integer }
        pauseCount: { type: integer }
        threshold: { type: integer }

    CharacterSheetData:
      type: object
      required: [sheetType, fullName, pronouns, occupation, age, psychProfile, physicalDescription, background, skills, gear]
      description: |
        NCRP character sheet payload. `skills` and `gear` are free-text/narrative
        (no numeric values). `cyberware` is an optional list — organic characters
        may have none. Each cyberware entry's `points` carries the CWP cost
        (derived from the cyberware catalog), and the total CWP across all
        cyberware is capped at 6 at character creation. The legacy
        `attributes`, `cyberwareBySlot`, `cyberwareMisc` and `startingEddies`
        fields are deprecated and only retained for reading older records.
      properties:
        sheetType:
          type: string
          enum: [PC, NPC]
        fullName: { type: string }
        nickname: { type: ["string", "null"] }
        pronouns: { type: ["string", "null"] }
        occupation: { type: ["string", "null"] }
        archetype: { type: string }
        age: { type: integer }
        gender: { type: string }
        physicalDescription: { type: ["string", "null"] }
        appearance: { type: string }
        psychProfile: { type: ["string", "null"] }
        background: { type: string }
        hooks:
          type: ["string", "null"]
          description: Optional free-text story hooks — plot threads, rumors, and connections other characters can engage with.
        attributes:
          type: object
          deprecated: true
          additionalProperties: { type: integer }
        skills:
          type: string
          description: Free-text narrative description of what the character is good at.
        cyberware:
          type: array
          description: |
            Optional list of installed cyberware. Each entry's `points` is the CWP
            cost auto-derived from the catalog. Empty for organic characters.
          items: { $ref: "#/components/schemas/CharacterSheetCyberwareEntry" }
        cyberwareBySlot:
          type: array
          deprecated: true
          description: Deprecated. Legacy fixed-slot foundational chrome layout.
          items: { $ref: "#/components/schemas/CharacterSheetCyberwareEntry" }
        cyberwareMisc:
          type: array
          deprecated: true
          description: Deprecated. Legacy unlimited misc chrome list.
          items: { $ref: "#/components/schemas/CharacterSheetCyberwareEntry" }
        cyberwarePointsSpent: { type: integer, maximum: 6 }
        gear:
          type: array
          items: { type: string }
        startingEddies:
          type: integer
          deprecated: true
        notes: { type: ["string", "null"] }

    CharacterSheetCyberwareEntry:
      type: object
      required: [slot, name, points]
      properties:
        slot: { type: string }
        name: { type: string }
        points: { type: integer }
        notes: { type: ["string", "null"] }

    CharacterSheetInput:
      type: object
      required: [name, data]
      properties:
        name: { type: string, minLength: 1, maxLength: 64 }
        characterId: { type: ["integer", "null"] }
        status: { type: string, enum: [draft, pending], description: "draft skips validation and Discord; defaults to pending" }
        data: { $ref: "#/components/schemas/CharacterSheetData" }

    CharacterSheetPatchInput:
      type: object
      properties:
        name: { type: string, minLength: 1, maxLength: 64 }
        characterId: { type: ["integer", "null"] }
        data: { $ref: "#/components/schemas/CharacterSheetData" }
        baseUpdatedAt: { type: string, format: date-time, description: "Optimistic-concurrency token: the updatedAt the client loaded the sheet with. If the sheet has been saved since, the PATCH is rejected with 409 error=stale_draft instead of overwriting the newer content." }

    CharacterEditSubmission:
      type: object
      required: [pendingEditId, characterId, status, submittedAt, message]
      properties:
        pendingEditId: { type: integer }
        characterId: { type: integer }
        status: { type: string, enum: [pending] }
        submittedAt: { type: string, format: date-time }
        message: { type: string }

    CharacterEditAutoApplied:
      type: object
      required: [autoApplied, characterId, status, character, message]
      properties:
        autoApplied: { type: boolean, enum: [true] }
        characterId: { type: integer }
        status: { type: string, enum: [applied] }
        character: { $ref: "#/components/schemas/Character" }
        message: { type: string }

    IncomeCommandState:
      type: object
      required: [available, cooldownEndsAt]
      properties:
        available: { type: boolean }
        cooldownEndsAt: { type: string, format: date-time, nullable: true }

    IncomeStatus:
      type: object
      required: [balance, work, slut]
      properties:
        balance: { type: integer, nullable: true }
        work: { $ref: "#/components/schemas/IncomeCommandState" }
        slut:
          allOf:
            - $ref: "#/components/schemas/IncomeCommandState"
            - type: object
              required: [eligible]
              properties:
                eligible: { type: boolean }

    IncomeCommandResult:
      type: object
      required: [command, outcome, amount, cooldownEndsAt]
      properties:
        command: { type: string, enum: [work, slut] }
        outcome: { type: string, enum: [earned, fined] }
        amount: { type: integer, description: "Signed delta in eddies (negative on a fine)." }
        balance: { type: integer }
        cooldownEndsAt: { type: string, format: date-time }

    PendingEditSummary:
      type: object
      required: [id, characterId, characterName, submittedBy, status, submittedAt, approveCount, rejectCount, threshold, voters]
      properties:
        id: { type: integer }
        characterId: { type: integer }
        characterName: { type: string }
        submittedBy: { type: string }
        submitterName: { type: ["string", "null"] }
        submitterAvatarUrl: { type: ["string", "null"] }
        proposedDiff:
          type: object
          additionalProperties: true
        changedFields:
          type: array
          description: "Field names that meaningfully changed (canonical compare vs the before-snapshot). Excludes no-op keys present in proposedDiff, so the count matches the detail page's diff."
          items: { type: string }
        updateNote: { type: ["string", "null"] }
        status: { type: string, enum: [pending, approved, rejected, cancelled, changes_requested, closed] }
        decisionSummary: { type: ["string", "null"] }
        reviewComment: { type: ["string", "null"], description: "Reviewer's comment when changes were requested." }
        overriddenBy: { type: ["string", "null"], description: "Admin user id if approved via override." }
        submittedAt: { type: string, format: date-time }
        lastActivityAt: { type: string, format: date-time }
        decidedAt: { type: ["string", "null"], format: date-time }
        approveCount: { type: integer }
        rejectCount: { type: integer }
        pauseCount: { type: integer, description: "Pause markers — visible flag only, never counted toward the decision threshold." }
        threshold: { type: integer }
        myVote: { $ref: "#/components/schemas/ReviewerSelfVote" }
        eligibleReviewers:
          type: array
          description: "Full roster of reviewers eligible to vote on this edit (excludes the submitter). Present on the reviewer-facing pending list."
          items: { $ref: "#/components/schemas/EligibleReviewer" }
        voters:
          type: array
          items:
            type: object
            required: [id, vote]
            properties:
              id: { type: string }
              name: { type: ["string", "null"] }
              avatarUrl: { type: ["string", "null"] }
              vote: { type: string, enum: [approve, reject, pause] }

    PendingEditVoteRecord:
      type: object
      required: [id, voterId, vote, votedAt]
      properties:
        id: { type: integer }
        voterId: { type: string }
        voterName: { type: ["string", "null"] }
        voterAvatarUrl: { type: ["string", "null"] }
        vote: { type: string, enum: [approve, reject, pause] }
        note: { type: ["string", "null"] }
        votedAt: { type: string, format: date-time }

    PendingEditDetail:
      type: object
      required: [id, characterId, characterName, submittedBy, proposedDiff, before, status, submittedAt, votes, eligibleVoterCount, threshold, approveCount, rejectCount, canVote]
      properties:
        id: { type: integer }
        characterId: { type: integer }
        characterName: { type: string }
        characterOwnerId: { type: ["string", "null"] }
        submittedBy: { type: string }
        submitterName: { type: ["string", "null"] }
        submitterAvatarUrl: { type: ["string", "null"] }
        proposedDiff:
          type: object
          additionalProperties: true
        before:
          type: object
          additionalProperties: true
        updateNote: { type: ["string", "null"] }
        status: { type: string, enum: [pending, approved, rejected, cancelled, changes_requested, closed] }
        decisionSummary: { type: ["string", "null"] }
        reviewComment: { type: ["string", "null"], description: "Reviewer's comment when changes were requested." }
        overriddenBy: { type: ["string", "null"], description: "Admin user id if approved via override." }
        submittedAt: { type: string, format: date-time }
        decidedAt: { type: ["string", "null"], format: date-time }
        votes:
          type: array
          items: { $ref: "#/components/schemas/PendingEditVoteRecord" }
        eligibleReviewers:
          type: array
          description: "Full roster of reviewers eligible to vote (excludes the submitter), so the UI can show who has not voted yet."
          items: { $ref: "#/components/schemas/EligibleReviewer" }
        eligibleVoterCount: { type: integer }
        threshold: { type: integer }
        approveCount: { type: integer }
        rejectCount: { type: integer }
        pauseCount: { type: integer, description: "Pause markers — visible flag only, never counted toward the decision threshold." }
        myVote:
          oneOf:
            - type: "null"
            - type: object
              properties:
                vote: { type: string, enum: [approve, reject, pause] }
                note: { type: ["string", "null"] }
                votedAt: { type: string, format: date-time }
        canVote: { type: boolean }
        canRequestChanges: { type: boolean }
        canOverride: { type: boolean }
        canResubmit: { type: boolean }
        canClose: { type: boolean, description: "True if the caller (any reviewer) may apply the diff and close this approved edit." }

    ReviewCloseInput:
      type: object
      properties:
        note: { type: string, maxLength: 2000, description: "Optional closing message recorded with the close/apply action. For custom requests it is also DM'd to the player along with the approve/reject decision (Tickety-style closing comment); for edits and sheets it is recorded in the audit trail only." }
        monthlyRent: { type: integer, description: "Custom request (property) only. Monthly rent applied to the new lease at CLOSE & APPLY." }
        kind: { type: string, enum: [residential, business], description: "Custom request (property) only. Lease kind set at CLOSE & APPLY." }
        businessName: { type: string, maxLength: 200, description: "Custom request (property) only. Optional business/property name for the lease; falls back to the request title." }
        district: { type: string, maxLength: 120, description: "Custom request (property) only. District applied to the off-map lease at CLOSE & APPLY (fixer-decided, mirrors the properties page)." }
        tier: { type: string, maxLength: 60, description: "Custom request (property) only. Tier applied to the off-map lease at CLOSE & APPLY (fixer-decided, mirrors the properties page)." }
        cwp: { type: integer, description: "Custom request (cyberware) only. Chrome points applied at CLOSE & APPLY." }
        slot: { type: string, maxLength: 120, description: "Custom request (cyberware) only. Body-system slot (catalog category) applied at CLOSE & APPLY (fixer-decided)." }
        category: { type: string, maxLength: 60, description: "Custom request (gun) only. Firing category (Power/Tech/Smart) applied at CLOSE & APPLY (fixer-decided)." }
        weaponType: { type: string, maxLength: 60, description: "Custom request (gun) only. Weapon type (Pistol/SMG/…) applied at CLOSE & APPLY (fixer-decided)." }
        fireMode: { type: string, maxLength: 60, description: "Custom request (gun) only. Fire mode (Semi-Auto/Burst/Full-Auto) applied at CLOSE & APPLY (fixer-decided)." }
        powerLevel: { type: string, maxLength: 60, description: "Custom request (gun) only. Weight/power class (L/M/H) applied at CLOSE & APPLY (fixer-decided)." }
        manufacturer: { type: string, maxLength: 120, description: "Custom request (gun) only. Optional manufacturer applied at CLOSE & APPLY (fixer-decided)." }
        unitCost: { type: integer, description: "Custom request (venue_stock) only. Unit cost applied at CLOSE & APPLY." }
        retail: { type: integer, description: "Custom request (venue_stock) only. Retail price applied at CLOSE & APPLY." }
        qty: { type: integer, description: "Custom request (venue_stock) only. Quantity applied at CLOSE & APPLY." }
        sheetCyberware:
          type: array
          description: "Character sheet (close) only. Per-item mechanical attributes for CUSTOM (non-catalog) cyberware, keyed by index in the sheet's cyberware array. Catalog cyberware auto-resolves from the catalog and must be omitted."
          items:
            type: object
            required: [index, cwp, slot]
            properties:
              index: { type: integer, minimum: 0, description: "0-based index into the sheet's cyberware array." }
              cwp: { type: integer, description: "Chrome points applied at CLOSE & APPLY." }
              slot: { type: string, maxLength: 120, description: "Body-system slot applied at CLOSE & APPLY." }
        sheetGuns:
          type: array
          description: "Character sheet (close) only. Per-item mechanical attributes for CUSTOM (non-catalog) guns, keyed by index in the sheet's guns array. Catalog guns auto-resolve from the catalog and must be omitted."
          items:
            type: object
            required: [index, category, weaponType, fireMode, powerLevel]
            properties:
              index: { type: integer, minimum: 0, description: "0-based index into the sheet's guns array." }
              category: { type: string, maxLength: 60, description: "Firing category (Power/Tech/Smart) applied at CLOSE & APPLY." }
              weaponType: { type: string, maxLength: 60, description: "Weapon type (Pistol/SMG/…) applied at CLOSE & APPLY." }
              fireMode: { type: string, maxLength: 60, description: "Fire mode (Semi-Auto/Burst/Full-Auto) applied at CLOSE & APPLY." }
              powerLevel: { type: string, maxLength: 60, description: "Weight/power class (L/M/H) applied at CLOSE & APPLY." }
              manufacturer: { type: string, maxLength: 120, description: "Optional manufacturer applied at CLOSE & APPLY." }

    PendingEditVoteInput:
      type: object
      required: [vote]
      properties:
        vote: { type: string, enum: [approve, reject, pause], description: "Pause is a visible marker only — it never counts toward the decision threshold." }
        note: { type: string, maxLength: 2000 }

    PendingEditVoteResult:
      type: object
      required: [ok, status, approveCount, rejectCount, threshold, eligibleVoterCount]
      properties:
        ok: { type: boolean }
        status: { type: string, enum: [pending, approved, rejected] }
        approveCount: { type: integer }
        rejectCount: { type: integer }
        pauseCount: { type: integer }
        threshold: { type: integer }
        eligibleVoterCount: { type: integer }

    DiceRollInput:
      type: object
      required: [expression]
      properties:
        expression: { type: string, minLength: 1, maxLength: 64, description: "e.g. 1d20+5, 4d6kh3" }
        label: { type: string }
        characterId: { type: integer }

    DiceRollResult:
      type: object
      required: [id, expression, total, rolls, createdAt]
      properties:
        id: { type: integer }
        expression: { type: string }
        label: { type: ["string", "null"] }
        characterId: { type: ["integer", "null"] }
        characterName: { type: ["string", "null"] }
        rolls:
          type: array
          items: { type: integer }
        modifier: { type: integer }
        total: { type: integer }
        createdAt: { type: string, format: date-time }

    CyberpsychoAccessInput:
      type: object
      required: [enabled]
      properties:
        enabled: { type: boolean }

    CyberpsychoAccessResult:
      type: object
      required: [id, cyberpsychoAccess]
      properties:
        id: { type: string }
        cyberpsychoAccess: { type: boolean }

    AdminUser:
      type: object
      required: [id, discordId, username, roles, isAdmin]
      properties:
        id: { type: string }
        discordId: { type: string }
        username: { type: string }
        globalName: { type: ["string", "null"] }
        avatarUrl: { type: ["string", "null"] }
        roles:
          type: array
          items: { type: string }
        isAdmin: { type: boolean }
        isFixer: { type: boolean }
        isTrialFixer: { type: boolean, description: "Display-only: true when this fixer is still on trial (derived from the Trial Fixer role id)." }
        isCsApprover: { type: boolean }
        isRipperdoc: { type: boolean }
        isStoreOwner: { type: boolean }
        cyberpsychoAccess: { type: boolean, description: "Per-user CyberPsycho control panel grant (independent of staff roles)." }
        characterCount: { type: integer }
        lastSeenAt: { type: ["string", "null"], format: date-time }
        characters:
          type: array
          items: { $ref: "#/components/schemas/Character" }

    DiscordMemberOption:
      type: object
      required: [id, username, hasAccount]
      properties:
        id: { type: string }
        username: { type: string }
        globalName: { type: ["string", "null"] }
        avatarUrl: { type: ["string", "null"] }
        hasAccount: { type: boolean }

    DiscordChannelOption:
      type: object
      required: [id, name]
      properties:
        id: { type: string }
        name: { type: string }

    WalletAdjustmentInput:
      type: object
      required: [characterId, amount, reason]
      properties:
        characterId: { type: integer }
        amount: { type: integer, description: "positive or negative" }
        reason: { type: string, minLength: 1 }

    JobRunInput:
      type: object
      required: [job]
      properties:
        job: { type: string, enum: [cyberware_humanity, monthly_rent, role_sync, eviction_sweep, discord_event_sync, mission_thread_backfill] }

    JobRunResult:
      type: object
      required: [id, job, status, startedAt]
      properties:
        id: { type: integer }
        job: { type: string }
        status: { type: string, enum: [running, success, failed] }
        startedAt: { type: string, format: date-time }
        finishedAt: { type: ["string", "null"], format: date-time }
        message: { type: ["string", "null"] }
        affectedCount: { type: ["integer", "null"] }

    DashboardSummary:
      type: object
      required: [characterCount, activeCharacterCount, totalEddies, openShops, attendingCount, loaCount]
      properties:
        characterCount: { type: integer }
        activeCharacterCount: { type: integer }
        totalEddies: { type: integer }
        openShops: { type: integer }
        attendingCount: { type: integer }
        loaCount: { type: integer }
        topFixers:
          type: array
          items: { $ref: "#/components/schemas/LeaderboardEntry" }
        recentArrivals:
          type: array
          description: |
            Roster tile data only. Intentionally excludes sheet body fields
            (background, sheetData, ownerId, importedFromThreadId, …) because
            character sheets are owner/staff-only — see /directory/characters/:id.
          items:
            type: object
            required: [id, name, kind, createdAt]
            properties:
              id: { type: integer }
              name: { type: string }
              kind: { type: string, enum: [pc, npc] }
              archetype: { type: ["string", "null"] }
              portraitUrl: { type: ["string", "null"] }
              createdAt: { type: string, format: date-time }

    UpcomingBills:
      type: object
      required: [rent, meds, cyberwareStatus, leases, totals]
      properties:
        rent:
          type: array
          items:
            type: object
            required: [characterId, characterName, amount, dueAt]
            properties:
              characterId: { type: integer }
              characterName: { type: string }
              amount: { type: integer }
              dueAt: { type: string, format: date-time }
        meds:
          type: array
          description: "Player-level cyberpsychosis meds bill (one entry per player, not per character). Empty if no PC has 7+ chrome."
          items:
            type: object
            required: [anchorCharacterId, anchorCharacterName, maxChromeCount, level, weeksUnpaid, household, multiplier, baseCharge, amount, dueAt]
            properties:
              anchorCharacterId: { type: ["integer", "null"], description: "Character driving the band (highest chrome count) — for UI linking only." }
              anchorCharacterName: { type: ["string", "null"] }
              maxChromeCount: { type: integer, description: "Highest cyberware count across the player's PCs (inventory_items category=cyberware)." }
              level: { type: string, description: "Auto-derived risk band from max chrome count: none|medium|high|extreme." }
              weeksUnpaid: { type: integer, description: "Weeks since the household's most recent ripperdoc checkup (capped at 12)." }
              household: { type: integer, description: "Number of the player's PCs that own chrome (>= 7 pieces)." }
              multiplier: { type: number, description: "Household-size multiplier applied to the base charge (1.0 + 0.25 per extra billable character)." }
              baseCharge: { type: integer, description: "Charge before the household multiplier." }
              amount: { type: integer, description: "Final charge for the player (baseCharge * multiplier, floored)." }
              dueAt: { type: string, format: date-time }
        cyberwareStatus:
          type: object
          description: "Household-level cyberware billing context — what the next weekly cron tick will see."
          required: [lastCheckupAt, weeksUnpaid, household, multiplier, topBand, breakdown]
          properties:
            lastCheckupAt: { type: ["string", "null"], format: date-time }
            weeksUnpaid: { type: integer }
            household: { type: integer, description: "Number of player's PCs with chrome >= 7 (i.e. 'above 6')." }
            multiplier: { type: number }
            topBand: { type: string, description: "Risk band currently driving the bill: none|medium|high|extreme." }
            breakdown:
              type: array
              description: "All of the player's PCs that own at least one piece of chrome, sorted by chrome count descending. Used to populate dashboard tooltips."
              items:
                type: object
                required: [characterId, characterName, chromeCount, band]
                properties:
                  characterId: { type: integer }
                  characterName: { type: string }
                  chromeCount: { type: integer }
                  band: { type: string, description: "none|medium|high|extreme based on this character's chrome count alone." }
        leases:
          type: array
          items:
            type: object
            required: [id, characterId, characterName, address, monthlyRent]
            properties:
              id: { type: integer }
              characterId: { type: integer }
              characterName: { type: string }
              address: { type: string }
              monthlyRent: { type: integer }
              paidThrough: { type: ["string", "null"], format: date-time }
        totals:
          type: object
          required: [nextRent, nextMedsWeekly, monthlyEstimate]
          properties:
            nextRent: { type: integer }
            nextMedsWeekly: { type: integer }
            monthlyEstimate: { type: integer }

    MissionAssignmentView:
      type: object
      required: [id, userId, paymentStatus]
      properties:
        id: { type: integer }
        userId: { type: string }
        userName: { type: ["string", "null"] }
        userAvatarUrl: { type: ["string", "null"] }
        characterId: { type: ["integer", "null"] }
        characterName: { type: ["string", "null"] }
        characterPortraitUrl: { type: ["string", "null"] }
        attendanceCreditedAt: { type: ["string", "null"], format: date-time }
        participationStatus:
          type: ["string", "null"]
          enum: [accepted, pending, null]
          description: "Whether the assigned player has confirmed the invite. accepted = player accepted; pending = awaiting their response; null = no confirmation request (e.g. fixer self-assigned)."
        paymentStatus: { type: string, enum: [unpaid, paid, failed, simulated] }
        payAmount: { type: ["integer", "null"] }
        paymentError: { type: ["string", "null"] }
        paidAt: { type: ["string", "null"], format: date-time }

    MissionActorPaymentView:
      type: object
      required: [id, userId, amount, paymentStatus, source, createdAt]
      properties:
        id: { type: integer }
        userId: { type: string }
        userName: { type: ["string", "null"] }
        characterId: { type: ["integer", "null"] }
        characterName: { type: ["string", "null"] }
        amount: { type: integer }
        paymentStatus: { type: string, enum: [paid, failed, simulated] }
        source: { type: string, enum: [manual, auto] }
        paymentError: { type: ["string", "null"] }
        fixerId: { type: ["string", "null"], description: "User id of the fixer/admin who issued this actor payment." }
        fixerName: { type: ["string", "null"], description: "Display name of the fixer/admin who issued this actor payment." }
        paidAt: { type: ["string", "null"], format: date-time }
        createdAt: { type: string, format: date-time }

    MissionSummary:
      type: object
      required: [id, title, tier, status, workflowState, slots, assignedCount, playerPay, durationMinutes, maxPlayers, createdAt, players]
      properties:
        id: { type: integer }
        title: { type: string }
        tier: { type: integer, enum: [1, 2, 3, 4] }
        status: { type: string, enum: [open, pending, completed, completed_players_paid, completed_paid, cancelled] }
        workflowState: { type: string, enum: [draft, proposal, approved, posted] }
        startAt: { type: ["string", "null"], format: date-time }
        durationMinutes: { type: integer }
        location: { type: ["string", "null"] }
        descriptionPreview: { type: ["string", "null"] }
        imageUrl: { type: ["string", "null"] }
        playerPay: { type: integer }
        npcPayAmount: { type: integer, description: "Eddies paid to each NPC sign-up confirmed as attended." }
        slots: { type: integer }
        jobType: { type: ["string", "null"], enum: [combat, non_combat, mixed, null] }
        requestedSkills: { type: ["string", "null"] }
        client: { type: ["string", "null"] }
        maxPlayers: { type: integer }
        assignedCount: { type: integer }
        fixerId: { type: ["string", "null"] }
        fixerName: { type: ["string", "null"] }
        fixerAvatarUrl: { type: ["string", "null"] }
        fixerIsTrial: { type: boolean, description: "Display-only: true when the owning fixer is still on trial." }
        discordEventId: { type: ["string", "null"] }
        discordSyncError: { type: ["string", "null"] }
        myCharacterId: { type: ["integer", "null"] }
        myCharacterName: { type: ["string", "null"] }
        myPaymentStatus: { type: ["string", "null"] }
        myApplication:
          oneOf:
            - $ref: "#/components/schemas/MissionApplicationView"
            - type: "null"
          description: "The caller's own application on this mission (null if none); powers the inline apply/withdraw button."
        npcSignupOpen: { type: boolean, description: "True when this mission is currently accepting NPC sign-ups." }
        mySignup:
          oneOf:
            - $ref: "#/components/schemas/MissionNpcMySignupView"
            - type: "null"
          description: "The caller's own NPC sign-up (any state); null if none."
        players:
          type: array
          description: "Assigned characters (deduped), each clickable."
          items:
            type: object
            required: [characterId, name]
            properties:
              characterId: { type: integer }
              name: { type: string }
              portraitUrl: { type: ["string", "null"] }
              userId: { type: ["string", "null"] }
        createdAt: { type: string, format: date-time }

    MissionHistoryPage:
      type: object
      required: [items, hasMore]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/MissionSummary" }
        hasMore:
          type: boolean
          description: "True when more rows exist beyond this page (fetch with offset += limit)."

    ActingEntry:
      type: object
      required: [id, actedAt, amount, source]
      properties:
        id: { type: string, description: "Stable synthetic id (e.g. act-12 / legacy-7)." }
        name: { type: ["string", "null"], description: "Mission or event name acted in." }
        actedAt: { type: string, format: date-time, description: "When the act happened." }
        amount: { type: integer, description: "Eddies paid for the act." }
        source: { type: string, enum: [mission, event, legacy, npc], description: "mission = tied to a scheduled mission; event = free-form payout; npc = NPC sign-up payout; legacy = imported from the old bot." }
        paymentStatus: { type: ["string", "null"], description: "paid/failed for modern rows; null for legacy." }
        fixerName: { type: ["string", "null"] }

    MissionDetail:
      type: object
      required: [id, title, tier, status, workflowState, slots, playerPay, durationMinutes, maxPlayers, canManage, canEdit, canApprove, canComplete, canUncomplete, live, assignments, actorPayments, applications, createdAt]
      properties:
        id: { type: integer }
        title: { type: string }
        tier: { type: integer, enum: [1, 2, 3, 4] }
        status: { type: string, enum: [open, pending, completed, completed_players_paid, completed_paid, cancelled] }
        workflowState: { type: string, enum: [draft, proposal, approved, posted] }
        startAt: { type: ["string", "null"], format: date-time }
        durationMinutes: { type: integer }
        location: { type: ["string", "null"] }
        description: { type: ["string", "null"] }
        imageUrl: { type: ["string", "null"] }
        playerPay: { type: integer }
        npcPayAmount: { type: integer, description: "Eddies paid to each NPC sign-up confirmed as attended." }
        slots: { type: integer }
        jobType: { type: ["string", "null"], enum: [combat, non_combat, mixed, null] }
        requestedSkills: { type: ["string", "null"] }
        client: { type: ["string", "null"] }
        notesForPlayers: { type: ["string", "null"] }
        maxPlayers: { type: integer }
        worldLink: { type: ["string", "null"], description: "Staff-only world/join link (null for players)." }
        fixerNotes: { type: ["string", "null"], description: "Fixer-only briefing text. Only returned to viewers who can manage the mission (Fixer tab); null/omitted for players." }
        fixerId: { type: ["string", "null"] }
        fixerName: { type: ["string", "null"] }
        fixerAvatarUrl: { type: ["string", "null"] }
        fixerIsTrial: { type: boolean, description: "Display-only: true when the owning fixer is still on trial." }
        discordEventId: { type: ["string", "null"] }
        discordSyncError: { type: ["string", "null"] }
        canManage: { type: boolean, description: "True if caller is fixer/admin (sees Fixer tab + tools)." }
        canEdit: { type: boolean, description: "True if caller may edit + submit this mission: full managers OR the trial fixer who owns it. Narrower than canManage (no payments/post/complete)." }
        canApprove: { type: boolean, description: "True if caller is archivist/admin (can approve proposals)." }
        completedAt: { type: ["string", "null"], format: date-time, description: "Set when manually marked completed; while set, actor payments are locked." }
        completedBy: { type: ["string", "null"], description: "User id who marked the mission completed." }
        completedByName: { type: ["string", "null"], description: "Display name of who marked the mission completed." }
        canComplete: { type: boolean, description: "True if caller may mark this mission completed (owning fixer/admin/archivist, not already completed)." }
        canUncomplete: { type: boolean, description: "True if caller may reopen a completed mission (admin/archivist only)." }
        live: { type: boolean, description: "True = Live mode; false = Test mode (no real external effects)." }
        assignments:
          type: array
          items: { $ref: "#/components/schemas/MissionAssignmentView" }
        actorPayments:
          type: array
          items: { $ref: "#/components/schemas/MissionActorPaymentView" }
        applications:
          type: array
          description: "Player applications (full list for managers; empty for players)."
          items: { $ref: "#/components/schemas/MissionApplicationView" }
        myApplication:
          oneOf:
            - $ref: "#/components/schemas/MissionApplicationView"
            - type: "null"
          description: "The caller's own application (players only); null for managers or no application."
        npcSignupOpen: { type: boolean, description: "True when this mission is currently accepting NPC sign-ups." }
        mySignup:
          oneOf:
            - $ref: "#/components/schemas/MissionNpcMySignupView"
            - type: "null"
          description: "The caller's own NPC sign-up (any state); null if none."
        npcSignups:
          type: array
          description: "Full NPC sign-up roster (managers only; empty for players)."
          items: { $ref: "#/components/schemas/MissionNpcSignupView" }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: ["string", "null"], format: date-time }

    MissionApplicationView:
      type: object
      required: [id, userId, characterId, status, createdAt, attendanceCount, recencyWarning]
