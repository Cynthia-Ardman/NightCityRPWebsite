        recurrence:
          oneOf:
            - $ref: "#/components/schemas/EventRecurrence"
            - type: "null"
          description: "Recurrence rule (null = single occurrence); expanded onto the calendar client-side."
        signups:
          type: array
          description: "Full NPC sign-up roster (managers only, detail view only)."
          items: { $ref: "#/components/schemas/EventSignupView" }
        paidActorUserIds:
          type: array
          description: "userIds already paid as an actor for this event (managers, detail only). Locks paid NPCs in the roster."
          items: { type: string }
        ticketTypes:
          type: array
          description: "Purchasable ticket tiers (detail view only). Archived tiers are hidden for non-managers."
          items: { $ref: "#/components/schemas/EventTicketTypeView" }
        myTickets:
          type: array
          description: "The caller's own tickets on this event (detail view only)."
          items: { $ref: "#/components/schemas/EventTicketView" }
        canCheckIn: { type: boolean, description: "True if the caller may open the check-in roster (manager or designated check-in staff)." }
        ticketPayoutMode: { type: string, enum: [runner, sink], description: "Ticket revenue destination (managers only, detail view)." }
        ticketRunnerUserId: { type: ["string", "null"], description: "Credited user in runner mode; null = event creator (managers only)." }
        ticketRunnerName: { type: ["string", "null"], description: "Display name for ticketRunnerUserId (managers only)." }
