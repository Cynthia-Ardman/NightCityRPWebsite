        id: { type: integer }
        userId: { type: string }
        userName: { type: ["string", "null"] }
        userAvatarUrl: { type: ["string", "null"] }
        characterId: { type: integer }
        characterName: { type: ["string", "null"] }
        characterPortraitUrl: { type: ["string", "null"] }
        comment: { type: ["string", "null"] }
        availability:
          type: array
          description: "When2Meet availability for this applicant: absolute UTC instant strings (30-min blocks). Optional — empty when none supplied."
          items: { type: string, format: date-time }
        status: { type: string, enum: [pending, accepted, withdrawn, rejected] }
        reviewedBy: { type: ["string", "null"] }
        reviewedAt: { type: ["string", "null"], format: date-time }
        createdAt: { type: string, format: date-time }
        attendanceCount: { type: integer }
        lastAttendedAt: { type: ["string", "null"], format: date-time }
        daysSinceLastMission: { type: ["integer", "null"] }
        recencyWarning: { type: boolean, description: "True if the character played a mission within the recency window." }

    MissionApplicationOutcome:
      type: object
      required: [id, missionId, missionTitle, characterId, status]
      properties:
        id: { type: integer }
        missionId: { type: integer }
        missionTitle: { type: string }
        characterId: { type: integer }
        characterName: { type: ["string", "null"] }
        status: { type: string, enum: [accepted, rejected] }
        reviewedAt: { type: ["string", "null"], format: date-time }

    MissionApplicationListItem:
      type: object
      required: [id, missionId, missionTitle, missionStatus, characterId, status, createdAt]
      properties:
        id: { type: integer }
        missionId: { type: integer }
        missionTitle: { type: string }
        missionStatus: { type: string, enum: [open, pending, completed, completed_players_paid, completed_paid, cancelled] }
        missionStartAt: { type: ["string", "null"], format: date-time }
        fixerName: { type: ["string", "null"] }
        characterId: { type: integer }
        characterName: { type: ["string", "null"] }
        characterPortraitUrl: { type: ["string", "null"] }
        comment: { type: ["string", "null"] }
        status: { type: string, enum: [pending, accepted, withdrawn, rejected] }
        reviewedAt: { type: ["string", "null"], format: date-time }
        createdAt: { type: string, format: date-time }

    ApplyToMissionInput:
      type: object
      required: [characterId]
      properties:
        characterId: { type: integer }
        comment: { type: ["string", "null"] }
        availability:
          type: array
          description: "When2Meet availability: absolute UTC instant strings, one per selected 30-minute block."
          items: { type: string, format: date-time }
        makeDefault:
          type: boolean
          description: "Persist the supplied weekly pattern + timezone as this player's saved default."
        defaultPattern:
          type: array
          description: "Weekly availability pattern (only stored when makeDefault is true)."
          items: { $ref: "#/components/schemas/AvailabilitySlot" }
        timezone: { type: ["string", "null"], description: "IANA timezone the pattern was captured in." }

    AvailabilitySlot:
      type: object
      required: [weekday, minutes]
      properties:
        weekday: { type: integer, description: "0 = Sunday … 6 = Saturday." }
        minutes: { type: integer, description: "Minutes from local midnight (0-1410, 30-min steps)." }

    DefaultAvailability:
      type: object
      required: [pattern, timezone]
      properties:
        pattern:
          type: array
          items: { $ref: "#/components/schemas/AvailabilitySlot" }
        timezone: { type: ["string", "null"] }

    ReviewApplicationInput:
      type: object
      required: [action]
      properties:
        action: { type: string, enum: [accept, reject] }

    NpcSignupInput:
      type: object
      properties:
        characterId: { type: ["integer", "null"], description: "Optionally one of your own characters to NPC as." }

    ConfirmNpcSignupInput:
      type: object
      required: [action]
      properties:
        action: { type: string, enum: [attended, no_show], description: "attended pays npcPayAmount; no_show resolves with no payout." }

    MissionNpcMySignupView:
      type: object
      required: [id, state, paymentStatus]
      properties:
        id: { type: integer }
        characterId: { type: ["integer", "null"] }
        characterName: { type: ["string", "null"] }
        state: { type: string, enum: [signed_up, attended, no_show] }
        payAmount: { type: ["integer", "null"] }
        paymentStatus: { type: string, enum: [unpaid, processing, paid, failed, simulated] }
        paidAt: { type: ["string", "null"], format: date-time }

    MissionNpcSignupView:
      type: object
      required: [id, userId, state, paymentStatus, createdAt]
      properties:
        id: { type: integer }
        userId: { type: string }
        userName: { type: ["string", "null"] }
        userAvatarUrl: { type: ["string", "null"] }
        characterId: { type: ["integer", "null"] }
        characterName: { type: ["string", "null"] }
        characterPortraitUrl: { type: ["string", "null"] }
        state: { type: string, enum: [signed_up, attended, no_show] }
        payAmount: { type: ["integer", "null"] }
        paymentStatus: { type: string, enum: [unpaid, processing, paid, failed, simulated] }
        paymentError: { type: ["string", "null"] }
        paidAt: { type: ["string", "null"], format: date-time }
        createdAt: { type: string, format: date-time }

    MissionConflictCheck:
      type: object
      required: [checked, conflicts]
      properties:
        checked: { type: boolean, description: "False if Discord couldn't be reached (fail-safe; never blocks)." }
        error: { type: ["string", "null"] }
        conflicts:
          type: array
          items:
            type: object
            required: [id, name, startAt]
            properties:
              id: { type: string }
              name: { type: string }
              startAt: { type: string, format: date-time }
              endAt: { type: ["string", "null"], format: date-time }

    ConfirmEventNpcSignupInput:
      type: object
      required: [action]
      properties:
        action: { type: string, enum: [attended, no_show], description: "attended pays the supplied amount; no_show resolves with no payout." }
        amount: { type: integer, minimum: 0, description: "Per-person payout for attended (€$); required when action is attended." }

    EventSignupView:
      type: object
      required: [id, userId, state, paymentStatus, createdAt]
      properties:
        id: { type: integer }
        userId: { type: string }
        userName: { type: ["string", "null"] }
        characterId: { type: ["integer", "null"] }
        characterName: { type: ["string", "null"] }
        note: { type: ["string", "null"] }
        state: { type: string, enum: [signed_up, attended, no_show] }
        payAmount: { type: ["integer", "null"] }
        paymentStatus: { type: string, enum: [unpaid, processing, paid, failed, simulated] }
        paymentError: { type: ["string", "null"] }
        paidAt: { type: ["string", "null"], format: date-time }
        createdAt: { type: ["string", "null"], format: date-time }
        occurrenceStartAt: { type: ["string", "null"], format: date-time, description: "For recurring events, the concrete occurrence this signup targets. Null = the event's single/base occurrence (or a legacy row, treated as the event's current startAt)." }

    EventRecurrence:
      type: object
      required: [frequency, interval]
      description: "Normalised recurrence rule (Discord). frequency: 0=yearly, 1=monthly, 2=weekly, 3=daily. byWeekday uses 0=Mon..6=Sun."
      properties:
        frequency: { type: integer }
        interval: { type: integer }
        byWeekday:
          oneOf:
            - type: array
              items: { type: integer }
            - type: "null"
        count: { type: ["integer", "null"] }
