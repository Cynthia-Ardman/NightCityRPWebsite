      properties:
        easy:
          type: array
          items: { $ref: "#/components/schemas/BreachLeaderboardEntry" }
        medium:
          type: array
          items: { $ref: "#/components/schemas/BreachLeaderboardEntry" }
        hard:
          type: array
          items: { $ref: "#/components/schemas/BreachLeaderboardEntry" }
        very_hard:
          type: array
          items: { $ref: "#/components/schemas/BreachLeaderboardEntry" }
        nightmare:
          type: array
          items: { $ref: "#/components/schemas/BreachLeaderboardEntry" }
    ReviewComment:
