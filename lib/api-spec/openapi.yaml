    post:
      operationId: createInstallOwnedOffer
      tags: [ripperdocs]
      summary: Offer to install a cyberware piece the patient already owns (leaves a PENDING offer the player approves; optional fee)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/InstallOwnedInput" }
      responses:
        "201":
          description: Pending install offer created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SaleOffer" }
        "400": { description: "Item is not an uninstalled cyberware piece, or character archived" }
        "403": { description: Not authorized to operate this clinic }
        "404": { description: "Venue, character, or cyberware not found" }
        "409": { description: Character unclaimed or CWP capacity exceeded }
